    Arrays.sort(meetings, (a, b) -> Integer.compare(a[0], b[0]));\n        PriorityQueue<Integer> free = new PriorityQueue<>();\n        for (int i = 0; i < n; i++) free.offer(i);\n        PriorityQueue<long[]> busy = new PriorityQueue<>((a, b) -> a[0] != b[0] ? Long.compare(a[0], b[0]) : Long.compare(a[1], b[1])); // {endTime, room}\n        int[] count = new int[n];\n        for (int[] m : meetings) {\n            long start = m[0], dur = m[1] - m[0];\n            while (!busy.isEmpty() && busy.peek()[0] <= start) free.offer((int) busy.poll()[1]);\n            if (free.isEmpty()) {                       // wait for the earliest room\n                long[] b = busy.poll();\n                busy.offer(new long[]{b[0] + dur, b[1]});\n                count[(int) b[1]]++;\n            } else {\n                int room = free.poll();\n                busy.offer(new long[]{start + dur, room});\n                count[room]++;\n            }\n        }\n        int best = 0;\n        for (int i = 1; i < n; i++) if (count[i] > count[best]) best = i;\n        return best;\n    }\n\n    // rearrange so no two adjacent chars are equal (\"\" if impossible)\n    public String reorganizeString(String s) {\n        int[] f = new int[26];\n        for (char c : s.toCharArray()) f[c - 'a']++;\n        PriorityQueue<int[]> pq = new PriorityQueue<>((a, b) -> b[1] - a[1]);\n        for (int i = 0; i < 26; i++) if (f[i] > 0) pq.offer(new int[]{i, f[i]});\n        StringBuilder sb = new StringBuilder();\n        int[] prev = null;\n        while (!pq.isEmpty()) {\n            int[] cur = pq.poll();\n            sb.append((char) ('a' + cur[0]));\n            cur[1]--;\n            if (prev != null && prev[1] > 0) pq.offer(prev);   // previous char is allowed again\n            prev = cur;\n        }\n        return sb.length() == s.length() ? sb.toString() : \"\";\n    }\n}","example":{"problem":"Meeting Rooms III","input":"n = 2, meetings = [[0,10], [1,5], [2,7], [3,4]]","cols":["meeting","free rooms","busy (end, room)","decision","counts [r0, r1]"],"rows":[["[0,10]","0, 1","—","room 0, ends 10","[1, 0]"],["[1,5]","1","(10, 0)","room 1, ends 5","[1, 1]"],["[2,7]","—","(5, 1), (10, 0)","wait for room 1 → runs 5–10","[1, 2]"],["[3,4]","—","(10, 0), (10, 1)","tie at 10 → room 0, runs 10–11","[2, 2]"]],"result":"tie 2–2 → lowest id, room 0"}},"greedy/all":{"intuition":"A greedy method makes the best-looking choice right now and never goes back. It is only correct if you can explain why that choice is always safe: swapping it into any best answer would not make that answer worse. If you can find a small example where the choice goes wrong, use DP instead.\n\nExample (Jump Game): `[2, 3, 1, 1, 4]`. Track the furthest index you can reach. From index 0 you reach 2. From index 1 you reach 1+3 = 4, which is the last index, so the answer is true. For `[3, 2, 1, 0, 4]` the furthest reach stays at 3, and index 4 is beyond it, so the answer is false.\n\nOther common forms: sort by end time and keep what fits, or keep a running balance and reset when it goes negative (Gas Station).","approach":["Find the decision you make again and again (how far to jump, which interval to keep, where to start).","Propose a simple rule: furthest reach, earliest end, largest first, reset when negative.","Test it on a few small cases, and try to break it. If you can break it, the problem needs DP.","Write it as one pass, usually after sorting.","For rules from both sides (Candy), do one pass left to right and one right to left, then combine."],"time":"O(n) or O(n log n) with sorting","space":"O(1) to O(n)","identify":["Choices can be made in a fixed order and a locally best choice never blocks a better global answer (you can prove it by swapping).","Only a single running quantity matters (furthest index reachable, current fuel balance, current window of reach).","Sorting by one key (end time, ratio, deadline, size) makes the decision obvious at each step.","Constraints are large (n up to 10^5) and there is no obvious subproblem overlap; a sign the intended solution is a greedy sweep."],"contrasts":[["Coin change with arbitrary denominations","Greedy fails (e.g. coins 1, 3, 4 for 6) → DP."],["Jump Game with costs","Minimum total cost → DP / Dijkstra, not reachability greedy."],["0/1 knapsack","Fractional knapsack is greedy; 0/1 knapsack needs DP."]],"code":"class Solution {\n    public boolean canJump(int[] a) {\n        int reach = 0;\n        for (int i = 0; i < a.length; i++) {\n            if (i > reach) return false;              // stuck before i\n            reach = Math.max(reach, i + a[i]);\n        }\n        return true;\n    }\n\n    // minimum jumps: BFS by levels, each level is a range of indices\n    public int jump(int[] a) {\n        int jumps = 0, curEnd = 0, farthest = 0;\n        for (int i = 0; i < a.length - 1; i++) {\n            farthest = Math.max(farthest, i + a[i]);\n            if (i == curEnd) { jumps++; curEnd = farthest; }   // must jump to extend\n        }\n        return jumps;\n    }\n\n    // gas station: if the tank goes negative, no start in [start, i] works\n    public int canCompleteCircuit(int[] gas, int[] cost) {\n        int total = 0, tank = 0, start = 0;\n        for (int i = 0; i < gas.length; i++) {\n            int d = gas[i] - cost[i];\n            total += d; tank += d;\n            if (tank < 0) { start = i + 1; tank = 0; }\n        }\n        return total >= 0 ? start : -1;\n    }\n\n    // candy: two passes, each satisfies one side's constraint\n    public int candy(int[] r) {\n        int n = r.length, sum = 0;\n        int[] c = new int[n];\n        Arrays.fill(c, 1);\n        for (int i = 1; i < n; i++) if (r[i] > r[i - 1]) c[i] = c[i - 1] + 1;\n        for (int i = n - 2; i >= 0; i--) if (r[i] > r[i + 1]) c[i] = Math.max(c[i], c[i + 1] + 1);\n        for (int x : c) sum += x;\n        return sum;\n    }\n}","example":{"problem":"Jump Game II","input":"a = [2, 3, 1, 1, 4]","cols":["i","i + a[i]","farthest","i == curEnd ?","jumps, curEnd"],"rows":[["0","2","2","yes","1, 2"],["1","4","4","no","1, 2"],["2","3","4","yes","2, 4"],["3","4","4","no","2, 4 (loop stops before last index)"]],"result":"2 jumps (0 → 1 → 4)"}},"trees/trav":{"intuition":"Every tree question starts with choosing how to visit the nodes. Depth-first (pre, in or post order) goes down one branch to the bottom first. Breadth-first visits level by level, using a queue.\n\nLevel questions become easy when you process the queue one level at a time: read the queue size first, then handle exactly that many nodes.\n\nExample: the tree with 3 at the root, children 9 and 20, and 20 having children 15 and 7. The queue starts with [3], size 1, giving level [3]. It then holds [9, 20], size 2, giving level [9, 20]. Then [15, 7]. Level order is [[3], [9,20], [15,7]]. The right side view takes the last node of each level: [3, 20, 7].","approach":["BFS: put the root in the queue. While it is not empty, read `size`, then process exactly `size` nodes and add their children.","Per-level answers come from that inner loop: the first or last node, a sum, a max or a list.","Zigzag: add to the front or the back of the level list, switching each level.","Iterative inorder: push the whole left chain onto a stack. Pop, visit, then go to the right child.","Vertical order or width: carry a column number (or index 2i / 2i+1 for width) with each node."],"time":"O(n)","space":"O(width) for BFS, O(height) for DFS","identify":["The answer is organised by depth (one value or list per level, the first/last node per level, minimum depth to a leaf).","Nodes must be visited in a specific order (inorder of a BST, serialisation order).","Positions matter (columns for vertical order, indices for width) → carry coordinates with each node.","Iterative traversal is required (no recursion, or you need to pause/resume like a BST iterator)."],"contrasts":[["Maximum depth / diameter / balanced","A value computed bottom-up from children → Depth & Recursive Properties."],["Paths that sum to target","Carry the path state down → Path Problems."],["Lowest common ancestor","Return-based search → LCA & Ancestors."]],"code":"class Solution {\n    public List<List<Integer>> levelOrder(TreeNode root) {\n        List<List<Integer>> res = new ArrayList<>();\n        if (root == null) return res;\n        Deque<TreeNode> q = new ArrayDeque<>();\n        q.offer(root);\n        while (!q.isEmpty()) {\n            int size = q.size();                    // nodes of the current level\n            List<Integer> level = new ArrayList<>();\n            for (int i = 0; i < size; i++) {\n                TreeNode n = q.poll();\n                level.add(n.val);\n                if (n.left != null) q.offer(n.left);\n                if (n.right != null) q.offer(n.right);\n            }\n            res.add(level);\n        }\n        return res;\n    }\n\n    public List<Integer> rightSideView(TreeNode root) {\n        List<Integer> res = new ArrayList<>();\n        for (List<Integer> level : levelOrder(root)) res.add(level.get(level.size() - 1));\n        return res;\n    }\n\n    public List<Integer> inorder(TreeNode root) {   // iterative\n        List<Integer> res = new ArrayList<>();\n        Deque<TreeNode> st = new ArrayDeque<>();\n        TreeNode cur = root;\n        while (cur != null || !st.isEmpty()) {\n            while (cur != null) { st.push(cur); cur = cur.left; }\n            cur = st.pop();\n            res.add(cur.val);\n            cur = cur.right;\n        }\n        return res;\n    }\n}","example":{"problem":"Binary Tree Level Order Traversal","input":"root = [3, 9, 20, null, null, 15, 7]","cols":["level","queue at start","size","values","children queued"],"rows":[["0","[3]","1","[3]","9, 20"],["1","[9, 20]","2","[9, 20]","15, 7"],["2","[15, 7]","2","[15, 7]","—"]],"result":"[[3], [9, 20], [15, 7]]"}},"trees/depth":{"intuition":"Many tree answers are built from the bottom up: a node's answer comes from its children's answers. Height = 1 + the bigger child height. A tree is balanced if both children are balanced and their heights differ by at most 1.\n\nSometimes the answer bends through a node, but the parent can only use one straight branch. Then return one thing (the height) and update a global best with another (left + right).\n\nExample (diameter): root 1 with children 2 and 3, and node 2 with children 4 and 5. Heights: 4, 5 and 3 are 1, and node 2 is 2. At node 1 the bent path is left 2 + right 1 = 3 edges (4-2-1-3). That is the diameter, while node 1 returns only its height, 3, to its parent.","approach":["Say clearly what your function returns for a subtree: a height, a sum, true/false, or a pair.","Handle null first (height 0, or true).","Call it on the left and right children, then combine the results (after the calls, post-order).","If the answer can bend through the node, update a global best with left + right, but return only the straight value (1 + max).","Use a special return value (e.g. -1 for \"not balanced\") to stop early."],"time":"O(n)","space":"O(h) recursion","identify":["A node's answer depends only on answers from its two subtrees (post-order dependency).","The optimal structure may bend at some node (diameter, max path sum) while a parent can extend only one side of it.","Two trees are compared node by node (same tree, symmetric, subtree) → recurse on pairs.","Mirror / invert / flatten; a structural transform applied recursively to each subtree."],"contrasts":[["Root-to-leaf paths with a sum","State flows down from the root → Path Problems."],["Level-based answers","BFS by levels → Traversal."],["Diameter of a general graph/tree with edge list","Two BFS passes or tree DP over adjacency lists — same idea, different representation."]],"code":"class Solution {\n    public int maxDepth(TreeNode root) {\n        return root == null ? 0 : 1 + Math.max(maxDepth(root.left), maxDepth(root.right));\n    }\n\n    private int best;\n    public int diameterOfBinaryTree(TreeNode root) {\n        best = 0;\n        height(root);\n        return best;\n    }\n    private int height(TreeNode n) {\n        if (n == null) return 0;\n        int l = height(n.left), r = height(n.right);\n        best = Math.max(best, l + r);          // path bending at n (edges)\n        return 1 + Math.max(l, r);             // parent can extend only one side\n    }\n\n    public boolean isBalanced(TreeNode root) { return check(root) != -1; }\n    private int check(TreeNode n) {           // height, or -1 if unbalanced\n        if (n == null) return 0;\n        int l = check(n.left);  if (l == -1) return -1;\n        int r = check(n.right); if (r == -1) return -1;\n        return Math.abs(l - r) > 1 ? -1 : 1 + Math.max(l, r);\n    }\n\n    public boolean isSymmetric(TreeNode root) { return mirror(root, root); }\n    private boolean mirror(TreeNode a, TreeNode b) {\n        if (a == null || b == null) return a == b;\n        return a.val == b.val && mirror(a.left, b.right) && mirror(a.right, b.left);\n    }\n}","example":{"problem":"Diameter of Binary Tree","input":"root = [1, 2, 3, 4, 5]","cols":["node","left height","right height","best = max(best, l + r)","returns"],"rows":[["4","0","0","0","1"],["5","0","0","0","1"],["2","1","1","2","2"],["3","0","0","2","1"],["1","2","1","3","3"]],"result":"3 (path 4 → 2 → 1 → 3)"}},"trees/paths":{"intuition":"Path questions carry information from the root downward: the sum still needed, the number formed so far, or the path list. Add the node on the way down, remove it on the way back up, and check the condition at a leaf (root-to-leaf) or at every node.\n\nExample (Path Sum): the root 1 has children 2 and 3, and the target is 4. Going down to 2 leaves 4-1-2 = 1 still needed, and 2 is a leaf, so no. Going down to 3 leaves 4-1-3 = 0, and 3 is a leaf, so yes: the path 1->3.\n\nFor paths that may start at any node going down, use the subarray-sum trick from Prefix Sum. Keep a map of prefix sums along the current root-to-node path, and look up `current sum - target`.","approach":["Decide the kind of path: root to leaf, any downward path, or any node to any node (that last kind bends, so use the Depth idea with a global best).","Pass the state down as parameters: the remaining target, the current number, the path list.","At a leaf (both children null), check the condition and save a copy of the path.","After the calls for both children, remove the node from the path (undo).","For downward paths from any start: keep a map of prefix sum to count. Add the count of (sum - target). Add the current sum before going down and remove it after."],"time":"O(n) for counts (O(n · h) when copying paths)","space":"O(h)","identify":["The condition is about the sequence of values from an ancestor down to a descendant (sum to target, digits forming numbers, a path string).","Information must flow from the root to the leaves, not back up.","'Path does not need to start at the root but must go downwards' → prefix sums along the current path with a hash map.","You must output the paths themselves → maintain a shared list and backtrack."],"contrasts":[["Maximum path sum between any two nodes","Path can bend → bottom-up height with a global best."],["Distance K from a target node","Needs upward moves → convert to a graph (parent map) and BFS."],["Subarray sum equals k","Same prefix-sum trick on an array."]],"code":"class Solution {\n    public List<List<Integer>> pathSum(TreeNode root, int target) {\n        List<List<Integer>> res = new ArrayList<>();\n        walk(root, target, new ArrayList<>(), res);\n        return res;\n    }\n    private void walk(TreeNode n, int remain, List<Integer> path, List<List<Integer>> res) {\n        if (n == null) return;\n        path.add(n.val);\n        remain -= n.val;\n        if (n.left == null && n.right == null && remain == 0) res.add(new ArrayList<>(path));\n        walk(n.left, remain, path, res);\n        walk(n.right, remain, path, res);\n        path.remove(path.size() - 1);                       // backtrack\n    }\n\n    // number of downward paths (any start) with sum == target\n    public int pathSumIII(TreeNode root, int target) {\n        Map<Long, Integer> seen = new HashMap<>();\n        seen.put(0L, 1);\n        return count(root, 0L, target, seen);\n    }\n    private int count(TreeNode n, long sum, int target, Map<Long, Integer> seen) {\n        if (n == null) return 0;\n        sum += n.val;\n        int res = seen.getOrDefault(sum - target, 0);       // paths ending here\n        seen.merge(sum, 1, Integer::sum);\n        res += count(n.left, sum, target, seen) + count(n.right, sum, target, seen);\n        seen.merge(sum, -1, Integer::sum);                  // leave this path\n        return res;\n    }\n\n    public int sumNumbers(TreeNode root) { return digits(root, 0); }\n    private int digits(TreeNode n, int cur) {\n        if (n == null) return 0;\n        cur = cur * 10 + n.val;\n        if (n.left == null && n.right == null) return cur;\n        return digits(n.left, cur) + digits(n.right, cur);\n    }\n}","example":{"problem":"Path Sum II","input":"root = [5,4,8,11,null,13,4,7,2,null,null,5,1], target = 22","cols":["path","remaining after node","leaf?","record?"],"rows":[["5 → 4 → 11 → 7","−5","yes","no"],["5 → 4 → 11 → 2","0","yes","yes"],["5 → 8 → 13","−4","yes","no"],["5 → 8 → 4 → 5","0","yes","yes"],["5 → 8 → 4 → 1","4","yes","no"]],"result":"[[5, 4, 11, 2], [5, 8, 4, 5]]"}},"trees/lca":{"intuition":"The lowest common ancestor (LCA) of p and q is the deepest node that has both of them below it (a node also counts as below itself). Search the tree and let each call report what it found: nothing, p or q, or the LCA. If a node gets a result from both its left and its right side, then p and q are split across it, so it is the LCA.\n\nExample: root 3, left 5 (children 6 and 2, where 2 has children 7 and 4), right 1 (children 0 and 8). For LCA(6, 4), node 5 finds 6 on its left and 4 on its right, so the answer is 5. For LCA(5, 1), the split happens at 3.\n\nIn a BST you do not need to search both sides. If both values are smaller than the node, go left. If both are bigger, go right. Otherwise you are at the split point. In the BST 6 (2 (0, 4), 8 (7, 9)), LCA(2, 8) = 6 and LCA(2, 4) = 2.","approach":["Binary tree: if the node is null, p or q, return the node.","Find `left = lca(node.left)` and `right = lca(node.right)`.","If both are non-null, this node is the LCA. Otherwise return whichever is non-null.","BST: walk from the root. Go left or right while both values are on the same side. The first split node is the LCA.","Distance between two nodes = depth(p) + depth(q) - 2 * depth(LCA). For \"all nodes at distance K\", first build a map from each node to its parent."],"time":"O(n) binary tree; O(h) BST","space":"O(h)","identify":["The question involves two (or more) nodes and asks where their root paths meet, or the distance between them.","A node must 'see' both targets in different subtrees, which is a return-value-from-children question.","In a BST, the ordering tells you which side both targets lie on without visiting the other side.","Moves upward toward ancestors are needed (nodes at distance K, burning tree) → parent pointers + BFS, often after locating the LCA/target."],"contrasts":[["Path from root to a node","Path tracking only — a single target."],["Diameter of a tree","Longest path anywhere, not between two given nodes."],["LCA queries repeated many times","Binary lifting / Euler tour preprocessing (advanced)."]],"code":"class Solution {\n    public TreeNode lowestCommonAncestor(TreeNode root, TreeNode p, TreeNode q) {\n        if (root == null || root == p || root == q) return root;\n        TreeNode l = lowestCommonAncestor(root.left, p, q);\n        TreeNode r = lowestCommonAncestor(root.right, p, q);\n        if (l != null && r != null) return root;     // p and q split here\n        return l != null ? l : r;\n    }\n\n    public TreeNode lcaBST(TreeNode root, TreeNode p, TreeNode q) {\n        TreeNode cur = root;\n        while (cur != null) {\n            if (p.val < cur.val && q.val < cur.val) cur = cur.left;\n            else if (p.val > cur.val && q.val > cur.val) cur = cur.right;\n            else return cur;                         // split point\n        }\n        return null;\n    }\n\n    // all nodes at distance k from target: parent map + BFS\n    public List<Integer> distanceK(TreeNode root, TreeNode target, int k) {\n        Map<TreeNode, TreeNode> parent = new HashMap<>();\n        Deque<TreeNode> q = new ArrayDeque<>();\n        q.offer(root);\n        while (!q.isEmpty()) {\n            TreeNode n = q.poll();\n            if (n.left != null) { parent.put(n.left, n); q.offer(n.left); }\n            if (n.right != null) { parent.put(n.right, n); q.offer(n.right); }\n        }\n        Set<TreeNode> seen = new HashSet<>();\n        q.offer(target); seen.add(target);\n        for (int d = 0; d < k && !q.isEmpty(); d++) {\n            for (int s = q.size(); s > 0; s--) {\n                TreeNode n = q.poll();\n                for (TreeNode nb : new TreeNode[]{n.left, n.right, parent.get(n)})\n                    if (nb != null && seen.add(nb)) q.offer(nb);\n            }\n        }\n        List<Integer> res = new ArrayList<>();\n        for (TreeNode n : q) res.add(n.val);\n        Collections.sort(res);\n        return res;\n    }\n}","example":{"problem":"LCA of a Binary Tree","input":"root = [3,5,1,6,2,0,8,null,null,7,4], p = 6, q = 4","cols":["node","left result","right result","returns"],"rows":[["6","—","—","6 (is p)"],["7","null","null","null"],["4","—","—","4 (is q)"],["2","null (7)","4","4"],["5","6","4","5 (both sides non-null)"],["1","null","null","null"],["3","5","null","5"]],"result":"5"}},"trees/build":{"intuition":"You can rebuild a tree when one traversal tells you the root and another tells you what goes left and right. In preorder, the first value is the root. Find that value in inorder: everything before it is the left subtree and everything after it is the right subtree. The size of the left part also tells you where to cut the preorder.\n\nExample: preorder `[3, 9, 20, 15, 7]`, inorder `[9, 3, 15, 20, 7]`. The root is 3. In inorder, 3 is at index 1, so the left side is [9] (size 1) and the right side is [15, 20, 7]. In preorder, the left part is [9] and the right part is [20, 15, 7]. Repeat on the right: the root is 20, with left 15 and right 7.\n\nSerializing is the reverse. Write a preorder that includes a marker for empty children (like '#'), so the shape is clear. Read it back in the same order.","approach":["Map each inorder value to its index, so you can find the root quickly.","`build(preStart, inLo, inHi)`: root = `pre[preStart]`, and mid = its index in inorder.","Left size = `mid - inLo`. The left subtree starts at `preStart + 1`, and the right one at `preStart + 1 + leftSize`.","Serialize: preorder with '#' for null. Deserialize: read the values one by one, in the same order, recursively.","Sorted array to balanced BST: make the middle element the root, and repeat on each half."],"time":"O(n)","space":"O(n)","identify":["You are given two traversals (or one traversal plus extra facts such as BST order or null markers) and must reconstruct the tree.","One traversal identifies the root (pre/post-order ends), the other separates left from right (inorder).","You must convert a tree to a string and back without losing shape → include null markers.","Build a height-balanced tree from sorted data → always choose the middle as root."],"contrasts":[["Validate a BST","Checking, not building → BST Properties."],["Print traversals","Traversal only; no reconstruction."],["Construct from preorder + postorder","Not unique in general — only for full binary trees."]],"code":"class Solution {\n    private Map<Integer, Integer> pos;\n    private int[] pre;\n    private int p;\n\n    public TreeNode buildTree(int[] preorder, int[] inorder) {\n        pos = new HashMap<>();\n        for (int i = 0; i < inorder.length; i++) pos.put(inorder[i], i);\n        pre = preorder; p = 0;\n        return build(0, inorder.length - 1);\n    }\n    private TreeNode build(int lo, int hi) {\n        if (lo > hi) return null;\n        TreeNode root = new TreeNode(pre[p++]);       // next preorder value is the root\n        int mid = pos.get(root.val);\n        root.left = build(lo, mid - 1);               // left part of inorder\n        root.right = build(mid + 1, hi);\n        return root;\n    }\n\n    public String serialize(TreeNode root) {\n        StringBuilder sb = new StringBuilder();\n        ser(root, sb);\n        return sb.toString();\n    }\n    private void ser(TreeNode n, StringBuilder sb) {\n        if (n == null) { sb.append(\"#,\"); return; }\n        sb.append(n.val).append(',');\n        ser(n.left, sb); ser(n.right, sb);\n    }\n    public TreeNode deserialize(String data) {\n        Deque<String> q = new ArrayDeque<>(Arrays.asList(data.split(\",\")));\n        return des(q);\n    }\n    private TreeNode des(Deque<String> q) {\n        String t = q.poll();\n        if (t.equals(\"#\")) return null;\n        TreeNode n = new TreeNode(Integer.parseInt(t));\n        n.left = des(q); n.right = des(q);\n        return n;\n    }\n}","example":{"problem":"Construct from Preorder and Inorder","input":"preorder = [3, 9, 20, 15, 7], inorder = [9, 3, 15, 20, 7]","cols":["root (next preorder)","inorder range","split at","left part","right part"],"rows":[["3","[9, 3, 15, 20, 7]","index 1","[9]","[15, 20, 7]"],["9","[9]","index 0","—","—"],["20","[15, 20, 7]","index 3","[15]","[7]"],["15","[15]","—","—","—"],["7","[7]","—","—","—"]],"result":"[3, 9, 20, null, null, 15, 7]"}},"trees/bst":{"intuition":"In a binary search tree, everything in the left subtree is smaller than the node and everything in the right subtree is bigger. So an inorder walk visits values in sorted order, and each comparison lets you skip half the tree.\n\nUse this in two ways. Walk down one branch to search, insert or delete. Or treat the inorder walk as a sorted list (k-th smallest, validate, two-sum, fix two swapped nodes).\n\nExample (validate): root 5, right child 7, and 7 has a left child 4. Each check against the parent passes (4 < 7). But 4 is on the right side of 5, so it must be bigger than 5. It is not, so the tree is invalid. That is why you pass a (low, high) range down: 7 gets (5, infinity), and 4 gets (5, 7), which it fails.","approach":["Search or insert: compare with the node and go left or right.","Validate: recurse with (low, high). The left child gets (low, node.val) and the right child gets (node.val, high).","k-th smallest or sorted-order questions: inorder walk with a counter, or with a \"previous value\" pointer.","Delete a node with two children: copy in the next bigger value (the smallest in the right subtree), then delete that node.","Floor or ceiling: walk down and remember the best candidate seen on the correct side."],"time":"O(h) per search/insert/delete; O(n) for full inorder","space":"O(h)","identify":["The tree is stated to be a BST and the question involves order: k-th smallest, closest value, range sum, successor, floor/ceil.","Checking 'is this a BST'; each node needs bounds from all ancestors, not only its parent.","Two values are swapped by mistake → the inorder sequence has one or two descents.","You need an iterator over values in sorted order with O(h) memory → stack of left spines."],"contrasts":[["Any binary tree LCA","No ordering → full search on both sides."],["Level order of a BST","BFS — the BST property is irrelevant."],["Sorted array range queries","Binary search on an array; a BST only when inserts/deletes are mixed in."]],"code":"class Solution {\n    public boolean isValidBST(TreeNode root) { return valid(root, Long.MIN_VALUE, Long.MAX_VALUE); }\n    private boolean valid(TreeNode n, long lo, long hi) {\n        if (n == null) return true;\n        if (n.val <= lo || n.val >= hi) return false;          // must respect all ancestors\n        return valid(n.left, lo, n.val) && valid(n.right, n.val, hi);\n    }\n\n    private int k, ans;\n    public int kthSmallest(TreeNode root, int k) {\n        this.k = k;\n        inorder(root);\n        return ans;\n    }\n    private void inorder(TreeNode n) {\n        if (n == null || k == 0) return;\n        inorder(n.left);\n        if (--k == 0) { ans = n.val; return; }                  // k-th visited = k-th smallest\n        inorder(n.right);\n    }\n\n    public TreeNode insertIntoBST(TreeNode root, int v) {\n        if (root == null) return new TreeNode(v);\n        if (v < root.val) root.left = insertIntoBST(root.left, v);\n        else root.right = insertIntoBST(root.right, v);\n        return root;\n    }\n\n    public TreeNode deleteNode(TreeNode root, int key) {\n        if (root == null) return null;\n        if (key < root.val) root.left = deleteNode(root.left, key);\n        else if (key > root.val) root.right = deleteNode(root.right, key);\n        else {\n            if (root.left == null) return root.right;\n            if (root.right == null) return root.left;\n            TreeNode s = root.right;\n            while (s.left != null) s = s.left;                  // inorder successor\n            root.val = s.val;\n            root.right = deleteNode(root.right, s.val);\n        }\n        return root;\n    }\n}","example":{"problem":"Kth Smallest Element in a BST","input":"root = [5, 3, 6, 2, 4, null, null, 1], k = 3","cols":["visit order (inorder)","value","k after decrement","stop?"],"rows":[["1st","1","2","no"],["2nd","2","1","no"],["3rd","3","0","yes → answer 3"]],"result":"3"}},"trie/all":{"intuition":"A trie stores words letter by letter along a tree, so words with the same start share the same path. Checking a word or a prefix takes as many steps as it has letters, no matter how many words are stored.\n\nExample: insert \"app\", \"apple\" and \"bat\". \"app\" and \"apple\" share the path a-p-p, and \"apple\" continues with l-e. Mark the node where each word ends. `startsWith(\"ap\")` is true because the path a-p exists. `search(\"ap\")` is false because no word ends at that node.\n\nThe same tree works on bits instead of letters. To find the maximum XOR, at each bit go the opposite way whenever you can.","approach":["A node has children (26 letters, or 2 for bits) and an end flag (or the whole word, or a count).","Insert: for each letter, go to (or create) the child, and mark the last node as an end.","Search: walk the letters. If a child is missing, fail. At the end, check the end flag (startsWith skips this check).","Many words on a grid (Word Search II): walk the grid and the trie together, and stop when the trie has no child for that letter.","Max XOR: insert numbers from the highest bit down. For each number, go to the opposite bit when it exists."],"time":"O(L) per insert/search","space":"O(total characters × alphabet)","identify":["Many queries test prefixes against a fixed (or growing) dictionary; repeated hashing of every prefix would be wasteful.","You search for many words at once in a grid or a stream, and branches with no dictionary prefix should be cut immediately.","Wildcard search where '.' matches any letter → DFS over trie children at that position.","Maximise XOR between pairs → numbers as 31-bit strings in a binary trie, choose opposite bits greedily."],"contrasts":[["Single word search in a grid","Plain grid backtracking — no trie needed."],["Check if a word is in a list","A HashSet is simpler unless prefixes are queried."],["Longest common prefix of a few strings","Vertical scan is enough; a trie helps only at scale."]],"code":"class Trie {\n    private final Trie[] next = new Trie[26];\n    private boolean end;\n\n    public void insert(String w) {\n        Trie cur = this;\n        for (char c : w.toCharArray()) {\n            if (cur.next[c - 'a'] == null) cur.next[c - 'a'] = new Trie();\n            cur = cur.next[c - 'a'];\n        }\n        cur.end = true;\n    }\n    public boolean search(String w) { Trie n = walk(w); return n != null && n.end; }\n    public boolean startsWith(String p) { return walk(p) != null; }\n    private Trie walk(String s) {\n        Trie cur = this;\n        for (char c : s.toCharArray()) {\n            cur = cur.next[c - 'a'];\n            if (cur == null) return null;\n        }\n        return cur;\n    }\n}\n\nclass Solution {\n    // maximum XOR of two numbers using a binary trie\n    public int findMaximumXOR(int[] a) {\n        int[][] t = new int[a.length * 31 + 1][2];\n        int nodes = 1, best = 0;\n        for (int v : a) {\n            int cur = 0;\n            for (int b = 30; b >= 0; b--) {\n                int bit = (v >> b) & 1;\n                if (t[cur][bit] == 0) t[cur][bit] = nodes++;\n                cur = t[cur][bit];\n            }\n            cur = 0;\n            int x = 0;\n            for (int b = 30; b >= 0; b--) {\n                int want = ((v >> b) & 1) ^ 1;          // prefer the opposite bit\n                if (t[cur][want] != 0) { x |= 1 << b; cur = t[cur][want]; }\n                else cur = t[cur][want ^ 1];\n            }\n            best = Math.max(best, x);\n        }\n        return best;\n    }\n}","example":{"problem":"Implement Trie","input":"insert(\"apple\"), search(\"apple\"), search(\"app\"), startsWith(\"app\"), insert(\"app\"), search(\"app\")","cols":["operation","walk","end flag at last node","returns"],"rows":[["insert(\"apple\")","create a-p-p-l-e","e: true","—"],["search(\"apple\")","a-p-p-l-e found","true","true"],["search(\"app\")","a-p-p found","false","false"],["startsWith(\"app\")","a-p-p found","(ignored)","true"],["insert(\"app\")","reuse a-p-p","p: true","—"],["search(\"app\")","a-p-p found","true","true"]],"result":"[true, false, true, true]"}},"graph/trav":{"intuition":"A graph walk (DFS or BFS) visits everything you can reach from a starting point, marking each node so you never process it twice. Count how many times you have to start a new walk, and you have counted the separate groups: islands, provinces, regions. A grid is a graph where each cell connects to its 4 neighbours.\n\nExample (Number of Islands):\n1 1 0 0\n1 0 0 1\n0 0 1 1\nStart at (0,0). The walk covers (0,1) and (1,0), so that is island 1. The next unvisited land is (1,3). The walk covers (2,3) and (2,2), so that is island 2. No land is left, so the answer is 2.\n\nIf a region is \"safe\" only when it touches the border (Surrounded Regions), start the walks from the border cells instead.","approach":["Build the graph: an adjacency list from the edges, or use the 4 neighbours of each grid cell.","For each unvisited node or cell that qualifies, add 1 to the count and start a walk from it.","DFS uses recursion or a stack, BFS uses a queue. Mark a node as visited when you add it, not when you take it out, to avoid duplicates.","Collect what you need during the walk: size, perimeter, or the island's shape.","Border questions: walk from all the border cells first. Anything left unmarked is enclosed."],"time":"O(V + E) (grid: O(R·C))","space":"O(V) for visited and the stack/queue","identify":["You need to know what is connected to what: count groups, the size of the largest group, or whether two cells are in the same region.","Adjacency is defined by neighbouring cells or explicit edges and there are no weights.","Regions that touch the boundary behave differently (surrounded regions, enclaves, Pacific-Atlantic) → reverse the start to the border.","Copying a graph or traversing it once is enough (clone graph, keys and rooms)."],"contrasts":[["Shortest number of steps","BFS with distances (shortest path), not just reachability."],["Grouping with dynamic edge additions","Union-Find handles online merges efficiently."],["Word search on a grid","Per-path visited and un-marking → backtracking."]],"code":"class Solution {\n    public int numIslands(char[][] g) {\n        int count = 0;\n        for (int r = 0; r < g.length; r++)\n            for (int c = 0; c < g[0].length; c++)\n                if (g[r][c] == '1') { count++; sink(g, r, c); }   // new component\n        return count;\n    }\n    private void sink(char[][] g, int r, int c) {\n        if (r < 0 || c < 0 || r >= g.length || c >= g[0].length || g[r][c] != '1') return;\n        g[r][c] = '0';                                             // mark visited\n        sink(g, r + 1, c); sink(g, r - 1, c); sink(g, r, c + 1); sink(g, r, c - 1);\n    }\n\n    // number of provinces from an adjacency matrix (iterative DFS)\n    public int findCircleNum(int[][] isConnected) {\n        int n = isConnected.length, count = 0;\n        boolean[] seen = new boolean[n];\n        for (int s = 0; s < n; s++) {\n            if (seen[s]) continue;\n            count++;\n            Deque<Integer> st = new ArrayDeque<>();\n            st.push(s); seen[s] = true;\n            while (!st.isEmpty()) {\n                int u = st.pop();\n                for (int v = 0; v < n; v++)\n                    if (isConnected[u][v] == 1 && !seen[v]) { seen[v] = true; st.push(v); }\n            }\n        }\n        return count;\n    }\n}","example":{"problem":"Number of Islands","input":"grid = [\"11000\", \"11000\", \"00100\", \"00011\"]","cols":["scan reaches","cell value","action","islands"],"rows":[["(0, 0)","1","count 1, sink (0,0), (0,1), (1,0), (1,1)","1"],["(0, 1)…(2, 1)","0 / sunk","skip","1"],["(2, 2)","1","count 2, sink (2,2)","2"],["(3, 3)","1","count 3, sink (3,3), (3,4)","3"],["(3, 4)","sunk","skip","3"]],"result":"3"}},"graph/cycle":{"intuition":"These are graph walks that also watch for an edge leading back to where you came from.\n\nIn an undirected graph, reaching an already visited node that is not your parent means a cycle.\n\nIn a directed graph, only reaching a node that is still on your current path is a cycle. Give each node a colour: 0 = not visited, 1 = on the current path, 2 = finished. Example: 0->1->2->0. The walk marks 0, 1 and 2 as on the path, then the edge 2->0 reaches a node still on the path, so there is a cycle. Compare 0->1, 1->2, 0->2. Reaching 2 again from 0 is fine, because 2 is already finished (colour 2), not on the current path.\n\nBipartite check: colour the start A, its neighbours B, their neighbours A, and so on. A square 0-1-2-3-0 works. A triangle fails, because two neighbours end up with the same colour.","approach":["Directed cycle: colours 0 / 1 / 2 as above. An edge to a colour-1 node is a cycle. Mark a node 2 when its walk is done.","Undirected cycle: walk while remembering the parent. A visited neighbour that is not the parent means a cycle (or use Union-Find).","Bipartite: give the start colour 0 and each neighbour the opposite colour. Two neighbours with the same colour means it is not bipartite. Start again from every node that has no colour yet.","Eventual safe states: the nodes that cannot reach a cycle are exactly the ones that finish with colour 2.","Another option for directed graphs: Kahn's topological sort. If it cannot remove all the nodes, there is a cycle."],"time":"O(V + E)","space":"O(V)","identify":["The question is whether a dependency or movement structure can loop forever (deadlock, impossible schedule, infinite path).","Items must be split into two groups so that every relation crosses groups (enemies, dislikes, conflicts) → bipartite check.","Nodes are 'safe' if every path from them ends; i.e. they cannot reach a cycle.","Directed versus undirected changes the rule: the gray/black distinction only matters for directed graphs."],"contrasts":[["Course order output","Topological sort produces the order; cycle detection only says yes/no."],["Cycle in a linked list","Fast & slow pointers — each node has one outgoing edge."],["Redundant connection (undirected)","Union-Find reports the edge that closes the cycle."]],"code":"class Solution {\n    // directed graph: is there a cycle? (3-colour DFS)\n    public boolean hasCycle(int n, int[][] edges) {\n        List<List<Integer>> g = new ArrayList<>();\n        for (int i = 0; i < n; i++) g.add(new ArrayList<>());\n        for (int[] e : edges) g.get(e[0]).add(e[1]);\n        int[] color = new int[n];\n        for (int i = 0; i < n; i++) if (color[i] == 0 && dfs(g, i, color)) return true;\n        return false;\n    }\n    private boolean dfs(List<List<Integer>> g, int u, int[] color) {\n        color[u] = 1;                                     // on the current path\n        for (int v : g.get(u)) {\n            if (color[v] == 1) return true;               // back edge\n            if (color[v] == 0 && dfs(g, v, color)) return true;\n        }\n        color[u] = 2;                                     // finished\n        return false;\n    }\n\n    // bipartite check with BFS 2-colouring (adjacency list input)\n    public boolean isBipartite(int[][] graph) {\n        int n = graph.length;\n        int[] col = new int[n];\n        Arrays.fill(col, -1);\n        for (int s = 0; s < n; s++) {\n            if (col[s] != -1) continue;\n            Deque<Integer> q = new ArrayDeque<>();\n            q.offer(s); col[s] = 0;\n            while (!q.isEmpty()) {\n                int u = q.poll();\n                for (int v : graph[u]) {\n                    if (col[v] == -1) { col[v] = 1 - col[u]; q.offer(v); }\n                    else if (col[v] == col[u]) return false;   // odd cycle\n                }\n            }\n        }\n        return true;\n    }\n}","example":{"problem":"Is Graph Bipartite?","input":"graph = [[1,3], [0,2], [1,3], [0,2]]","cols":["pop","colour","neighbours","result"],"rows":[["0","0","1 → colour 1, 3 → colour 1","queue [1, 3]"],["1","1","0 (0 ≠ 1 ok), 2 → colour 0","queue [3, 2]"],["3","1","0 ok, 2 (0 ≠ 1) ok","queue [2]"],["2","0","1 ok, 3 ok","queue empty"]],"result":"true (groups {0, 2} and {1, 3})"}},"graph/topo":{"intuition":"A topological order lists tasks so that every task comes after the tasks it depends on. Kahn's method: repeatedly take a task that has no remaining prerequisites (in-degree 0, meaning no arrows coming into it), add it to the order, and remove its arrows. That may free other tasks. If some tasks are never freed, they depend on each other in a circle, so no order exists.\n\nExample: 4 courses. 1 needs 0, 2 needs 0, and 3 needs both 1 and 2. The arrows are 0->1, 0->2, 1->3, 2->3. Only 0 has no prerequisites, so start with it. Taking 0 frees 1 and 2. Taking 1 leaves 3 still needing 2. Taking 2 frees 3. The order is 0, 1, 2, 3.\n\nIf you process the tasks in rounds, the number of rounds is the minimum number of semesters (3 here).","approach":["Build the adjacency list and count the incoming arrows of each node (u -> v means u comes before v).","Put every node with 0 incoming arrows in a queue.","Pop u and add it to the order. For each v after u, reduce its count. If the count becomes 0, push v.","If the order has fewer than n nodes, there is a cycle and no valid order.","Alien Dictionary: get the arrows from the first different letter of each pair of neighbouring words. A word followed by its own prefix is invalid."],"time":"O(V + E)","space":"O(V + E)","identify":["The problem describes prerequisites or 'must happen before' relations and asks for a valid order, whether one exists, or the minimum rounds.","The relations form a directed graph and any valid answer must respect all of them simultaneously.","An unknown ordering must be inferred from sorted examples (alien dictionary, sequence reconstruction).","Longest path or earliest completion time in a DAG → process nodes in topological order and relax."],"contrasts":[["Detect a cycle in an undirected graph","Parent check / Union-Find, not topological order."],["Shortest path with weights","Dijkstra (though a DAG allows relaxation in topo order)."],["Ordering by a single key","Just sort — no dependency graph."]],"code":"class Solution {\n    // order to finish all courses; prerequisites[i] = {course, prereq}\n    public int[] findOrder(int n, int[][] prerequisites) {\n        List<List<Integer>> g = new ArrayList<>();\n        for (int i = 0; i < n; i++) g.add(new ArrayList<>());\n        int[] indeg = new int[n];\n        for (int[] p : prerequisites) { g.get(p[1]).add(p[0]); indeg[p[0]]++; }\n        Deque<Integer> q = new ArrayDeque<>();\n        for (int i = 0; i < n; i++) if (indeg[i] == 0) q.offer(i);\n        int[] order = new int[n];\n        int k = 0;\n        while (!q.isEmpty()) {\n            int u = q.poll();\n            order[k++] = u;\n            for (int v : g.get(u)) if (--indeg[v] == 0) q.offer(v);   // all prereqs done\n        }\n        return k == n ? order : new int[0];                            // short -> cycle\n    }\n\n    public boolean canFinish(int n, int[][] prerequisites) { return findOrder(n, prerequisites).length == n; }\n}","example":{"problem":"Course Schedule II (Kahn's algorithm)","input":"n = 4, prerequisites = [[1,0], [2,0], [3,1], [3,2]]","cols":["pop","order","in-degree changes","queue"],"rows":[["start","—","indeg = [0, 1, 1, 2]","[0]"],["0","[0]","1 → 0, 2 → 0","[1, 2]"],["1","[0, 1]","3 → 1","[2]"],["2","[0, 1, 2]","3 → 0","[3]"],["3","[0, 1, 2, 3]","—","[]"]],"result":"[0, 1, 2, 3] (4 = n, so no cycle)"}},"graph/bfs":{"intuition":"BFS visits nodes in rings: first everything 1 step away, then 2 steps, and so on. So when every move costs the same, the first time BFS reaches a node is along a shortest path. That is why a plain queue gives shortest paths in unweighted graphs and grids.\n\nIf some moves cost 0 and others cost 1, use a deque (0-1 BFS): push a node to the FRONT when the move is free, and to the BACK when it costs 1. The deque stays sorted by distance, like a cheap Dijkstra.\n\nExample (Minimum Obstacle Removal): grid `[[0,1,1],[1,1,0],[1,1,0]]`, moving into an obstacle (1) costs 1, into an empty cell costs 0. From (0,0) both neighbours are obstacles, so they go to the back with cost 1. Free moves go to the front, so all cost-1 cells are finished before any cost-2 cell. The corner (2,2) is reached with cost 2.","approach":["Model the graph: nodes (cells, numbers) and moves. Check the move costs: all equal -> BFS; only 0 or 1 -> 0-1 BFS; other weights -> Dijkstra.","Plain BFS: push the source with distance 0 and mark it visited. Pop, and for every unvisited neighbour set dist + 1, mark, push.","0-1 BFS: keep dist[] = infinity. When a move improves dist, push to the front if it cost 0, to the back if it cost 1.","In the example, (0,0) pushes (1,0) and (0,1) to the back with cost 1. Later, from (1,1) (cost 2) the step into the empty cell (1,2) is free, so (1,2) and then (2,2) go to the FRONT with cost 2.","Stop when the target is popped, or when the queue is empty (then all distances are final)."],"time":"O(V + E) (grid: O(R · C))","space":"O(V)","identify":["You need the fewest steps / moves / minimum number of edges, and every step has the same cost.","Moves are of two kinds, free and paid (follow the arrow or change it, walk or break a wall) -> 0-1 BFS.","A grid with 8 or 4 directions and 'shortest clear path' or 'nearest exit'.","DFS would try exponentially many paths; BFS reaches each node once."],"contrasts":[["Rotting oranges / 01 matrix","Many starting points at once -> Multi-source BFS."],["Word ladder / open the lock","The nodes are whole configurations -> State-space BFS."],["Edges with different weights","Use Dijkstra (non-negative) or Bellman-Ford."]],"code":"class Solution {\n    // plain BFS: shortest clear path in a binary grid (8 directions)\n    public int shortestPathBinaryMatrix(int[][] g) {\n        int n = g.length;\n        if (g[0][0] == 1 || g[n - 1][n - 1] == 1) return -1;\n        Deque<int[]> q = new ArrayDeque<>();\n        q.offer(new int[]{0, 0});\n        g[0][0] = 1;                                         // visited\n        for (int steps = 1; !q.isEmpty(); steps++)\n            for (int s = q.size(); s > 0; s--) {\n                int[] cur = q.poll();\n                if (cur[0] == n - 1 && cur[1] == n - 1) return steps;\n                for (int dr = -1; dr <= 1; dr++)\n                    for (int dc = -1; dc <= 1; dc++) {\n                        int r = cur[0] + dr, c = cur[1] + dc;\n                        if (r < 0 || c < 0 || r >= n || c >= n || g[r][c] != 0) continue;\n                        g[r][c] = 1;\n                        q.offer(new int[]{r, c});\n                    }\n            }\n        return -1;\n    }\n\n    // 0-1 BFS: entering an obstacle costs 1, an empty cell costs 0\n    public int minimumObstacles(int[][] g) {\n        int R = g.length, C = g[0].length;\n        int[][] dist = new int[R][C];\n        for (int[] row : dist) Arrays.fill(row, Integer.MAX_VALUE);\n        dist[0][0] = 0;\n        Deque<int[]> dq = new ArrayDeque<>();\n        dq.offerFirst(new int[]{0, 0});\n        int[][] dirs = {{1, 0}, {-1, 0}, {0, 1}, {0, -1}};\n        while (!dq.isEmpty()) {\n            int[] cur = dq.pollFirst();\n            for (int[] d : dirs) {\n                int r = cur[0] + d[0], c = cur[1] + d[1];\n                if (r < 0 || c < 0 || r >= R || c >= C) continue;\n                int nd = dist[cur[0]][cur[1]] + g[r][c];\n                if (nd >= dist[r][c]) continue;\n                dist[r][c] = nd;\n                if (g[r][c] == 0) dq.offerFirst(new int[]{r, c});   // free move -> front\n                else dq.offerLast(new int[]{r, c});                 // paid move -> back\n            }\n        }\n        return dist[R - 1][C - 1];\n    }\n}","example":{"problem":"Minimum Obstacle Removal to Reach Corner (0-1 BFS)","input":"grid = [[0,1,1],[1,1,0],[1,1,0]]","cols":["pop (cell, cost)","neighbours improved"],"rows":[["(0,0) d=0","(1,0)=1 back, (0,1)=1 back"],["(1,0) d=1","(2,0)=2 back, (1,1)=2 back"],["(0,1) d=1","(0,2)=2 back"],["(2,0) d=2","(2,1)=3 back"],["(1,1) d=2","(1,2)=2 front"],["(1,2) d=2","(2,2)=2 front"],["(2,2) d=2","-"],["(0,2) d=2","-"],["(2,1) d=3","-"]],"result":"dist(2,2) = 2"}},"graph/wsp":{"intuition":"When roads have different lengths (none negative), Dijkstra finds shortest paths. Always take the unfinished place with the smallest known distance from a min-heap. Its distance is now final, because any other route would go through a place that is already further away. Then update its neighbours.\n\nExample: A->B 4, A->C 1, C->B 2, B->D 1. Start with A = 0, so B = 4 and C = 1. Take C (1): B can now be 1+2 = 3, which beats 4. Take B (3): D = 4. The old entry \"B = 4\" in the heap is out of date, so skip it. Shortest A->D = 4, through C and B.\n\nNegative roads break this, so Bellman-Ford instead loops over every road V-1 times. \"At most k stops\" is Bellman-Ford with only k+1 rounds. Floyd-Warshall finds all pairs at once when there are few nodes.","approach":["Dijkstra: `dist[src] = 0`, and a heap of (distance, node). Pop. Skip it if it is out of date (d > dist[u]). Update each road u -> v of weight w.","The goal can be one target, the largest distance (Network Delay Time), or a changed cost such as the largest step on a path.","Bellman-Ford: repeat V-1 times: update over every road. If something still improves after that, there is a negative cycle.","At most k stops: run k+1 rounds, each one updating from a copy of the previous round's distances.","Floyd-Warshall: for each k, i, j: `d[i][j] = min(d[i][j], d[i][k] + d[k][j])`."],"time":"Dijkstra O(E log V); Bellman-Ford O(V·E); Floyd O(V³)","space":"O(V + E) (Floyd O(V²))","identify":["Edges have different costs (time, price, effort) and you want the cheapest route; plain BFS step counts are not enough.","All weights are non-negative → Dijkstra; negative weights or a cap on the number of edges → Bellman-Ford.","The path cost is not a sum but can only get worse as the path grows (max edge on the path, product of probabilities ≤ 1) → Dijkstra with a changed relaxation.","V is small (≤ 100-400) and you need distances between every pair → Floyd-Warshall."],"contrasts":[["Unweighted minimum steps","BFS is enough and faster."],["Minimum cost to connect all nodes","Not a path → minimum spanning tree (Kruskal/Prim)."],["Path in a DAG","Relax in topological order in O(V + E)."]],"code":"class Solution {\n    // network delay: time for a signal from k to reach all nodes (1..n)\n    public int networkDelayTime(int[][] times, int n, int k) {\n        List<List<int[]>> g = new ArrayList<>();\n        for (int i = 0; i <= n; i++) g.add(new ArrayList<>());\n        for (int[] t : times) g.get(t[0]).add(new int[]{t[1], t[2]});\n        int[] dist = new int[n + 1];\n        Arrays.fill(dist, Integer.MAX_VALUE);\n        dist[k] = 0;\n        PriorityQueue<int[]> pq = new PriorityQueue<>((a, b) -> Integer.compare(a[0], b[0]));\n        pq.offer(new int[]{0, k});\n        while (!pq.isEmpty()) {\n            int[] top = pq.poll();\n            int d = top[0], u = top[1];\n            if (d > dist[u]) continue;                      // stale entry\n            for (int[] e : g.get(u))\n                if (d + e[1] < dist[e[0]]) { dist[e[0]] = d + e[1]; pq.offer(new int[]{dist[e[0]], e[0]}); }\n        }\n        int ans = 0;\n        for (int i = 1; i <= n; i++) { if (dist[i] == Integer.MAX_VALUE) return -1; ans = Math.max(ans, dist[i]); }\n        return ans;\n    }\n\n    // cheapest flight with at most k stops: Bellman-Ford with k + 1 rounds\n    public int findCheapestPrice(int n, int[][] flights, int src, int dst, int k) {\n        int[] dist = new int[n];\n        Arrays.fill(dist, Integer.MAX_VALUE);\n        dist[src] = 0;\n        for (int round = 0; round <= k; round++) {\n            int[] next = dist.clone();                      // only use paths from the previous round\n            for (int[] f : flights)\n                if (dist[f[0]] != Integer.MAX_VALUE && dist[f[0]] + f[2] < next[f[1]]) next[f[1]] = dist[f[0]] + f[2];\n            dist = next;\n        }\n        return dist[dst] == Integer.MAX_VALUE ? -1 : dist[dst];\n    }\n}","example":{"problem":"Network Delay Time (Dijkstra)","input":"times = [[2,1,1], [2,3,1], [3,4,1]], n = 4, k = 2","cols":["pop (dist, node)","relaxations","dist[1..4]"],"rows":[["start","—","[∞, 0, ∞, ∞]"],["(0, 2)","1 → 1, 3 → 1","[1, 0, 1, ∞]"],["(1, 1)","no edges","[1, 0, 1, ∞]"],["(1, 3)","4 → 2","[1, 0, 1, 2]"],["(2, 4)","no edges","[1, 0, 1, 2]"]],"result":"max distance = 2"}},"graph/dsu":{"intuition":"Union-Find keeps groups of items. Each group has a leader (its root). `find(x)` follows parent links up to the leader. `union(a, b)` joins two groups by putting one leader under the other. Both are almost instant, especially if find also shortens the path for next time (path compression).\n\nExample: 5 people, 0..4. Join (0,1): 4 groups left. Join (1,2): 3 groups. Join (3,4): 2 groups. Now the edge (0,2) arrives: find(0) and find(2) give the same leader, so they are already connected. This edge would make a cycle (Redundant Connection).\n\nKruskal's minimum spanning tree sorts the edges by cost and takes an edge only if it joins two different groups.","approach":["Start with `parent[i] = i`, `size[i] = 1`, and groups = n.","`find(x)`: if `parent[x] != x`, set `parent[x] = find(parent[x])`. Return `parent[x]`.","`union(a, b)`: find both leaders. If they are the same, the two are already connected (a cycle edge). Otherwise put the smaller group under the bigger one and reduce groups by 1.","Turn non-number items (emails, coordinates) into number ids first.","Kruskal: sort the edges by weight, join each edge whose ends are in different groups, and stop after n-1 edges."],"time":"O(α(n)) per operation (practically constant); Kruskal O(E log E)","space":"O(n)","identify":["Connections are added over time and you must answer connectivity or component counts after each addition (online merging).","Equivalence relations need grouping: accounts sharing an email, equations a == b, similar strings, stones sharing a row or column.","You must find the edge that creates a cycle in an undirected graph (redundant connection).","Minimum total cost to connect everything → minimum spanning tree (Kruskal with DSU, or Prim with a heap)."],"contrasts":[["Shortest path between two nodes","Union-Find has no distances → BFS/Dijkstra."],["Directed reachability / cycles","DSU ignores direction → DFS colours / topological sort."],["Static component count once","Plain DFS/BFS works just as well."]],"code":"class DSU {\n    private final int[] parent, size;\n    public int components;\n    public DSU(int n) {\n        parent = new int[n]; size = new int[n]; components = n;\n        for (int i = 0; i < n; i++) { parent[i] = i; size[i] = 1; }\n    }\n    public int find(int x) {\n        if (parent[x] != x) parent[x] = find(parent[x]);   // path compression\n        return parent[x];\n    }\n    public boolean union(int a, int b) {\n        int ra = find(a), rb = find(b);\n        if (ra == rb) return false;                         // already connected\n        if (size[ra] < size[rb]) { int t = ra; ra = rb; rb = t; }\n        parent[rb] = ra; size[ra] += size[rb];              // union by size\n        components--;\n        return true;\n    }\n}\n\nclass Solution {\n    public int countComponents(int n, int[][] edges) {\n        DSU d = new DSU(n);\n        for (int[] e : edges) d.union(e[0], e[1]);\n        return d.components;\n    }\n\n    // Kruskal: total weight of a minimum spanning tree, edges = {u, v, w}\n    public int mstWeight(int n, int[][] edges) {\n        Arrays.sort(edges, (a, b) -> Integer.compare(a[2], b[2]));\n        DSU d = new DSU(n);\n        int total = 0;\n        for (int[] e : edges) if (d.union(e[0], e[1])) total += e[2];   // take if it joins two trees\n        return total;\n    }\n\n    public int[] findRedundantConnection(int[][] edges) {\n        DSU d = new DSU(edges.length + 1);\n        for (int[] e : edges) if (!d.union(e[0], e[1])) return e;\n        return new int[0];\n    }\n}","example":{"problem":"Number of Connected Components","input":"n = 5, edges = [[0,1], [1,2], [3,4]]","cols":["edge","find roots","action","parent","components"],"rows":[["start","—","—","[0, 1, 2, 3, 4]","5"],["(0, 1)","0, 1","attach 1 under 0","[0, 0, 2, 3, 4]","4"],["(1, 2)","0, 2","attach 2 under 0","[0, 0, 0, 3, 4]","3"],["(3, 4)","3, 4","attach 4 under 3","[0, 0, 0, 3, 3]","2"]],"result":"2 components"}},"graph/adv":{"intuition":"A bridge is an edge that, if removed, splits the graph into two parts. Tarjan's method gives each node a visit time during DFS, and a \"low\" value: the earliest visit time that its part of the DFS tree can reach using one back edge. If a child's part cannot reach above the child, the edge to that child is the only connection, so it is a bridge.\n\nExample: a triangle 0-1-2 plus an extra edge 1-3. DFS visits 0 (time 0), 1 (time 1), 2 (time 2). Node 2 has an edge back to 0, so low[2] = 0 and then low[1] = 0, and the triangle has no bridge. Then 1 -> 3: node 3 has no other edges, so low[3] = 3, which is greater than 1's time (1). So 1-3 is a bridge. Node 1 is also an articulation point, a node whose removal splits the graph, because low[3] >= time[1].\n\nStrongly connected groups in directed graphs use the same low idea (Tarjan) or two DFS passes (Kosaraju). An Euler path uses every edge once and is built with Hierholzer's method.","approach":["Run DFS with a timer: `disc[u] = low[u] = time++`.","For each unvisited neighbour v: recurse, then `low[u] = min(low[u], low[v])`. If `low[v] > disc[u]`, then u-v is a bridge.","If v is already visited and is not the edge you came from: `low[u] = min(low[u], disc[v])` (a back edge, like 2 -> 0).","Articulation point: `low[v] >= disc[u]` for some child v (the root needs two or more DFS children).","Kosaraju: DFS to get the finish order, reverse all edges, then DFS in reverse finish order. Each tree found is one group. Hierholzer: follow unused edges, add a node when it has none left, and reverse at the end."],"time":"O(V + E)","space":"O(V + E)","identify":["You must find connections or nodes whose removal disconnects the network (critical connections, articulation points).","Groups where every node can reach every other in a directed graph (mutual reachability) → strongly connected components.","You must use every edge exactly once (reconstruct an itinerary, valid arrangement of pairs) → Eulerian path.","A plain 'remove each edge and re-run BFS' would be O(E·(V + E)); too slow for 10^5 edges."],"contrasts":[["Detect any cycle","Simple DFS colouring or DSU — no low-links needed."],["Visit every node once (Hamiltonian path)","NP-hard in general → bitmask DP for small n."],["Connected components in an undirected graph","Plain DFS/BFS or Union-Find."]],"code":"class Solution {\n    private List<List<Integer>> g;\n    private int[] disc, low;\n    private int timer;\n    private List<List<Integer>> bridges;\n\n    public List<List<Integer>> criticalConnections(int n, List<List<Integer>> connections) {\n        g = new ArrayList<>();\n        for (int i = 0; i < n; i++) g.add(new ArrayList<>());\n        for (List<Integer> e : connections) { g.get(e.get(0)).add(e.get(1)); g.get(e.get(1)).add(e.get(0)); }\n        disc = new int[n]; low = new int[n];\n        Arrays.fill(disc, -1);\n        bridges = new ArrayList<>();\n        timer = 0;\n        for (int i = 0; i < n; i++) if (disc[i] == -1) dfs(i, -1);\n        return bridges;\n    }\n    private void dfs(int u, int parent) {\n        disc[u] = low[u] = timer++;\n        for (int v : g.get(u)) {\n            if (v == parent) continue;\n            if (disc[v] == -1) {\n                dfs(v, u);\n                low[u] = Math.min(low[u], low[v]);\n                if (low[v] > disc[u]) bridges.add(Arrays.asList(u, v));   // v's subtree cannot climb above u\n            } else low[u] = Math.min(low[u], disc[v]);                     // back edge\n        }\n    }\n\n    // Hierholzer: itinerary using all tickets, lexicographically smallest\n    public List<String> findItinerary(List<List<String>> tickets) {\n        Map<String, PriorityQueue<String>> adj = new HashMap<>();\n        for (List<String> t : tickets) adj.computeIfAbsent(t.get(0), k -> new PriorityQueue<>()).offer(t.get(1));\n        LinkedList<String> route = new LinkedList<>();\n        Deque<String> st = new ArrayDeque<>();\n        st.push(\"JFK\");\n        while (!st.isEmpty()) {\n            PriorityQueue<String> out = adj.get(st.peek());\n            if (out != null && !out.isEmpty()) st.push(out.poll());\n            else route.addFirst(st.pop());                              // stuck -> belongs at the end\n        }\n        return route;\n    }\n}","example":{"problem":"Critical Connections (bridges)","input":"n = 4, edges = [[0,1], [1,2], [2,0], [1,3]]","cols":["event","disc / low","check"],"rows":[["visit 0","disc 0 = 0","—"],["visit 1 (from 0)","disc 1 = 1","—"],["visit 2 (from 1)","disc 2 = 2","—"],["2 sees 0 (back edge)","low 2 = 0","—"],["return to 1","low 1 = min(1, 0) = 0","low 2 = 0 > disc 1? no"],["visit 3 (from 1)","disc 3 = 3, low 3 = 3","—"],["return to 1","low 1 stays 0","low 3 = 3 > disc 1 = 1 → bridge (1, 3)"],["return to 0","low 0 = 0","low 1 = 0 > 0? no"]],"result":"[[1, 3]]"}},"dp/1d":{"intuition":"1D DP works when the answer at position i depends on a few earlier answers. Ask: what was the last decision at i? Write `dp[i]` from those options.\n\nExample (House Robber): `[2, 7, 9, 3, 1]`. At each house, either skip it (keep `dp[i-1]`) or rob it (`dp[i-2]` + this house). dp = 2, then 7, then max(7, 2+9) = 11, then max(11, 7+3) = 11, then max(11, 11+1) = 12. The answer is 12 (houses 2, 9 and 1).\n\nEach step only looks back two places, so two variables are enough instead of a whole array. Decode Ways is the same shape: the last letter used either one digit or two.","approach":["Write what `dp[i]` means in words: \"the most money from houses 0..i\".","Write the rule from the last choice: `dp[i] = max(dp[i-1], dp[i-2] + a[i])`.","Set the starting values: dp[0] = a[0], dp[1] = max(a[0], a[1]), or an empty start.","Fill from left to right, so the earlier values are ready (2, 7, 11, 11, 12).","Keep only the last two values to save space. For houses in a circle, solve twice (without the first house, then without the last) and take the better one."],"time":"O(n) (O(n · choices) in general)","space":"O(1) after compression, else O(n)","identify":["The problem asks for a count, a max/min, or feasibility over a sequence, and a decision at each position limits the next decisions (adjacent houses, one/two steps).","Brute force recursion would re-solve the same suffix/prefix many times (overlapping subproblems).","The state can be described by a single index (plus maybe a tiny flag), and the answer at i only needs a few earlier answers.","Splitting a string into valid pieces (decode ways, word break) → dp over prefix lengths."],"contrasts":[["Maximum subarray","Kadane's is the same DP, usually taught as an array technique."],["Choices with a capacity/target","Needs a second dimension → Knapsack."],["Jump Game reachability","Greedy furthest reach suffices; DP is overkill."]],"code":"class Solution {\n    public int rob(int[] a) {\n        int prev2 = 0, prev1 = 0;                 // dp[i-2], dp[i-1]\n        for (int v : a) {\n            int cur = Math.max(prev1, prev2 + v); // skip or rob\n            prev2 = prev1; prev1 = cur;\n        }\n        return prev1;\n    }\n\n    public int robCircular(int[] a) {             // first and last are adjacent\n        if (a.length == 1) return a[0];\n        return Math.max(rob(Arrays.copyOfRange(a, 0, a.length - 1)), rob(Arrays.copyOfRange(a, 1, a.length)));\n    }\n\n    public int numDecodings(String s) {\n        int n = s.length();\n        int[] dp = new int[n + 1];                // dp[i] = ways to decode first i chars\n        dp[0] = 1;\n        for (int i = 1; i <= n; i++) {\n            if (s.charAt(i - 1) != '0') dp[i] += dp[i - 1];\n            if (i >= 2) {\n                int two = Integer.parseInt(s.substring(i - 2, i));\n                if (two >= 10 && two <= 26) dp[i] += dp[i - 2];\n            }\n        }\n        return dp[n];\n    }\n\n    public boolean wordBreak(String s, List<String> words) {\n        Set<String> dict = new HashSet<>(words);\n        boolean[] ok = new boolean[s.length() + 1];\n        ok[0] = true;\n        for (int i = 1; i <= s.length(); i++)\n            for (int j = 0; j < i && !ok[i]; j++)\n                ok[i] = ok[j] && dict.contains(s.substring(j, i));\n        return ok[s.length()];\n    }\n}","example":{"problem":"House Robber","input":"a = [2, 7, 9, 3, 1]","cols":["i","a[i]","skip = dp[i−1]","rob = dp[i−2] + a[i]","dp[i]"],"rows":[["0","2","0","0 + 2 = 2","2"],["1","7","2","0 + 7 = 7","7"],["2","9","7","2 + 9 = 11","11"],["3","3","11","7 + 3 = 10","11"],["4","1","11","11 + 1 = 12","12"]],"result":"12 (houses 2, 9, 1)"}},"dp/grid":{"intuition":"If you can only move right or down in a grid, you never come back to a cell. So each cell's answer can be built from the cell above it and the cell to its left.\n\nExample (Minimum Path Sum): `[[1,3,1],[1,5,1],[4,2,1]]`. The first row is 1, 4, 5 (only one way in). The first column is 1, 2, 6. Cell (1,1) = 5 + min(4, 2) = 7. Cell (1,2) = 1 + min(5, 7) = 6. Cell (2,1) = 2 + min(7, 6) = 8. Cell (2,2) = 1 + min(6, 8) = 7. The answer is 7 (1->3->1->1->1).\n\nCounting paths, triangle and falling paths all have this same shape. Only the way you combine changes (add, min or max). If the answer also depends on an extra choice, add it to the state: Ninja's Training uses (day, last task), and Cherry Pickup II, where two robots walk down together, uses (row, col1, col2), a 3D DP.","approach":["Write what `dp[r][c]` means: the number of paths to reach it, the cheapest cost to reach it, or the biggest square ending there.","Fill the first row and first column (only one way in), and set obstacles to 0.","Fill row by row, so the cells above and to the left are ready.","Combine: add for counting, min or max for best values (min path sum: `cell + min(up, left)`).","Keep only one row to save space. For two walkers at once (Cherry Pickup II), use the state (row, col1, col2)."],"time":"O(R·C)","space":"O(C) with a rolling row","identify":["You move through a grid in restricted directions (right/down, down to adjacent columns) so no cell can be revisited.","The question asks for the number of paths or the best total along a path, not the path count of steps.","Two walkers move at the same time, or each row/day depends on what you chose in the previous one -> put that choice into the state (3D DP).","Unrestricted 4-directional movement → that is a graph (BFS/Dijkstra), not grid DP."],"contrasts":[["Shortest path with 4-direction moves","Cycles possible → BFS or Dijkstra."],["Word search","Path must spell a word without revisits → backtracking."],["Largest rectangle of 1s","Histogram per row + monotonic stack."],["Largest square of 1s","Each cell is a corner, not a walker -> DP on Squares."]],"code":"class Solution {\n    public int minPathSum(int[][] g) {\n        int R = g.length, C = g[0].length;\n        int[] dp = new int[C];                      // current row\n        for (int r = 0; r < R; r++)\n            for (int c = 0; c < C; c++) {\n                if (r == 0 && c == 0) dp[c] = g[0][0];\n                else if (r == 0) dp[c] = dp[c - 1] + g[r][c];\n                else if (c == 0) dp[c] = dp[c] + g[r][c];\n                else dp[c] = Math.min(dp[c], dp[c - 1]) + g[r][c];   // up vs left\n            }\n        return dp[C - 1];\n    }\n\n    public int uniquePathsWithObstacles(int[][] g) {\n        int C = g[0].length;\n        int[] dp = new int[C];\n        dp[0] = 1;\n        for (int[] row : g)\n            for (int c = 0; c < C; c++) {\n                if (row[c] == 1) dp[c] = 0;\n                else if (c > 0) dp[c] += dp[c - 1];\n            }\n        return dp[C - 1];\n    }\n\n    public int maximalSquare(char[][] m) {\n        int R = m.length, C = m[0].length, best = 0;\n        int[][] dp = new int[R + 1][C + 1];\n        for (int r = 1; r <= R; r++)\n            for (int c = 1; c <= C; c++)\n                if (m[r - 1][c - 1] == '1') {\n                    dp[r][c] = 1 + Math.min(dp[r - 1][c - 1], Math.min(dp[r - 1][c], dp[r][c - 1]));\n                    best = Math.max(best, dp[r][c]);\n                }\n        return best * best;\n    }\n}","example":{"problem":"Minimum Path Sum","input":"grid = [[1,3,1], [1,5,1], [4,2,1]]","cols":["row","computation","dp row after"],"rows":[["0","1; 1 + 3; 4 + 1","[1, 4, 5]"],["1","1 + 1; min(4, 2) + 5; min(5, 7) + 1","[2, 7, 6]"],["2","2 + 4; min(7, 6) + 2; min(6, 8) + 1","[6, 8, 7]"]],"result":"7 (path 1 → 3 → 1 → 1 → 1)"}},"dp/knap":{"intuition":"Each item can be taken once or left out. You want to reach a total (a sum, a weight limit) and greedy picking does not work. Keep a table `dp[t]` = \"can I make total t with the items seen so far?\" (or the number of ways, or the best value).\n\nExample (Subset Sum): items `[2, 3, 7, 8, 10]`, target 11. At the start only 0 is possible. After 2: {0, 2}. After 3: {0, 2, 3, 5}. After 7: {0, 2, 3, 5, 7, 9, 10}. After 8: 11 = 8 + 3 becomes possible. So the answer is true.\n\nWhy loop t from big to small? With item 2, if you go upward, dp[2] becomes true and then dp[4] = dp[2] uses the same 2 again. Going downward, dp[4] reads dp[2] before item 2 changed it, so every item is used at most once.","approach":["Decide what `dp[t]` stores: true/false (can I make t), a count (how many subsets make t), or the best value (0/1 knapsack).","Start: dp[0] = true (or 1 way, or value 0). Every other dp[t] = false / 0.","For each item v, loop t from the target DOWN to v and combine dp[t] with dp[t - v]: OR for true/false, + for counting, max(dp[t], dp[t - w] + value) for knapsack.","In the example, item 8 makes dp[11] = dp[11 - 8] = dp[3] = true.","Reshape the question when needed: equal partition -> target = total / 2; Target Sum or 'partitions with difference d' -> count subsets with sum (total + d) / 2; minimum subset difference -> fill the table for total / 2 and take the largest reachable s, answer = total - 2s."],"time":"O(n · target)","space":"O(target)","identify":["Every item is either taken once or not taken, and the rule is about the total of the chosen items (sum, weight, budget).","You must split the items into two groups, or give each item a + or - sign; that is choosing one subset in disguise.","Trying every subset is 2^n, but the target value is small enough (up to about 10^4) to be a table index.","Greedy fails on a small case (take the biggest first misses an exact sum)."],"contrasts":[["Coin Change / Rod Cutting","Items can be used again and again -> Unbounded Knapsack (loop t upward)."],["Print every subset with sum k","Listing, not counting -> backtracking."],["Subarray with sum k","Contiguous part, not a free choice -> prefix sums or sliding window."]],"code":"class Solution {\n    // can some subset make exactly 'target'?\n    public boolean subsetSum(int[] a, int target) {\n        boolean[] dp = new boolean[target + 1];\n        dp[0] = true;\n        for (int v : a)\n            for (int t = target; t >= v; t--)      // downward -> each item once\n                dp[t] |= dp[t - v];\n        return dp[target];\n    }\n\n    // number of subsets with sum = target (zeros are handled too)\n    public int countSubsets(int[] a, int target) {\n        int[] dp = new int[target + 1];\n        dp[0] = 1;\n        for (int v : a)\n            for (int t = target; t >= v; t--) dp[t] += dp[t - v];\n        return dp[target];\n    }\n\n    // 0/1 knapsack: best value with weight <= W\n    public int knapsack(int W, int[] wt, int[] val) {\n        int[] dp = new int[W + 1];\n        for (int i = 0; i < wt.length; i++)\n            for (int t = W; t >= wt[i]; t--)\n                dp[t] = Math.max(dp[t], dp[t - wt[i]] + val[i]);\n        return dp[W];\n    }\n\n    // split into two groups with the smallest difference of sums\n    public int minSubsetDiff(int[] a) {\n        int total = 0;\n        for (int v : a) total += v;\n        boolean[] dp = new boolean[total / 2 + 1];\n        dp[0] = true;\n        for (int v : a) for (int t = total / 2; t >= v; t--) dp[t] |= dp[t - v];\n        for (int s = total / 2; ; s--) if (dp[s]) return total - 2 * s;\n    }\n}","example":{"problem":"Subset Sum","input":"a = [2, 3, 7, 8, 10], target = 11","cols":["after item","dp[0..11] (T = reachable)"],"rows":[["start","[T, F, F, F, F, F, F, F, F, F, F, F]"],["2","[T, F, T, F, F, F, F, F, F, F, F, F]"],["3","[T, F, T, T, F, T, F, F, F, F, F, F]"],["7","[T, F, T, T, F, T, F, T, F, T, T, F]"],["8","[T, F, T, T, F, T, F, T, T, T, T, T]"],["10","[T, F, T, T, F, T, F, T, T, T, T, T]"]],"result":"dp[11] = T, so a subset exists (3 + 8)"}},"dp/str":{"intuition":"When two strings are compared, the state is \"how much of each string I have used\": `dp[i][j]` = the answer for the first i letters of a and the first j letters of b. Look only at the last letters a[i-1] and b[j-1].\n\nExample (LCS): a = \"abcde\", b = \"ace\". If the last letters match, they can both be part of the common subsequence: dp[i][j] = dp[i-1][j-1] + 1. If they do not match, one of them is useless here, so drop it: dp[i][j] = max(dp[i-1][j], dp[i][j-1]). Filling the table gives dp[5][3] = 3 (\"ace\").\n\nMany problems are LCS with a small twist. Longest Common SUBSTRING: on a mismatch reset to 0 and keep the biggest cell. Longest Palindromic Subsequence = LCS(s, reverse(s)). Delete operations = n + m - 2·LCS. Shortest Common Supersequence length = n + m - LCS. Palindromic substrings are easier with \"expand around the centre\".","approach":["Define `dp[i][j]` on prefixes: first i letters of a, first j letters of b. Row 0 and column 0 are 0 (an empty string has nothing in common).","Fill i = 1..n, j = 1..m. If a[i-1] == b[j-1]: dp[i][j] = dp[i-1][j-1] + 1 (in the example, 'c' with 'c' gives 1 + 1 = 2).","Else dp[i][j] = max(dp[i-1][j], dp[i][j-1]). For SUBSTRING instead: else dp[i][j] = 0, and answer = biggest cell.","Turn the answer into what is asked: LPS = LCS(s, reverse s); min insertions for a palindrome = n - LPS; deletions to make equal = n + m - 2·LCS.","To print the LCS, start at dp[n][m] and walk back: diagonal on a match, otherwise toward the bigger neighbour.","Palindromic substrings: for every centre (a letter or a gap), expand while s[l] == s[r] and count or keep the longest."],"time":"O(n · m) (expand around centre: O(n²))","space":"O(n · m), or O(m) with two rows","identify":["Two strings (or one string and its reverse) and the question is about letters they share in the same order.","'Subsequence' means you may skip letters; you decide letter by letter whether to keep it.","The answer for whole strings can be built from the answer for shorter prefixes.","Palindrome + subsequence -> compare s with reverse(s). Palindrome + substring -> expand around each centre."],"contrasts":[["Edit Distance / Wildcard","Operations or pattern rules on the last letters -> String Matching DP."],["Is s a subsequence of t?","One pass with two pointers is enough."],["Longest substring without repeats","One string, a contiguous window -> sliding window."]],"code":"class Solution {\n    public int longestCommonSubsequence(String a, String b) {\n        int n = a.length(), m = b.length();\n        int[][] dp = new int[n + 1][m + 1];\n        for (int i = 1; i <= n; i++)\n            for (int j = 1; j <= m; j++)\n                dp[i][j] = a.charAt(i - 1) == b.charAt(j - 1)\n                        ? dp[i - 1][j - 1] + 1\n                        : Math.max(dp[i - 1][j], dp[i][j - 1]);\n        return dp[n][m];\n    }\n\n    public int longestCommonSubstring(String a, String b) {\n        int[][] dp = new int[a.length() + 1][b.length() + 1];\n        int best = 0;\n        for (int i = 1; i <= a.length(); i++)\n            for (int j = 1; j <= b.length(); j++)\n                if (a.charAt(i - 1) == b.charAt(j - 1)) best = Math.max(best, dp[i][j] = dp[i - 1][j - 1] + 1);\n        return best;                               // mismatch cells stay 0\n    }\n\n    public int longestPalindromeSubseq(String s) {\n        return longestCommonSubsequence(s, new StringBuilder(s).reverse().toString());\n    }\n\n    // count palindromic substrings by expanding around every centre\n    public int countSubstrings(String s) {\n        int count = 0;\n        for (int c = 0; c < 2 * s.length() - 1; c++) {\n            int l = c / 2, r = l + c % 2;\n            while (l >= 0 && r < s.length() && s.charAt(l) == s.charAt(r)) { count++; l--; r++; }\n        }\n        return count;\n    }\n}","example":{"problem":"Longest Common Subsequence","input":"a = \"abcde\", b = \"ace\"","cols":["row","j=1 (a)","j=2 (c)","j=3 (e)"],"rows":[["i=1 (a)","1","1","1"],["i=2 (b)","1","1","1"],["i=3 (c)","1","2","2"],["i=4 (d)","1","2","2"],["i=5 (e)","1","2","3"]],"result":"dp[5][3] = 3 (\"ace\")"}},"dp/stock":{"intuition":"Do not try to guess the buy and sell days directly. Instead, track a few states every day: \"holding a share\" and \"not holding\" (plus \"just sold\" for cooldown, or \"trades used\" for a limit). Each day, update every state from yesterday's states using today's price.\n\nExample (unlimited trades): prices `[7, 1, 5, 3, 6, 4]`. Start: hold = -7 (bought at 7), cash = 0. Price 1: hold = max(-7, 0 - 1) = -1, cash = 0. Price 5: cash = max(0, -1 + 5) = 4. Price 3: hold = max(-1, 4 - 3) = 1. Price 6: cash = max(4, 1 + 6) = 7. Price 4: no change in cash. The answer is 7 (buy at 1, sell at 5, buy at 3, sell at 6).\n\nA fee, a cooldown or \"at most k trades\" just adds a small term or one more state.","approach":["List the states and what each means at the end of day i (hold, sold today, resting).
