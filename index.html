<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSA Tracker</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--text:#18212f;--muted:#5d6878;--border:#e3e8f0;--line:#eef1f6;--accent:#2563eb;--accent-soft:#e0ebff;--good:#059669;--good-soft:#d8f5e9;--warn:#b45309;--warn-soft:#fdf0d5;--bad:#dc2626;--bad-soft:#fde2e2;--shadow:0 1px 2px rgba(16,24,40,.06),0 6px 18px rgba(16,24,40,.05);--r:10px;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--side:270px}
html[data-theme="dark"]{--bg:#0f1419;--panel:#18202a;--text:#e7ecf4;--muted:#98a3b5;--border:#283342;--line:#202a36;--accent:#60a5fa;--accent-soft:#1c3352;--good:#34d399;--good-soft:#0c3b2e;--warn:#fbbf24;--warn-soft:#4a3410;--bad:#f87171;--bad-soft:#4c1d1d;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25)}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.45;font-size:14px}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}
.app{display:grid;grid-template-columns:var(--side) 1fr;grid-template-rows:auto 1fr;min-height:100vh}
.header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.7rem 1.2rem;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:.6rem}.brand h1{font-size:1.05rem;margin:0;letter-spacing:-.01em}
.menu-btn{display:none}
.hdr-actions{display:flex;align-items:center;gap:.5rem}
.who{font-size:.8rem;color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{border:1px solid var(--border);background:var(--panel);border-radius:8px;padding:.38rem .75rem;cursor:pointer;font-size:.84rem;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:.22rem .55rem;font-size:.78rem}
.btn.ghost{border-color:transparent;background:transparent}
.sidebar{background:var(--panel);border-right:1px solid var(--border);padding:1rem .8rem;position:sticky;top:53px;height:calc(100vh - 53px);overflow:auto}
.ov{display:grid;gap:.55rem;margin-bottom:1rem}
.ov-row{font-size:.78rem;color:var(--muted)}.ov-row b{color:var(--text);font-weight:600}
.ov-top{display:flex;justify-content:space-between;margin-bottom:.2rem}
.bar{height:5px;border-radius:99px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.green>i{background:var(--good)}
.side-h{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:.6rem .3rem .35rem}
.side-list{list-style:none;margin:0;padding:0}
.side-list button{width:100%;display:flex;align-items:center;gap:.45rem;border:0;background:transparent;padding:.36rem .45rem;border-radius:7px;cursor:pointer;text-align:left;font-size:.84rem}
.side-list button:hover{background:var(--line)}
.side-list .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-list .ct{font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums}
.main{padding:1rem 1.4rem 3rem;min-width:0;max-width:1100px}
.tabs{display:flex;gap:.25rem;border-bottom:1px solid var(--border);margin-bottom:.9rem}
.tab{border:0;background:transparent;padding:.55rem .9rem;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.tab .n{font-size:.74rem;color:var(--muted);margin-left:.3rem;font-weight:400}
.notice{display:flex;align-items:center;justify-content:space-between;gap:1rem;background:var(--accent-soft);border-radius:var(--r);padding:.6rem .9rem;margin-bottom:.9rem;font-size:.85rem}
.today{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:.75rem .95rem;margin-bottom:.9rem;box-shadow:var(--shadow)}
.today h3{margin:0 0 .4rem;font-size:.92rem}
.today ul{margin:0;padding-left:1.1rem;font-size:.85rem}
.today .muted{font-size:.82rem}
.toolbar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:.8rem}
.toolbar input[type=search]{flex:1;min-width:180px;border:1px solid var(--border);border-radius:8px;padding:.4rem .65rem;background:var(--panel)}
.toolbar select{border:1px solid var(--border);border-radius:8px;padding:.38rem .5rem;background:var(--panel)}
.chk{display:flex;align-items:center;gap:.3rem;font-size:.84rem;color:var(--muted);cursor:pointer}
.muted{color:var(--muted)}
.acc{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);margin-bottom:.55rem;box-shadow:var(--shadow);overflow:hidden}
.acc-h{display:grid;grid-template-columns:18px 1fr auto 120px;align-items:center;gap:.7rem;width:100%;border:0;background:transparent;padding:.7rem .95rem;cursor:pointer;text-align:left}
.acc-h:hover{background:var(--line)}
.acc-h .car{color:var(--muted);transition:transform .15s;font-size:.8rem}
.acc.open .acc-h .car{transform:rotate(90deg)}
.acc-h .ttl{font-weight:600;font-size:.93rem;display:flex;align-items:center;gap:.5rem;min-width:0}
.acc-h .cnt{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.acc-b{display:none;border-top:1px solid var(--border);padding:.3rem .95rem .8rem}
.acc.open .acc-b{display:block}
.prio{display:inline-block;font-size:.66rem;font-weight:700;border-radius:5px;padding:.05rem .32rem;letter-spacing:.02em;vertical-align:middle}
.prio.P0{background:var(--bad-soft);color:var(--bad)}.prio.P1{background:var(--warn-soft);color:var(--warn)}.prio.P2{background:var(--line);color:var(--muted)}
.sub{margin-top:.75rem}
.sub-h{display:flex;align-items:center;gap:.55rem;padding:.35rem 0 .4rem;border-bottom:1px solid var(--line)}
.sub-h .sn{font-weight:600;font-size:.86rem;flex:1;min-width:0}
.sub-h .sc{font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
.qt{width:100%;border-collapse:collapse}
.qt td{padding:.38rem .3rem;border-bottom:1px solid var(--line);vertical-align:top;font-size:.86rem}
.qt tr:last-child td{border-bottom:0}
.qt td.c{width:26px}.qt td.d{width:52px}.qt td.dy{width:96px;text-align:right;color:var(--muted);font-size:.78rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.qt tr.done .qn a{color:var(--muted);text-decoration:line-through}
.qt tr.rel td.qn{padding-left:1.4rem}
.qt tr.rel td.qn::before{content:"↳";color:var(--muted);margin-left:-1rem;margin-right:.35rem}
.note{display:block;font-size:.77rem;color:var(--muted);margin-top:.1rem}
.note a{font-weight:500}
.must{font-size:.66rem;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:0 .3rem;margin-left:.4rem;vertical-align:1px}
.df{font-size:.74rem;font-weight:600}.df.E{color:var(--good)}.df.M{color:var(--warn)}.df.H{color:var(--bad)}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;margin:2px 0 0}
.empty{padding:1.4rem;text-align:center;color:var(--muted)}
.days{display:grid;gap:.55rem}
.day{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:.55rem .9rem;box-shadow:var(--shadow)}
.day-h{display:flex;justify-content:space-between;font-size:.84rem;font-weight:600;margin-bottom:.25rem}
.day-h .muted{font-weight:400}
.day.today-day{border-color:var(--accent)}
.rv{display:flex;align-items:center;gap:.5rem;padding:.22rem 0;font-size:.85rem}
.rv .tag{font-size:.7rem;color:var(--muted);width:72px;white-space:nowrap;font-variant-numeric:tabular-nums}
.rv.done a{color:var(--muted);text-decoration:line-through}
.rv.over .tag{color:var(--bad);font-weight:600}
.more{display:flex;justify-content:center;margin-top:.8rem}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:.8rem}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:.9rem 1rem;box-shadow:var(--shadow)}
.card h3{margin:0 0 .6rem;font-size:.95rem}
.card label{display:block;font-size:.82rem;color:var(--muted);margin:.5rem 0 .2rem}
.card input[type=date],.card input[type=number]{border:1px solid var(--border);border-radius:8px;padding:.38rem .55rem;background:var(--panel);width:100%}
.card p{font-size:.83rem;margin:.35rem 0}
.row-btns{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.7rem}
.kv{display:grid;grid-template-columns:1fr auto;gap:.25rem .8rem;font-size:.84rem}.kv b{font-variant-numeric:tabular-nums}
/* modal */
.modal-back{position:fixed;inset:0;background:rgba(10,15,25,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 1rem;z-index:50;overflow:auto}
.modal{position:relative;background:var(--panel);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(440px,100%);padding:1.3rem 1.3rem 1.1rem}
.modal.big{width:min(960px,100%);padding:0;display:flex;flex-direction:column;max-height:92vh}
.modal-x{position:absolute;top:.6rem;right:.7rem;border:0;background:transparent;font-size:1.5rem;line-height:1;cursor:pointer;color:var(--muted);padding:.2rem .45rem;border-radius:6px}
.modal-x:hover{background:var(--line)}
.g-head{padding:1.1rem 3rem .8rem 1.4rem;border-bottom:1px solid var(--border)}
.g-head .kick{font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.g-head h2{margin:.15rem 0 0;font-size:1.2rem}
.g-body{padding:.4rem 1.4rem 1.4rem;overflow:auto}
.g-body h3{font-size:.95rem;margin:1.1rem 0 .4rem}
.g-body p,.g-body li{font-size:.88rem;line-height:1.6}
.g-body ol,.g-body ul{margin:.2rem 0;padding-left:1.25rem}
.g-body code{font-family:var(--mono);font-size:.82em;background:var(--line);padding:.05rem .3rem;border-radius:4px}
.cx{display:flex;flex-wrap:wrap;gap:.6rem}
.cx-pill{flex:1;min-width:200px;background:var(--line);border-radius:8px;padding:.5rem .7rem;font-size:.85rem}
.cx-pill b{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.code-wrap{position:relative;border:1px solid var(--border);border-radius:8px;background:#0f172a}
.code-wrap pre{margin:0;padding:.9rem 1rem;overflow:auto;max-height:420px;color:#e2e8f0;font-family:var(--mono);font-size:.8rem;line-height:1.55}
.code-wrap pre code{background:none;color:inherit;padding:0;border:0;font-size:inherit;border-radius:0}
.copy{position:absolute;top:.45rem;right:.5rem;border:1px solid #334155;background:#1e293b;color:#e2e8f0;border-radius:6px;padding:.18rem .55rem;font-size:.75rem;cursor:pointer}
.ex{border:1px solid var(--border);border-radius:8px;overflow:auto}
.ex table{border-collapse:collapse;width:100%;font-size:.82rem}
.ex th,.ex td{padding:.38rem .6rem;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.ex th{background:var(--line);font-weight:600}
.ex-meta{font-size:.86rem;margin:.25rem 0 .5rem}
.res{margin-top:.5rem;font-size:.86rem}
.lc{display:grid;gap:.45rem}
.lc div{border-left:3px solid var(--accent);background:var(--line);padding:.45rem .7rem;border-radius:0 8px 8px 0;font-size:.86rem}
.lc div b{display:block}
.acc-form label{display:block;font-size:.82rem;margin:.6rem 0 .2rem}
.acc-form input{width:100%;border:1px solid var(--border);border-radius:8px;padding:.45rem .6rem;background:var(--panel)}
.pw{display:flex;gap:.4rem}
.saved{display:flex;flex-wrap:wrap;gap:.35rem;margin:.4rem 0}
.toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%) translateY(150%);background:var(--text);color:var(--panel);padding:.55rem .9rem;border-radius:9px;font-size:.85rem;transition:transform .2s;z-index:60;display:flex;gap:.6rem;align-items:center}
.toast.on{transform:translateX(-50%) translateY(0)}
.toast button{border:0;background:transparent;color:inherit;cursor:pointer;font-size:1rem}
.tday{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:.85rem 1rem;margin-bottom:.9rem;box-shadow:var(--shadow)}
.tday-top{display:flex;align-items:baseline;justify-content:space-between;gap:.8rem;flex-wrap:wrap;margin-bottom:.45rem}
.tday h2{margin:0;font-size:1.05rem}
.tcount{font-size:.88rem;color:var(--muted)}.tcount b{color:var(--text);font-size:1rem}
.tnote{font-size:.83rem;margin:.55rem 0 0}
.tsec{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:.6rem .85rem;margin-bottom:.8rem;box-shadow:var(--shadow)}
.tsec h3{margin:.1rem 0 .4rem;font-size:.92rem;display:inline-flex;gap:.5rem;align-items:baseline}
.tsec h3 .muted{font-weight:500;font-size:.8rem}
.tover summary{cursor:pointer;list-style:revert}
.tover .over-n{background:var(--bad-soft);color:var(--bad);border-radius:999px;padding:0 .5rem;font-size:.75rem}
.tt td.tg{width:150px;text-align:right;white-space:nowrap}
.tt .dy-l{font-size:.75rem;color:var(--muted);margin-right:.45rem}
.tmeta{display:block;font-size:.76rem;color:var(--muted);margin-top:.1rem}
.ttag{font-size:.68rem;border-radius:4px;padding:.05rem .35rem;margin-left:.4rem;vertical-align:1px;font-weight:600}
.ttag.new{background:var(--accent-soft);color:var(--accent)}.ttag.rev{background:var(--good-soft);color:var(--good)}.ttag.core{background:var(--warn-soft);color:var(--warn)}
.tplan{margin:.55rem 0 0;font-size:.86rem;color:var(--muted)}.tplan b{color:var(--text)}
.chip{display:inline-block;font-size:.74rem;border-radius:999px;padding:.05rem .5rem;font-weight:600;margin-right:.15rem}
.chip.new{background:var(--accent-soft);color:var(--accent)}.chip.rev,.chip.rv-t{background:var(--good-soft);color:var(--good)}.chip.core{background:var(--warn-soft);color:var(--warn)}
.chip.zero{opacity:.45}
.wk{font-size:.7rem;font-weight:600;border-radius:4px;padding:.08rem .4rem;margin-left:.55rem;vertical-align:2px;background:var(--accent-soft);color:var(--accent)}
.wk.we{background:var(--good-soft);color:var(--good)}
.tsec.trev{border-left:4px solid var(--good)}
.tsec.trev h3{color:var(--good)}
.rv-types{display:flex;flex-wrap:wrap;gap:.3rem;margin:.1rem 0 .3rem}
.tt td.d{white-space:nowrap}.tt .mn{display:block;font-size:.72rem;color:var(--muted);margin-top:.1rem}
.tmeta.rvmeta{color:var(--good);font-weight:500}
.rv-from{margin-left:auto;font-size:.74rem;color:var(--muted);padding-left:.6rem;white-space:nowrap}
.day.we{border-color:var(--good)}
.warn{background:var(--bad-soft);color:var(--bad);border-radius:6px;padding:.5rem .65rem;font-size:.84rem}
.settings .two,.settings .three{display:grid;grid-template-columns:1fr 1fr;gap:.2rem .7rem;align-items:end}.settings .fld input{width:100%}#studyCard{grid-column:span 2}@media (max-width:900px){#studyCard{grid-column:auto}}
table.avg td{white-space:nowrap}.settings .three{grid-template-columns:1fr 1fr 1fr}
.settings select{width:100%}
table.avg{width:100%;border-collapse:collapse;font-size:.84rem;margin-top:.6rem}
table.avg th,table.avg td{border-bottom:1px solid var(--border);padding:.3rem .4rem;text-align:right}
table.avg th:first-child,table.avg thead th:first-child{text-align:left}
@media (max-width:900px){.tt td.tg{width:auto}.tt .dy-l{display:block;margin:0 0 .2rem}}
@media (max-width:900px){.app{grid-template-columns:1fr}.sidebar{display:none;position:fixed;top:53px;left:0;width:280px;z-index:30;box-shadow:var(--shadow)}.sidebar.open{display:block}.menu-btn{display:inline-block}.acc-h{grid-template-columns:18px 1fr auto}.acc-h .bar{display:none}.main{padding:1rem .8rem 3rem}.qt td.dy{width:70px}}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand"><button class="btn small menu-btn" id="btnMenu" type="button" aria-label="Patterns">☰</button><h1>DSA Tracker</h1></div>
    <div class="hdr-actions">
      <span class="who" id="who"></span>
      <button class="btn small" id="btnAccount" type="button">Sign in</button>
      <button class="btn small" id="btnTheme" type="button">Theme</button>
    </div>
  </header>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <nav class="tabs" id="tabs"></nav>
    <div id="content"></div>
  </main>
</div>

<div class="modal-back hidden" id="guideModal" role="dialog" aria-modal="true" aria-labelledby="gTitle">
  <div class="modal big" id="guideBox">
    <button class="modal-x" type="button" id="guideClose" aria-label="Close">×</button>
    <div class="g-head"><div class="kick" id="gKick"></div><h2 id="gTitle"></h2></div>
    <div class="g-body" id="gBody"></div>
  </div>
</div>

<div class="modal-back hidden" id="accountModal">
  <form class="modal acc-form" id="accountForm">
    <button class="modal-x" type="button" id="btnCloseAccount" aria-label="Close">×</button>
    <h2 style="margin:0 0 .3rem;font-size:1.1rem">Sign in</h2>
    <p class="muted" style="font-size:.84rem;margin:.2rem 0">Use your mobile number and name to keep progress under one account. Progress is always saved in this browser too.</p>
    <div class="saved" id="savedUsers"></div>
    <label for="accMobile">Mobile number</label><input id="accMobile" inputmode="numeric" autocomplete="username" required pattern="[0-9]{8,15}" placeholder="10-digit mobile">
    <label for="accName">Name</label><input id="accName" autocomplete="name" required maxlength="40" placeholder="Your name">
    <label for="accPass">Password</label><div class="pw"><input id="accPass" type="password" autocomplete="current-password" required minlength="4" placeholder="At least 4 characters"><button class="btn small" type="button" id="accPassToggle">Show</button></div>
    <p class="muted" style="font-size:.78rem">Saved as <b id="accFilePreview">mobile_name</b></p>
    <div class="row-btns"><button class="btn primary" type="submit">Sign in</button><button class="btn" type="button" id="btnRegister">Create account</button></div>
  </form>
</div>
<div class="toast" id="toast" role="status"><span id="toastText"></span><button type="button" id="toastClose" aria-label="Close">×</button></div>

s-ii","q740":"count-square-submatrices-with-all-ones","q741":"integer-break","q742":"domino-and-tromino-tiling","q744":"perfect-squares","q745":"minimum-falling-path-sum","q746":"longest-increasing-path-in-a-matrix","q747":"dungeon-game","q749":"cherry-pickup-ii","q750":"delete-operation-for-two-strings","q751":"longest-palindromic-subsequence","q752":"g:0-1-knapsack-problem0945","q757":"stone-game-ii","q758":"minimum-cost-tree-from-leaf-values","q760":"longest-string-chain","q762":"binary-tree-cameras","q763":"distinct-subsequences","q764":"burst-balloons","q765":"minimum-insertion-steps-to-make-a-string-palindrome","q766":"number-of-unique-good-subsequences","q767":"number-of-ways-to-form-a-target-string-given-a-dictionary","q768":"regular-expression-matching","q769":"best-time-to-buy-and-sell-stock-iii","q770":"best-time-to-buy-and-sell-stock-iv","q771":"minimum-cost-to-cut-a-stick","q772":"maximum-profit-in-job-scheduling","q773":"wildcard-matching","q774":"shortest-common-supersequence","q775":"palindrome-partitioning-ii","q776":"g:matrix-chain-multiplication0303","q777":"g:boolean-parenthesization5610","q778":"minimum-difficulty-of-a-job-schedule","q779":"super-egg-drop","q780":"frog-jump","q781":"stone-game-iii","q782":"falling-squares","q783":"count-of-range-sum","q784":"longest-increasing-subsequence-ii","q785":"maximum-sum-queries","q786":"create-sorted-array-through-instructions","q787":"rectangle-area-ii"},"guides":{"hashmap/arrays":{"intuition":"Many array questions can be solved in one walk from left to right. The trick is to carry a small note about everything you have already seen, so you never need to look back.\n\nExample (largest sum of a subarray, Kadane's idea): `[-2, 1, -3, 4, -1, 2, 1, -5, 4]`. Keep `cur` = the best sum of a subarray that ends at the current number. At each number ask: is it better to join the previous run, or start fresh here? At 4 the previous run is -2, so we start fresh with 4. Then 4-1 = 3, 3+2 = 5, 5+1 = 6. So `cur` goes -2, 1, -2, 4, 3, 5, 6, 1, 5, and the best value ever seen is 6 (the part `[4, -1, 2, 1]`).\n\nThe same idea works for other problems. Only the note changes: a candidate and its vote count (majority element), or a running product (product except self).","approach":["Ask: to answer for index i, what do I need to know about the numbers before it? In the example it is just the best run ending at i-1.","Keep that in one or two variables. Here: `cur` (best run ending here) and `best` (best seen anywhere).","Walk once. For each number x: `cur = max(x, cur + x)`, then `best = max(best, cur)`.","If the right side also matters (product except self), do a second walk from the right with its own running value.","Test the edge cases: all negative numbers (the answer is the largest single number), one element, zeros in products."],"time":"O(n) — one or two linear passes","space":"O(1) extra (O(n) only if the output array itself is required)","identify":["The answer is about a contiguous subarray and extending it to the right only depends on whether the current running value still helps (a negative running sum never helps) → Kadane.","An element is guaranteed to occur more than n/2 (or n/3) times, and you need O(1) space → pairs of different elements can cancel each other, so Boyer-Moore voting works.","Each output position needs a combination of 'everything to the left' and 'everything to the right' (and division is not allowed) → prefix pass + suffix pass.","The required ordering is the next one lexicographically / a rotation / a sign rearrangement: the structure is positional, so reasoning about the suffix from the right end gives an in-place O(n) answer."],"contrasts":[["Maximum subarray sum (contiguous)","Maximum sum subsequence (non-contiguous) — just add all positives; no Kadane needed."],["Max subarray with a fixed length k","That is a fixed sliding window, not Kadane."],["Max product subarray","Looks like Kadane, but a negative can flip the minimum into the maximum, so you must carry both max and min ending here."]],"code":"class Solution {\n    // Kadane: best sum of a non-empty contiguous subarray\n    public int maxSubArray(int[] nums) {\n        int cur = nums[0], best = nums[0];\n        for (int i = 1; i < nums.length; i++) {\n            cur = Math.max(nums[i], cur + nums[i]); // extend or restart here\n            best = Math.max(best, cur);\n        }\n        return best;\n    }\n\n    // Boyer-Moore voting: element appearing > n/2 times\n    public int majorityElement(int[] nums) {\n        int cand = 0, count = 0;\n        for (int x : nums) {\n            if (count == 0) cand = x;\n            count += (x == cand) ? 1 : -1;\n        }\n        return cand; // verify with a second pass if a majority is not guaranteed\n    }\n\n    // Prefix pass + suffix pass: product of all other elements\n    public int[] productExceptSelf(int[] nums) {\n        int n = nums.length;\n        int[] out = new int[n];\n        out[0] = 1;\n        for (int i = 1; i < n; i++) out[i] = out[i - 1] * nums[i - 1]; // product of left side\n        int right = 1;\n        for (int i = n - 1; i >= 0; i--) { out[i] *= right; right *= nums[i]; }\n        return out;\n    }\n}","example":{"problem":"Maximum Subarray (Kadane)","input":"nums = [-2, 1, -3, 4, -1, 2, 1, -5, 4]","cols":["i","nums[i]","cur = max(x, cur + x)","best"],"rows":[["0","-2","-2 (start)","-2"],["1","1","max(1, -1) = 1 → restart","1"],["2","-3","max(-3, -2) = -2","1"],["3","4","max(4, 2) = 4 → restart","4"],["4","-1","3","4"],["5","2","5","5"],["6","1","6","6"],["7","-5","1","6"],["8","4","5","6"]],"result":"6 — subarray [4, -1, 2, 1]"}},"hashmap/hash":{"intuition":"Checking \"have I already seen the partner of this number?\" by scanning the array again is slow. A hash map answers that question at once. So walk the array, and for each element first ask the map for its partner, then put the element in the map.\n\nExample (Two Sum): `nums = [2, 7, 11, 15]`, target 9. At 2 the partner needed is 9-2 = 7. The map is empty, so store 2 at index 0. At 7 the partner needed is 2, and the map says 2 is at index 0. Answer `[0, 1]`, found in one pass.\n\nThe key can also be a \"shape\" of the item. For grouping anagrams, \"eat\", \"tea\" and \"ate\" all become \"aet\" after sorting the letters, so they land in the same bucket.","approach":["Choose the key: the value itself, the partner you need (target - x), or a shape such as the sorted letters (\"eat\" becomes \"aet\").","Choose the value: the index (Two Sum), a count (frequency questions), or a list (grouping).","Walk once. For each element, first look up what you need in the map, then add or update the current element.","Look up before you insert, so an element never pairs with itself. With [3, 3] and target 6, the second 3 finds the first one.","For one-to-one checks (isomorphic strings: \"egg\" and \"add\"), keep two maps, e -> a and a -> e, and make sure both agree."],"time":"O(n) average (O(n·k) when the key is built from a length-k string)","space":"O(n) for the map","identify":["You need to know whether some earlier element satisfies an exact relation with the current one (equal, complement, same signature); order does not matter and the array is not sorted.","Elements must be grouped by an equivalence (same letters, same pattern, same remainder): compute a key that is the same for every member of the group (e.g. the sorted letters) and bucket by it.","The answer depends only on how many times each value occurs, not on positions → frequency map / counting array.","You need O(1) membership to extend runs (longest consecutive sequence): start a run only at x where x−1 is absent."],"contrasts":[["Two Sum on an unsorted array","Hash map, O(n). If the array is already sorted, two pointers give O(1) space."],["Count subarrays with sum K","Not a plain value map — it needs a map of prefix sums (Prefix Sum + HashMap)."],["Find duplicates with O(1) extra space in 1..n","Cyclic sort / index marking instead of a hash set."]],"code":"class Solution {\n    // complement lookup: indices of two numbers adding to target\n    public int[] twoSum(int[] nums, int target) {\n        Map<Integer, Integer> seen = new HashMap<>(); // value -> index\n        for (int i = 0; i < nums.length; i++) {\n            Integer j = seen.get(target - nums[i]);\n            if (j != null) return new int[]{j, i};\n            seen.put(nums[i], i);                      // insert after the query\n        }\n        return new int[]{-1, -1};\n    }\n\n    // canonical key bucketing: group anagrams\n    public List<List<String>> groupAnagrams(String[] strs) {\n        Map<String, List<String>> groups = new HashMap<>();\n        for (String s : strs) {\n            int[] cnt = new int[26];\n            for (char c : s.toCharArray()) cnt[c - 'a']++;\n            String key = Arrays.toString(cnt);         // same letters -> same key\n            groups.computeIfAbsent(key, k -> new ArrayList<>()).add(s);\n        }\n        return new ArrayList<>(groups.values());\n    }\n\n    // membership: longest run of consecutive values\n    public int longestConsecutive(int[] nums) {\n        Set<Integer> set = new HashSet<>();\n        for (int x : nums) set.add(x);\n        int best = 0;\n        for (int x : set) {\n            if (set.contains(x - 1)) continue;         // only start at the run's beginning\n            int y = x;\n            while (set.contains(y + 1)) y++;\n            best = Math.max(best, y - x + 1);\n        }\n        return best;\n    }\n}","example":{"problem":"Two Sum","input":"nums = [3, 2, 4], target = 6","cols":["i","nums[i]","need = 6 − x","map before","action"],"rows":[["0","3","3","{}","not found → put 3:0"],["1","2","4","{3:0}","not found → put 2:1"],["2","4","2","{3:0, 2:1}","found 2 at index 1 → return [1, 2]"]],"result":"[1, 2]"}},"prefix/plain":{"intuition":"If you will be asked many \"sum from l to r\" questions, do the work once. Build a list where `pre[i]` is the sum of the first i numbers. Then any range sum is just one subtraction.\n\nExample: `a = [3, 1, 4, 1, 5]` gives `pre = [0, 3, 4, 8, 9, 14]`. The sum of indexes 1 to 3 (1+4+1 = 6) is `pre[4] - pre[1] = 9 - 3 = 6`. The big total minus the part before the range leaves exactly the range.\n\nThe reverse trick is the difference array, used when you must add a value to many ranges. To add 2 to indexes 1..3 of an array of length 5, write +2 at index 1 and -2 at index 4: `[0, 2, 0, 0, -2]`. A running sum turns this into `[0, 2, 2, 2, 0]`. The same idea works in 2D for rectangle sums.","approach":["Make `pre` one longer than the array, with `pre[0] = 0`, and set `pre[i+1] = pre[i] + a[i]`. For [3,1,4,1,5] that is [0,3,4,8,9,14].","Answer sum(l..r) as `pre[r+1] - pre[l]`. The extra 0 at the start means l = 0 needs no special case.","For many range additions, do `diff[l] += v` and `diff[r+1] -= v`, then take one running sum over `diff` at the end.","In 2D, a rectangle sum = big box - box above - box to the left + the top-left corner (it was subtracted twice).","For balance or pivot questions, compare the left sum `pre[i]` with the right sum `total - pre[i+1]`."],"time":"O(n) build, O(1) per query (O(R·C) build in 2D)","space":"O(n) (O(R·C) in 2D)","identify":["The same array is queried many times for sums (or counts) over different ranges and the array does not change between queries.","A condition at index i compares 'everything to the left' with 'everything to the right' (pivot index, balance point).","You get many 'add v to every element in [l, r]' operations and only need the final array (or the max load) at the end → difference array.","Rectangle sums in a fixed grid are needed repeatedly → 2D prefix sum."],"contrasts":[["Range sums with point updates in between","Prefix sums go stale after each update — use a Fenwick / segment tree."],["Count subarrays whose sum equals K","Needs prefix sums plus a hash map of earlier prefix values, not just range queries."],["Max subarray sum","Kadane is simpler; prefix sums only help if you also track the minimum prefix."]],"code":"class Solution {\n    // 1D prefix: pre[i] = sum of a[0..i-1]\n    static int[] buildPrefix(int[] a) {\n        int[] pre = new int[a.length + 1];\n        for (int i = 0; i < a.length; i++) pre[i + 1] = pre[i] + a[i];\n        return pre;\n    }\n    static int rangeSum(int[] pre, int l, int r) { return pre[r + 1] - pre[l]; } // inclusive l..r\n\n    // difference array: apply all [l, r, v] updates, then materialise\n    static int[] applyUpdates(int n, int[][] updates) {\n        int[] diff = new int[n + 1];\n        for (int[] u : updates) { diff[u[0]] += u[2]; diff[u[1] + 1] -= u[2]; }\n        int[] res = new int[n];\n        int run = 0;\n        for (int i = 0; i < n; i++) { run += diff[i]; res[i] = run; }\n        return res;\n    }\n\n    // 2D prefix and rectangle query (r1,c1)..(r2,c2) inclusive\n    static int[][] build2D(int[][] g) {\n        int R = g.length, C = g[0].length;\n        int[][] P = new int[R + 1][C + 1];\n        for (int i = 0; i < R; i++)\n            for (int j = 0; j < C; j++)\n                P[i + 1][j + 1] = g[i][j] + P[i][j + 1] + P[i + 1][j] - P[i][j];\n        return P;\n    }\n    static int rect(int[][] P, int r1, int c1, int r2, int c2) {\n        return P[r2 + 1][c2 + 1] - P[r1][c2 + 1] - P[r2 + 1][c1] + P[r1][c1];\n    }\n}","example":{"problem":"Range sum query","input":"a = [2, 4, 1, 3], query sum(1..3)","cols":["i","a[i]","pre[i+1] = pre[i] + a[i]"],"rows":[["—","—","pre[0] = 0"],["0","2","pre[1] = 2"],["1","4","pre[2] = 6"],["2","1","pre[3] = 7"],["3","3","pre[4] = 10"],["query","l=1, r=3","pre[4] − pre[1] = 10 − 2 = 8"]],"result":"8 (= 4 + 1 + 3)"}},"prefix/hash":{"intuition":"The sum of a subarray is the difference of two prefix sums: sum(l+1..r) = `pre[r] - pre[l]`. So \"a subarray ending here with sum k\" means \"an earlier prefix sum equal to `pre[r] - k`\". Keep every earlier prefix sum in a hash map with how many times it appeared, and you can count such subarrays in one walk.\n\nExample: `nums = [1, 2, 3]`, k = 3. The running prefix sums are 0 (before anything), 1, 3, 6. At prefix 3 we need 3-3 = 0, which was seen once, so that is the subarray [1, 2]. At prefix 6 we need 6-3 = 3, also seen once, so that is the subarray [3]. Total 2.\n\nThis works even with negative numbers, where a sliding window fails. The same trick works with remainders (\"sum divisible by k\") and XOR.","approach":["Start the map with the empty prefix: `{0: 1}` when counting, or `{0: -1}` when you need lengths. In the example this is what lets [1, 2] be found.","Walk the array and keep the running prefix (a sum, a sum mod k, or an XOR).","Look up the partner: `prefix - k` for \"sum equals k\", or the same remainder for \"divisible by k\".","Add the partner's count to the answer. For the longest subarray, use `r - firstIndex` instead.","Only then record the current prefix: increase its count, or save its first index if it is new (this keeps the longest length)."],"time":"O(n) average","space":"O(n) for the map (O(k) when keys are remainders mod k)","identify":["You must count or find subarrays whose sum / XOR / remainder hits an exact target, and the array can contain negatives or zeros; so a window cannot be shrunk greedily.","The property of a subarray equals 'some function of the right prefix minus the left prefix', e.g. sum = k, sum % k == 0, equal number of 0s and 1s (map 0 → −1).","'Even number of each vowel' style conditions: parity per character is a bitmask, and equal masks at two prefixes mean every count in between is even.","You need the longest such subarray → store the first index each prefix value appears."],"contrasts":[["Subarray sum = k with all positive numbers","A variable sliding window also works (sum only grows), with O(1) space."],["Count subarrays with at most k odd numbers","A sliding window with atMost(k) − atMost(k−1) is the usual pattern; the prefix-count map is the alternative."],["Range sum queries","Only a prefix array; no hash map needed."]],"code":"class Solution {\n    // number of subarrays with sum exactly k (works with negatives)\n    public int subarraySum(int[] nums, int k) {\n        Map<Integer, Integer> count = new HashMap<>();\n        count.put(0, 1);                           // empty prefix\n        int pre = 0, ans = 0;\n        for (int x : nums) {\n            pre += x;\n            ans += count.getOrDefault(pre - k, 0); // earlier prefixes that pair with this one\n            count.merge(pre, 1, Integer::sum);\n        }\n        return ans;\n    }\n\n    // longest subarray with sum k: keep FIRST index of each prefix\n    public int maxSubArrayLen(int[] nums, int k) {\n        Map<Integer, Integer> first = new HashMap<>();\n        first.put(0, -1);\n        int pre = 0, best = 0;\n        for (int i = 0; i < nums.length; i++) {\n            pre += nums[i];\n            Integer j = first.get(pre - k);\n            if (j != null) best = Math.max(best, i - j);\n            first.putIfAbsent(pre, i);\n        }\n        return best;\n    }\n\n    // divisible by k: equal remainders pair up\n    public int subarraysDivByK(int[] nums, int k) {\n        int[] rem = new int[k];\n        rem[0] = 1;\n        int pre = 0, ans = 0;\n        for (int x : nums) {\n            pre = ((pre + x) % k + k) % k;         // keep remainder non-negative\n            ans += rem[pre]++;\n        }\n        return ans;\n    }\n}","example":{"problem":"Subarray Sum Equals K","input":"nums = [3, 4, 7, 2, −3, 1, 4, 2], k = 7","cols":["x","pre","pre − k","count[pre − k]","ans","map after"],"rows":[["3","3","−4","0","0","{0:1, 3:1}"],["4","7","0","1","1","+ 7:1"],["7","14","7","1","2","+ 14:1"],["2","16","9","0","2","+ 16:1"],["−3","13","6","0","2","+ 13:1"],["1","14","7","1","3","14 → 2"],["4","18","11","0","3","+ 18:1"],["2","20","13","1","4","+ 20:1"]],"result":"4 subarrays: [3,4], [7], [7,2,−3,1], [1,4,2]"}},"twoptr/opp":{"intuition":"In a sorted array, put one finger at the smallest number and one at the largest. Their sum tells you which finger to move. If the sum is too small, the left number cannot work with anything, because every other partner is even smaller than the right one. So move left forward. If the sum is too big, move right back. Each step throws away one number for good, so it takes one pass instead of checking every pair.\n\nExample: `[1, 3, 4, 6, 9]`, target 9. 1+9 = 10 is too big, so move right to 6. 1+6 = 7 is too small, so move left to 3. 3+6 = 9, found.\n\nThe same picture works for palindromes (compare both ends and move inwards) and for \"container with most water\" (move the shorter wall, because the taller one cannot help while the short one limits the height).","approach":["Sort first if the original positions do not matter (or the input is already sorted, or it is a string).","Put `l = 0` and `r = n - 1`.","Look at the pair. If it is the answer, record it (and skip equal values if duplicates are not allowed).","If the value is too small, move `l` right. If it is too big, move `r` left. In the example: 10 too big, 7 too small, 9 found.","For 3Sum or 4Sum, fix one number (or two) in an outer loop and run the same two-finger scan on the rest."],"time":"O(n) per scan (O(n log n) with sorting; O(n^(k−1)) for k-Sum)","space":"O(1) extra (besides sorting)","identify":["The input is sorted (or can be sorted without losing the answer) and you are looking for a pair where moving l right can only make the value bigger, and moving r left can only make it smaller.","The condition is symmetric from both ends: palindromes, reversing, comparing a[l] with a[r].","An O(n²) 'try every pair' solution exists, and for each pair you can prove one endpoint is useless after one comparison (container with most water: the shorter wall cannot do better with a narrower width).","Trapping rain water: water at i depends on min(maxLeft, maxRight); the side with the smaller max is already decided, so process it and move inward."],"contrasts":[["Two Sum on unsorted input, return original indices","Sorting loses indices — use a hash map."],["Subarray with sum k (contiguous)","That is a window (same direction) or prefix-sum problem, not opposite ends."],["Count pairs with difference k","Pointers move in the same direction on a sorted array (or use a hash set)."]],"code":"class Solution {\n    // sorted array: indices (0-based) of two values adding to target\n    public int[] twoSumSorted(int[] a, int target) {\n        int l = 0, r = a.length - 1;\n        while (l < r) {\n            int s = a[l] + a[r];\n            if (s == target) return new int[]{l, r};\n            if (s < target) l++;   // a[l] is too small for every remaining r\n            else r--;              // a[r] is too big for every remaining l\n        }\n        return new int[]{-1, -1};\n    }\n\n    // k-Sum building block: 3Sum with duplicate skipping\n    public List<List<Integer>> threeSum(int[] nums) {\n        Arrays.sort(nums);\n        List<List<Integer>> res = new ArrayList<>();\n        for (int i = 0; i < nums.length - 2; i++) {\n            if (i > 0 && nums[i] == nums[i - 1]) continue;\n            int l = i + 1, r = nums.length - 1;\n            while (l < r) {\n                int s = nums[i] + nums[l] + nums[r];\n                if (s < 0) l++;\n                else if (s > 0) r--;\n                else {\n                    res.add(Arrays.asList(nums[i], nums[l], nums[r]));\n                    while (l < r && nums[l] == nums[l + 1]) l++;\n                    while (l < r && nums[r] == nums[r - 1]) r--;\n                    l++; r--;\n                }\n            }\n        }\n        return res;\n    }\n\n    // trapping rain water: process the side with the smaller max\n    public int trap(int[] h) {\n        int l = 0, r = h.length - 1, lmax = 0, rmax = 0, water = 0;\n        while (l < r) {\n            if (h[l] < h[r]) { lmax = Math.max(lmax, h[l]); water += lmax - h[l]; l++; }\n            else             { rmax = Math.max(rmax, h[r]); water += rmax - h[r]; r--; }\n        }\n        return water;\n    }\n}","example":{"problem":"Two Sum on a sorted array","input":"a = [2, 3, 4, 7, 11], target = 11","cols":["l","r","a[l] + a[r]","decision"],"rows":[["0","4","2 + 11 = 13","> 11 → r−−"],["0","3","2 + 7 = 9","< 11 → l++"],["1","3","3 + 7 = 10","< 11 → l++"],["2","3","4 + 7 = 11","found"]],"result":"[2, 3] (0-based; LeetCode 167 wants 1-based → [3, 4])"}},"twoptr/same":{"intuition":"Use two pointers that both move left to right. The read pointer looks at every element. The write pointer marks where the next element you keep should go. Everything before the write pointer is already the finished answer, so you change the array in place with no extra space.\n\nExample (remove duplicates from a sorted array): `[1, 1, 2, 2, 3]`. The write pointer starts at 1, since the first element is always kept. Read the second 1: it equals the last kept value, so skip it. Read 2: it is new, so write it at index 1. Read the second 2: skip. Read 3: write it at index 2. The array starts `[1, 2, 3, ...]` and the new length is 3.\n\nMoving zeroes, partitioning around a value (Dutch flag) and merging two sorted arrays all use this same \"read, then decide what to keep\" idea.","approach":["Decide the rule: the part of the array before `w` is always the finished result.","Move the read pointer `r` over every element.","If `a[r]` should be kept (new value, non-zero, belongs on the left), copy or swap it into `a[w]` and do `w++`. In the example only 1, 2 and 3 are kept.","When merging two sorted arrays in place, fill from the back so you never overwrite numbers you have not read yet.","For \"n-th from the end\" style questions, move one pointer n steps ahead first, then move both together."],"time":"O(n)","space":"O(1)","identify":["You must modify the array in place and keep a subset of elements in their original relative order (remove duplicates, remove value, move zeroes).","The elements belong to 2 or 3 classes and must be grouped (parity, colors 0/1/2) without extra memory → partition with boundary pointers.","Two sorted sequences need to be combined or compared in order → one pointer in each, always advance the smaller.","You need the k-th node from the end of a one-way structure in one pass → keep a fixed gap between two pointers."],"contrasts":[["Remove duplicates from an unsorted array","Order of equal elements is not adjacent — needs a hash set."],["Longest subarray with a condition","Same-direction pointers too, but that is a sliding window with a validity check, not a write pointer."],["Pairs adding to target in sorted array","Opposite-end pointers."]],"code":"class Solution {\n    // keep each value once (sorted input); returns new length\n    public int removeDuplicates(int[] a) {\n        if (a.length == 0) return 0;\n        int w = 1;\n        for (int r = 1; r < a.length; r++)\n            if (a[r] != a[w - 1]) a[w++] = a[r];\n        return w;\n    }\n\n    // stable \"keep non-zero, zeros to the end\"\n    public void moveZeroes(int[] a) {\n        int w = 0;\n        for (int r = 0; r < a.length; r++)\n            if (a[r] != 0) { int t = a[w]; a[w] = a[r]; a[r] = t; w++; }\n    }\n\n    // Dutch national flag: 0s | 1s | 2s\n    public void sortColors(int[] a) {\n        int lo = 0, mid = 0, hi = a.length - 1;\n        while (mid <= hi) {\n            if (a[mid] == 0) swap(a, lo++, mid++);\n            else if (a[mid] == 1) mid++;\n            else swap(a, mid, hi--);           // do not advance mid: new a[mid] is unchecked\n        }\n    }\n\n    // merge b into a (a has room at the end), fill from the back\n    public void merge(int[] a, int m, int[] b, int n) {\n        int i = m - 1, j = n - 1, k = m + n - 1;\n        while (j >= 0) a[k--] = (i >= 0 && a[i] > b[j]) ? a[i--] : b[j--];\n    }\n\n    private void swap(int[] a, int i, int j) { int t = a[i]; a[i] = a[j]; a[j] = t; }\n}","example":{"problem":"Remove Duplicates from Sorted Array","input":"a = [1, 1, 2, 3, 3]","cols":["r","a[r]","a[w − 1]","action","w","array prefix"],"rows":[["start","—","—","w = 1","1","[1]"],["1","1","1","equal → skip","1","[1]"],["2","2","1","write a[1] = 2","2","[1, 2]"],["3","3","2","write a[2] = 3","3","[1, 2, 3]"],["4","3","3","equal → skip","3","[1, 2, 3]"]],"result":"k = 3, first three elements [1, 2, 3]"}},"fastslow/all":{"intuition":"Send two runners along the same path: slow takes 1 step, fast takes 2. If the path has an end, fast reaches it first, and slow is in the middle at that moment. If the path has a loop, fast keeps going round and eventually catches slow from behind, so they meet.\n\nExample (middle): `1->2->3->4->5`. Slow and fast move to (2, 3), then (3, 5). Fast cannot move any more, so the middle is 3.\n\nExample (loop): `1->2->3->4->5`, with 5 pointing back to 3. The positions go (2, 3), (3, 5), (4, 4), so they meet at 4. Now put one pointer back at the head and move both one step at a time: (2, 5), then (3, 3). They meet at 3, which is exactly where the loop starts. This always works because the distance from the head to the loop start equals the distance from the meeting point to the loop start, going forward round the loop.","approach":["Start with `slow = fast = head`.","While `fast` and `fast.next` exist: move slow 1 step and fast 2 steps.","If they become the same node, there is a loop. To find where it starts, move one pointer to the head and step both by 1 until they meet (3 in the example).","If fast runs off the end, there is no loop, and slow is the middle (the second middle for even length).","For arrays and numbers, \"next\" can be a rule: `next(i) = nums[i]` (Find the Duplicate) or \"sum of squared digits\" (Happy Number)."],"time":"O(n)","space":"O(1)","identify":["You are iterating a 'next' function over a finite set of states (list nodes, indices in 1..n, digit transforms); a finite deterministic walk must eventually repeat, so the question 'does it repeat / where does the repeat start' is cycle detection.","You need the middle of a list in one pass without knowing its length (palindrome list, delete middle, twin sum).","O(1) extra space is required, so a visited hash set is not allowed.","Find the duplicate in an array of n+1 values in 1..n without modifying it: treating values as pointers creates a cycle whose entry is the duplicate."],"contrasts":[["Detect a cycle in a general graph","Use DFS colours or union-find; fast/slow only works when each node has exactly one 'next'."],["Remove the n-th node from the end","Two pointers with a fixed gap (same speed), not different speeds."],["Find a missing number in 0..n","XOR / sum or cyclic sort — no cycle structure is being followed."]],"code":"class Solution {\n    // entry node of the cycle, or null\n    public ListNode detectCycle(ListNode head) {\n        ListNode slow = head, fast = head;\n        while (fast != null && fast.next != null) {\n            slow = slow.next;\n            fast = fast.next.next;\n            if (slow == fast) {                  // inside the loop\n                ListNode p = head;\n                while (p != slow) { p = p.next; slow = slow.next; }\n                return p;                        // loop entry\n            }\n        }\n        return null;\n    }\n\n    // middle node (second middle for even length)\n    public ListNode middleNode(ListNode head) {\n        ListNode slow = head, fast = head;\n        while (fast != null && fast.next != null) { slow = slow.next; fast = fast.next.next; }\n        return slow;\n    }\n\n    // same idea on an implicit list: next(i) = nums[i]\n    public int findDuplicate(int[] nums) {\n        int slow = 0, fast = 0;\n        do { slow = nums[slow]; fast = nums[nums[fast]]; } while (slow != fast);\n        slow = 0;\n        while (slow != fast) { slow = nums[slow]; fast = nums[fast]; }\n        return slow;\n    }\n}","example":{"problem":"Find the Duplicate Number (values as next-pointers)","input":"nums = [1, 3, 4, 2, 2]  (edges 0→1, 1→3, 2→4, 3→2, 4→2)","cols":["phase","step","slow","fast"],"rows":[["1 (meet)","start","0","0"],["1","1","nums[0] = 1","nums[nums[0]] = 3"],["1","2","3","nums[nums[3]] = nums[2] = 4"],["1","3","2","nums[nums[4]] = nums[2] = 4"],["1","4","4","4 → meet"],["2 (entry)","reset","0","4"],["2","1","1","2"],["2","2","3","4"],["2","3","2","2 → meet"]],"result":"2 (the loop entry is the duplicated value)"}},"window/fixed":{"intuition":"Two windows of size k next to each other share all but one number. So do not add up each window from scratch. Slide it: add the new number on the right and remove the old one on the left. Each step costs the same small amount, however big k is.\n\nExample (largest sum of 3 in a row): `[2, 1, 5, 1, 3, 2]`, k = 3. The first window is 2+1+5 = 8. Slide: +1 -2 = 7. Slide: +3 -1 = 9. Slide: +2 -5 = 6. The best is 9 (the window [5, 1, 3]).\n\nInstead of a sum, you can keep letter counts. For example, \"is there an anagram of 'ab' inside 'eidbaooo'?\" asks whether some window of size 2 has the same letter counts as \"ab\".","approach":["Choose what to keep about the window: a sum, a count of each letter, or how many letters match.","For each index r, add `a[r]` to what you keep.","If `r >= k`, remove `a[r - k]`, the number that just left the window.","If `r >= k - 1`, the window is full: check it and update the answer (8, 7, 9, 6 in the example, best 9).","For anagram questions, compare the window's letter counts with the target's counts, or keep a counter of matching letters."],"time":"O(n) (O(n·26) if you compare count arrays each step)","space":"O(1) for sums, O(alphabet) or O(k) for counts","identify":["The problem states or implies a window size that never changes: exactly k consecutive elements, or the length of another string (permutation/anagram of p inside s).","The quantity of a window can be updated from the previous window by one addition and one removal (sum, counts, distinct elements).","'Take k cards from either end' → the cards you leave form a fixed window of n − k in the middle.","'Duplicate within distance k' → keep a set of the last k elements."],"contrasts":[["Longest/shortest subarray satisfying a condition","The size is the unknown → variable-size window."],["Maximum of every window of size k","Size is fixed, but max cannot be 'removed' in O(1) → monotonic deque."],["k consecutive elements with negative numbers and a sum target","Still fixed-size; negatives only break variable windows."]],"code":"class Solution {\n    // best sum over all windows of length k\n    public int maxWindowSum(int[] a, int k) {\n        int sum = 0, best = Integer.MIN_VALUE;\n        for (int r = 0; r < a.length; r++) {\n            sum += a[r];                       // enter\n            if (r >= k) sum -= a[r - k];       // leave\n            if (r >= k - 1) best = Math.max(best, sum);\n        }\n        return best;\n    }\n\n    // does s2 contain a permutation of s1? (window size = s1.length())\n    public boolean checkInclusion(String s1, String s2) {\n        int k = s1.length();\n        if (k > s2.length()) return false;\n        int[] need = new int[26], win = new int[26];\n        for (char c : s1.toCharArray()) need[c - 'a']++;\n        for (int r = 0; r < s2.length(); r++) {\n            win[s2.charAt(r) - 'a']++;\n            if (r >= k) win[s2.charAt(r - k) - 'a']--;\n            if (r >= k - 1 && Arrays.equals(need, win)) return true;\n        }\n        return false;\n    }\n}","example":{"problem":"Maximum sum of a window of size k","input":"a = [2, 1, 5, 1, 3, 2], k = 3","cols":["r","enter","leave","window","sum","best"],"rows":[["0","2","—","[2]","2","—"],["1","1","—","[2,1]","3","—"],["2","5","—","[2,1,5]","8","8"],["3","1","2","[1,5,1]","7","8"],["4","3","1","[5,1,3]","9","9"],["5","2","5","[1,3,2]","6","9"]],"result":"9 (window [5, 1, 3])"}},"window/var":{"intuition":"Here the window size is not fixed. Grow the window on the right. When it breaks the rule, shrink it from the left until it follows the rule again. This works when the rule behaves nicely: if a window breaks the rule, any bigger window that contains it also breaks it. Each element joins once and leaves once, so the whole thing is one pass.\n\nExample (longest substring without repeating letters): \"abcabcbb\". Grow to \"abc\" (length 3). The next letter 'a' is a repeat, so drop letters from the left until the old 'a' is gone, giving \"bca\". Keep going like this. No window ever gets longer than 3, so the answer is 3.\n\nFor \"exactly K\" counts, count \"at most K\" and subtract \"at most K-1\". For example, subarrays with exactly 2 distinct values = (at most 2) - (at most 1).","approach":["Start with `l = 0` and an empty summary of the window (letter counts, a sum, or the number of distinct values).","For each r, add `a[r]` to the summary.","While the window breaks the rule, remove `a[l]` and move `l` right. In the example this happens when a second 'a' arrives.","Now [l, r] is the longest good window that ends at r. Update the best length, or add `r - l + 1` if you are counting subarrays.","For \"shortest window that satisfies the rule\", flip it: while the window is good, record its length and shrink from the left."],"time":"O(n) — each element is added once and removed at most once","space":"O(alphabet) or O(distinct values)","identify":["You want the longest/shortest contiguous segment with a constraint, and the rule behaves the same way as the window grows: adding elements can only break it (≤ k distinct, ≤ k zeros, sum ≤ target with non-negative numbers) or only satisfy it.","All values are non-negative, so extending a window never decreases its sum; this is what makes shrinking from the left safe.","'Number of subarrays with at most K …' → for each r, all windows [l..r], [l+1..r], … are valid, so add r − l + 1. 'Exactly K' = atMost(K) − atMost(K − 1).","Character replacement: a window is fixable when length − maxFrequency ≤ k."],"contrasts":[["Subarray sum = k with negative numbers","Shrinking is not safe (a later negative can fix it) → prefix sum + hash map."],["Window of a fixed length k","Use the simpler fixed window."],["Longest increasing subsequence (not contiguous)","Not a window at all → DP / patience sorting."]],"code":"class Solution {\n    // longest substring without repeating characters\n    public int lengthOfLongestSubstring(String s) {\n        int[] cnt = new int[128];\n        int l = 0, best = 0;\n        for (int r = 0; r < s.length(); r++) {\n            char c = s.charAt(r);\n            cnt[c]++;\n            while (cnt[c] > 1) cnt[s.charAt(l++)]--;  // shrink until valid\n            best = Math.max(best, r - l + 1);\n        }\n        return best;\n    }\n\n    // count subarrays with at most k distinct values; exactly k = f(k) - f(k-1)\n    public int subarraysWithKDistinct(int[] a, int k) { return atMost(a, k) - atMost(a, k - 1); }\n    private int atMost(int[] a, int k) {\n        Map<Integer, Integer> cnt = new HashMap<>();\n        int l = 0, res = 0;\n        for (int r = 0; r < a.length; r++) {\n            cnt.merge(a[r], 1, Integer::sum);\n            while (cnt.size() > k) {\n                if (cnt.merge(a[l], -1, Integer::sum) == 0) cnt.remove(a[l]);\n                l++;\n            }\n            res += r - l + 1;                          // all windows ending at r\n        }\n        return res;\n    }\n\n    // shortest subarray with sum >= target (non-negative values)\n    public int minSubArrayLen(int target, int[] a) {\n        int l = 0, sum = 0, best = Integer.MAX_VALUE;\n        for (int r = 0; r < a.length; r++) {\n            sum += a[r];\n            while (sum >= target) { best = Math.min(best, r - l + 1); sum -= a[l++]; }\n        }\n        return best == Integer.MAX_VALUE ? 0 : best;\n    }\n}","example":{"problem":"Longest Substring Without Repeating Characters","input":"s = \"abcabcbb\"","cols":["r","char","shrink","window [l..r]","best"],"rows":[["0","a","—","a","1"],["1","b","—","ab","2"],["2","c","—","abc","3"],["3","a","drop a (l → 1)","bca","3"],["4","b","drop b (l → 2)","cab","3"],["5","c","drop c (l → 3)","abc","3"],["6","b","drop a, b (l → 5)","cb","3"],["7","b","drop c, b (l → 7)","b","3"]],"result":"3"}},"sortsearch/all":{"intuition":"Sorting puts things in a useful order. Equal items end up next to each other, and pairs become easy to find with two pointers or binary search.\n\nMerge sort gives an extra bonus. When you merge two sorted halves and take a number from the right half, every number still waiting in the left half is bigger than it. That lets you count \"bigger number before smaller number\" pairs (inversions) in bulk instead of one by one. Example: `[3, 1, 2]`. The halves become [3] and [1, 2]. Taking 1 from the right while 3 is still waiting on the left adds 1. Taking 2 adds 1 more. Total 2 inversions: (3,1) and (3,2).\n\nSometimes you sort by your own rule. For Largest Number, compare two strings by which order of gluing them is bigger: \"3\"+\"30\" = \"330\" beats \"303\", so 3 goes first.","approach":["Ask: which order would make this easy? By value, by end time, or by a rule between two items?","To count pairs i < j with a condition, use merge sort and count while merging, when both halves are sorted.","In the merge, when you take from the right half, add how many are left in the left half (the +1, +1 in the example).","For a custom order, write a comparator from the pair rule (a+b vs b+a) and check it is consistent.","After sorting, finish with a simple scan, two pointers or binary search."],"time":"O(n log n)","space":"O(n) for merge sort's buffer (O(log n) stack for quicksort)","identify":["You must count pairs (i < j) with a value condition such as a[i] > a[j] or a[i] > 2·a[j]: positions matter, but within each half they do not, so divide & conquer lets you count across halves after sorting them.","The correct arrangement is defined by comparing two items with each other (which concatenation is bigger, which person goes first) → custom comparator.","Sorting does not change the answer (it is a set/multiset question) and puts it in order → sort, then two pointers or binary search (valid triangles, H-index, limited sums).","You need the k-th order statistic on average O(n) → quickselect (partition from quicksort)."],"contrasts":[["Count smaller numbers after self","Same inversion idea but per element — merge sort with index tracking, or a Fenwick tree."],["Top-k frequent / k largest","A heap or bucket sort is cheaper than a full sort."],["Longest consecutive sequence in O(n)","Sorting gives O(n log n); the hash-set approach is O(n)."]],"code":"class Solution {\n    // number of pairs i < j with a[i] > a[j]\n    public long countInversions(int[] a) {\n        return sort(a, new int[a.length], 0, a.length - 1);\n    }\n    private long sort(int[] a, int[] tmp, int lo, int hi) {\n        if (lo >= hi) return 0;\n        int mid = (lo + hi) >>> 1;\n        long cnt = sort(a, tmp, lo, mid) + sort(a, tmp, mid + 1, hi);\n        int i = lo, j = mid + 1, k = lo;\n        while (i <= mid && j <= hi) {\n            if (a[i] <= a[j]) tmp[k++] = a[i++];\n            else { cnt += mid - i + 1; tmp[k++] = a[j++]; }  // all of a[i..mid] > a[j]\n        }\n        while (i <= mid) tmp[k++] = a[i++];\n        while (j <= hi) tmp[k++] = a[j++];\n        System.arraycopy(tmp, lo, a, lo, hi - lo + 1);\n        return cnt;\n    }\n\n    // custom comparator: arrange numbers to form the largest number\n    public String largestNumber(int[] nums) {\n        String[] s = new String[nums.length];\n        for (int i = 0; i < nums.length; i++) s[i] = String.valueOf(nums[i]);\n        Arrays.sort(s, (x, y) -> (y + x).compareTo(x + y));\n        if (s[0].equals(\"0\")) return \"0\";\n        return String.join(\"\", s);\n    }\n}","example":{"problem":"Count inversions with merge sort","input":"a = [5, 3, 2, 4, 1]","cols":["merge","left","right","counted while merging","running total"],"rows":[["1","[5]","[3]","take 3 → 1 left element (5) is bigger: +1","1"],["2","[3,5]","[2]","take 2 → +2 (3 and 5)","3"],["3","[4]","[1]","take 1 → +1","4"],["4","[2,3,5]","[1,4]","take 1 → +3; take 2, 3; take 4 → +1 (5); take 5","8"]],"result":"8 inversions"}},"bsearch/1d":{"intuition":"Binary search does not only find a value. It finds the first place where a yes/no question switches from \"no\" to \"yes\", as long as every answer after the first yes is also yes. Each check throws away half of the remaining range.\n\nExample: in `[1, 3, 5, 7, 9]`, find the first index whose value is at least 6. The answers to \"a[i] >= 6?\" are no, no, no, yes, yes. Search lo = 0, hi = 5. mid = 2 holds 5, which is a no, so lo = 3. mid = 4 holds 9, a yes, so hi = 4. mid = 3 holds 7, a yes, so hi = 3. Now lo = hi = 3, the answer. Lower bound, first and last position, insert position and First Bad Version are all this same idea.\n\nFor a rotated sorted array like `[4, 5, 6, 7, 0, 1, 2]`, one half around mid is always in normal sorted order. Check whether the target lies inside that sorted half to decide which side to keep.","approach":["Write the yes/no question, e.g. \"is a[i] >= 6?\". Make sure it is all no and then all yes.","Set `lo = 0` and `hi = n`. While `lo < hi`, set `mid = lo + (hi - lo) / 2`.","If the answer at mid is yes, the first yes is at mid or to its left, so `hi = mid`. Otherwise `lo = mid + 1`.","When the loop ends, `lo` is the first yes, or `n` if there is none. That is index 3 in the example.","For a rotated array: compare `a[mid]` with `a[hi]` to see which half is sorted, then check whether the target is inside that half."],"time":"O(log n)","space":"O(1)","identify":["The array is sorted (or sorted after a rotation, or 'bitonic' with one peak) and you need a position, not just existence.","You can phrase the question as 'the first index where a yes/no condition becomes true' and the condition never flips back; e.g. a[i] ≥ x, isBad(i), a[i] > a[i+1] for a peak.","A required O(log n) bound is stated, or n is up to 10^9 implicitly (first bad version).","In 'single element in a sorted array' the pairs shift parity after the single element → a yes/no question on the index (is the pair still aligned?) that switches only once."],"contrasts":[["Minimise the maximum load / speed / capacity","The search space is the answer value, not array indices → Binary Search on Answer."],["Find x in an unsorted array","No monotonic predicate → linear scan or hash set."],["Find a peak element","Not sorted, yet still binary search: a[mid] < a[mid+1] means a peak exists on the right."]],"code":"class Solution {\n    // first index with a[i] >= x (returns n if none)\n    public int lowerBound(int[] a, int x) {\n        int lo = 0, hi = a.length;                // search in [lo, hi)\n        while (lo < hi) {\n            int mid = lo + (hi - lo) / 2;\n            if (a[mid] >= x) hi = mid;            // predicate true -> answer at mid or left\n            else lo = mid + 1;\n        }\n        return lo;\n    }\n    // first index with a[i] > x\n    public int upperBound(int[] a, int x) {\n        int lo = 0, hi = a.length;\n        while (lo < hi) {\n            int mid = lo + (hi - lo) / 2;\n            if (a[mid] > x) hi = mid; else lo = mid + 1;\n        }\n        return lo;\n    }\n    // first and last position of x\n    public int[] searchRange(int[] a, int x) {\n        int l = lowerBound(a, x);\n        if (l == a.length || a[l] != x) return new int[]{-1, -1};\n        return new int[]{l, upperBound(a, x) - 1};\n    }\n    // search in a rotated sorted array (distinct values)\n    public int searchRotated(int[] a, int t) {\n        int lo = 0, hi = a.length - 1;\n        while (lo <= hi) {\n            int mid = lo + (hi - lo) / 2;\n            if (a[mid] == t) return mid;\n            if (a[lo] <= a[mid]) {                 // left half sorted\n                if (a[lo] <= t && t < a[mid]) hi = mid - 1; else lo = mid + 1;\n            } else {                               // right half sorted\n                if (a[mid] < t && t <= a[hi]) lo = mid + 1; else hi = mid - 1;\n            }\n        }\n        return -1;\n    }\n}","example":{"problem":"Lower bound of 7","input":"a = [1, 3, 5, 7, 7, 9], x = 7","cols":["lo","hi","mid","a[mid]","a[mid] ≥ 7 ?","update"],"rows":[["0","6","3","7","yes","hi = 3"],["0","3","1","3","no","lo = 2"],["2","3","2","5","no","lo = 3"],["3","3","—","—","loop ends","answer = 3"]],"result":"3 (upper bound would be 5, so 7 occupies [3, 4])"}},"bsearch/ans":{"intuition":"Sometimes you cannot directly calculate the best answer, but you can easily check one guess: \"is X good enough?\". If a guess X works, then every bigger X also works (or every smaller X, depending on the problem). So the guesses look like fail, fail, fail, pass, pass. That means you can binary search over the possible answers and run the check at each middle guess.\n\nExample (Koko Eating Bananas): `piles = [3, 6, 7, 11]`, h = 8 hours. The speed can be anything from 1 to 11. Try speed 6: 1+1+2+2 = 6 hours, which fits, so try slower. Speed 3: 1+2+3+4 = 10 hours, too slow, so go faster. Speed 5: 1+2+2+3 = 8 hours, fits. Speed 4: 1+2+2+3 = 8 hours, still fits. Speeds 3 and below fail, so the answer is 4.\n\nYou never test every speed. About log2(11), roughly 4 guesses, are enough, and each guess is one quick pass over the piles.","approach":["Find the number you are choosing: a speed, a capacity, a largest allowed sum, a smallest distance. In the example it is the eating speed.","Check the direction: if X works, does X+1 also work? (A faster speed is never slower, so yes.)","Set the range: `lo` = smallest possible answer (1), `hi` = an answer that surely works (the biggest pile, 11).","Write `works(X)` as one simple pass: here, add up `ceil(pile / X)` hours and compare with h.","Binary search: if mid works, keep it and look smaller (`hi = mid`), otherwise `lo = mid + 1`. When lo meets hi, that is the smallest answer that works (4)."],"time":"O(n · log(range))","space":"O(1)","identify":["The output is a single number to minimise or maximise, and checking a candidate value is much easier than finding the best value directly.","If a value works, every bigger value also works: a larger capacity / speed / allowed maximum can never turn a passing case into a failing one (or a smaller minimum distance can never hurt).","Typical shapes: 'minimise the largest part when splitting into k groups', 'maximise the smallest gap when placing k items', 'smallest rate to finish within H'.","The range of answers is numeric and bounded (1..max(a), max(a)..sum(a), 0..10^9) even if the array itself is unsorted."],"contrasts":[["Split into k parts to minimise the largest sum","Binary search on answer; DP also works but is O(n²·k)."],["Find a value in a sorted array","Binary search on indices, not on the answer space."],["Minimise the total cost","Total cost is rarely monotonic in a single threshold — usually greedy or DP."]],"code":"class Solution {\n    // Koko: smallest speed that finishes all piles within h hours\n    public int minEatingSpeed(int[] piles, int h) {\n        int lo = 1, hi = 0;\n        for (int p : piles) hi = Math.max(hi, p);   // speed max(p) always works\n        while (lo < hi) {\n            int mid = lo + (hi - lo) / 2;\n            if (hours(piles, mid) <= h) hi = mid;    // feasible -> try smaller\n            else lo = mid + 1;\n        }\n        return lo;\n    }\n    private long hours(int[] piles, int k) {\n        long t = 0;\n        for (int p : piles) t += (p + k - 1) / k;    // ceil(p / k)\n        return t;\n    }\n\n    // maximise the minimum distance (aggressive cows / magnetic force)\n    public int maxDistance(int[] pos, int m) {\n        Arrays.sort(pos);\n        int lo = 1, hi = pos[pos.length - 1] - pos[0];\n        while (lo < hi) {\n            int mid = lo + (hi - lo + 1) / 2;        // upper mid: searching the LAST feasible\n            if (canPlace(pos, m, mid)) lo = mid; else hi = mid - 1;\n        }\n        return lo;\n    }\n    private boolean canPlace(int[] pos, int m, int gap) {\n        int placed = 1, last = pos[0];\n        for (int i = 1; i < pos.length && placed < m; i++)\n            if (pos[i] - last >= gap) { placed++; last = pos[i]; }\n        return placed >= m;\n    }\n}","example":{"problem":"Koko Eating Bananas","input":"piles = [3, 6, 7, 11], h = 8","cols":["lo","hi","mid (speed)","hours = Σ ceil(p / mid)","≤ 8 ?","update"],"rows":[["1","11","6","1 + 1 + 2 + 2 = 6","yes","hi = 6"],["1","6","3","1 + 2 + 3 + 4 = 10","no","lo = 4"],["4","6","5","1 + 2 + 2 + 3 = 8","yes","hi = 5"],["4","5","4","1 + 2 + 2 + 3 = 8","yes","hi = 4"],["4","4","—","—","stop","answer 4"]],"result":"4"}},"bsearch/2d":{"intuition":"A sorted matrix comes in two kinds.\n\nKind 1: each row continues where the previous row ended, like one long sorted list folded into rows. Then binary search over positions 0..R*C-1 and turn a position k into row `k / C`, column `k % C`. Example: `[[1,3,5],[7,9,11],[13,15,17]]`, target 9. Position 4 is row 1, column 1, which holds 9.\n\nKind 2: each row is sorted and each column is sorted, separately. Start at the top-right corner. Everything to its left is smaller and everything below it is bigger, so each comparison removes a whole row or a whole column. Example: `[[1,4,7],[2,5,8],[3,6,9]]`, target 5. Start at 7, which is too big, so go left to 4. 4 is too small, so go down to 5. Found. This \"staircase\" walk can also count how many values are at most x, which helps find the k-th smallest or the median.","approach":["First check which kind of sorting the matrix has: one long folded list, or rows and columns sorted separately.","Folded list: binary search k in [0, R*C) and read `m[k / C][k % C]`.","Rows and columns sorted: start at (0, C-1). If the value is bigger than the target, go left. If it is smaller, go down.","For the k-th smallest or the median: binary search on the value v, and count the cells <= v with the staircase walk.","For a peak in 2D: binary search on the columns, take the biggest value in the middle column, and move toward a bigger neighbour."],"time":"O(log(R·C)) row-major; O(R + C) staircase; O((R + C) · log(range)) for counting","space":"O(1)","identify":["Every row and every column is sorted, so from a corner one direction always increases and the other always decreases; that lets you discard a full row or column per step.","Rows are sorted and each row's first element exceeds the previous row's last → the matrix is just a sorted array in disguise.","You need the k-th smallest or the median of a sorted matrix: the count of elements ≤ v only grows as v grows → binary search on the value.","Row with the most 1s in a row-sorted 0/1 matrix → the first 1 per row is a lower bound."],"contrasts":[["Search in an unsorted grid","No order → BFS/DFS or a full scan."],["Shortest path in a grid","Graph BFS, not binary search."],["K-th smallest in a sorted matrix","Binary search on value works; a min-heap (k-way merge) is the other standard approach."]],"code":"class Solution {\n    // rows and columns sorted independently: staircase from top-right\n    public boolean searchMatrix2(int[][] m, int target) {\n        int r = 0, c = m[0].length - 1;\n        while (r < m.length && c >= 0) {\n            if (m[r][c] == target) return true;\n            if (m[r][c] > target) c--;     // whole column below is even bigger\n            else r++;                      // whole row to the left is even smaller\n        }\n        return false;\n    }\n\n    // fully row-major sorted: treat as one array\n    public boolean searchMatrix(int[][] m, int target) {\n        int R = m.length, C = m[0].length, lo = 0, hi = R * C - 1;\n        while (lo <= hi) {\n            int mid = lo + (hi - lo) / 2, v = m[mid / C][mid % C];\n            if (v == target) return true;\n            if (v < target) lo = mid + 1; else hi = mid - 1;\n        }\n        return false;\n    }\n\n    // k-th smallest: binary search on the value, count <= v by staircase\n    public int kthSmallest(int[][] m, int k) {\n        int n = m.length, lo = m[0][0], hi = m[n - 1][n - 1];\n        while (lo < hi) {\n            int mid = lo + (hi - lo) / 2;\n            if (countLE(m, mid) >= k) hi = mid; else lo = mid + 1;\n        }\n        return lo;\n    }\n    private int countLE(int[][] m, int v) {\n        int n = m.length, r = n - 1, c = 0, cnt = 0;\n        while (r >= 0 && c < n) {\n            if (m[r][c] <= v) { cnt += r + 1; c++; } else r--;\n        }\n        return cnt;\n    }\n}","example":{"problem":"Search a 2D Matrix II (staircase)","input":"m = [[1,4,7,11],[2,5,8,12],[3,6,9,16],[10,13,14,17]], target = 5","cols":["(r, c)","m[r][c]","compare","move"],"rows":[["(0, 3)","11","> 5","c−− (drop column 3)"],["(0, 2)","7","> 5","c−−"],["(0, 1)","4","< 5","r++ (drop row 0)"],["(1, 1)","5","= 5","found"]],"result":"true after 4 probes"}},"strings/core":{"intuition":"Most string questions are not about a clever algorithm. They are about following the rules carefully. Walk through the characters once, remember a small amount of state (the current number, the sign, the previous value, the length of the current run), and build the answer with a StringBuilder.\n\nExample (Roman to Integer): \"MCMIV\". M = 1000. C (100) comes before a bigger letter (M), so subtract it: -100. M = +1000. I (1) comes before V (5), so subtract it: -1. V = +5. Total 1000 - 100 + 1000 - 1 + 5 = 1904.\n\nExample (compression): \"aaabbc\" becomes \"a3b2c\". Find each run of the same letter and write the letter and its length.","approach":["Write the rules as steps. For atoi: skip spaces, then an optional sign, then digits, then stop at anything else.","Walk with an index i. Use a StringBuilder, not repeated string joining or substring in a loop (that is slow).","When a value depends on the next character (Roman numerals), compare the current value with the next one, as with C before M.","For runs (\"aaabbc\"), use i at the start of a run and j to find its end. The run length is j - i.","List the edge cases before coding: empty string, number overflow, leading zeros, all characters the same."],"time":"O(n)","space":"O(n) for the output (O(1) extra otherwise)","identify":["The output is fully determined by a left-to-right reading of the input with small local context; no search over choices is needed.","Consecutive equal characters must be grouped or counted → run-length with two pointers.","A value depends on the relation between neighbouring symbols (smaller-before-larger means subtract).","Arithmetic on numbers too large for long (multiply strings, add binary) → digit-by-digit simulation with carry from the right."],"contrasts":[["Longest palindromic substring","Needs expand-around-centre or DP, not a simple scan."],["Find a pattern inside a text efficiently","Pattern matching (KMP / rolling hash)."],["Anagram / frequency questions","Hashing & counting, not simulation."]],"code":"class Solution {\n    // Roman to integer: subtract when a smaller value precedes a larger one\n    public int romanToInt(String s) {\n        int total = 0;\n        for (int i = 0; i < s.length(); i++) {\n            int v = val(s.charAt(i));\n            if (i + 1 < s.length() && v < val(s.charAt(i + 1))) total -= v;\n            else total += v;\n        }\n        return total;\n    }\n    private int val(char c) {\n        switch (c) {\n            case 'I': return 1;   case 'V': return 5;   case 'X': return 10;\n            case 'L': return 50;  case 'C': return 100; case 'D': return 500;\n            default: return 1000;\n        }\n    }\n\n    // run-length compression in place; returns new length\n    public int compress(char[] chars) {\n        int w = 0, i = 0;\n        while (i < chars.length) {\n            int j = i;\n            while (j < chars.length && chars[j] == chars[i]) j++;   // [i, j) is one run\n            chars[w++] = chars[i];\n            if (j - i > 1) for (char d : String.valueOf(j - i).toCharArray()) chars[w++] = d;\n            i = j;\n        }\n        return w;\n    }\n\n    // atoi as a tiny state machine with overflow clamp\n    public int myAtoi(String s) {\n        int i = 0, n = s.length(), sign = 1;\n        long num = 0;\n        while (i < n && s.charAt(i) == ' ') i++;\n        if (i < n && (s.charAt(i) == '+' || s.charAt(i) == '-')) sign = s.charAt(i++) == '-' ? -1 : 1;\n        while (i < n && Character.isDigit(s.charAt(i))) {\n            num = num * 10 + (s.charAt(i++) - '0');\n            if (num * sign > Integer.MAX_VALUE) return Integer.MAX_VALUE;\n            if (num * sign < Integer.MIN_VALUE) return Integer.MIN_VALUE;\n        }\n        return (int) (num * sign);\n    }\n}","example":{"problem":"Roman to Integer","input":"s = \"MCMXCIV\"","cols":["i","symbol","value","next value","action","total"],"rows":[["0","M","1000","100","add","1000"],["1","C","100","1000","subtract","900"],["2","M","1000","10","add","1900"],["3","X","10","100","subtract","1890"],["4","C","100","1","add","1990"],["5","I","1","5","subtract","1989"],["6","V","5","—","add","1994"]],"result":"1994"}},"strings/match":{"intuition":"The simple way to find a pattern in a text restarts the pattern after every mismatch, and that can be slow. KMP avoids this. After a mismatch you already know what the last few characters of the text were (they matched the start of the pattern). So you can jump straight to the longest piece of the pattern that is still matched, without moving back in the text.\n\nTo know where to jump, build an \"lps\" table first. For each position in the pattern, it stores the length of the longest part that is both a start and an end of the pattern so far. Example: the pattern \"AAB\" has lps = [0, 1, 0].\n\nSearch \"AAB\" in \"AAAB\". A matches, A matches, then the text's third A does not match B. Instead of starting over, jump j to `lps[1] = 1` (we still have one A matched). Now the text's A matches the pattern's second A, and B matches B. Found, starting at index 1. The text pointer never moved back.\n\nRabin-Karp is the other tool: compare quick number fingerprints (hashes) of each window, and check the letters only when the fingerprints match.","approach":["Build lps: `len = 0`. For i from 1: while len > 0 and `p[i] != p[len]`, set `len = lps[len - 1]`. If they are equal, len++. Then `lps[i] = len`.","Walk the text with i and the pattern with j. If the characters match, move both.","On a mismatch with j > 0, set `j = lps[j - 1]` and do not move i. With j = 0, just move i. This is the jump from 2 to 1 in the example.","When `j == m`, a match ends at i - 1. Record it, then set `j = lps[m - 1]` to keep searching.","For rotation or repetition questions, search inside the doubled string s + s."],"time":"O(n + m)","space":"O(m) for lps","identify":["You must find (all) occurrences of one string inside another and the naive O(n·m) is too slow (lengths up to 10^5).","The question is about a string's border: a prefix that is also a suffix (happy prefix, shortest palindrome via s + '#' + reverse(s)).","Rotation or repeated-pattern questions: 'is B a rotation of A' ⇔ B occurs in A + A.","Many substring equality checks of the same length → rolling hash."],"contrasts":[["Find an anagram of p in s","Order does not matter → fixed sliding window with counts."],["Wildcard / regex matching","Pattern has '*' / '?' / '.' → DP on strings."],["Longest common substring of two strings","DP (or suffix structures), not single-pattern matching."]],"code":"class Solution {\n    // lps[i] = length of longest proper prefix of p[0..i] that is also a suffix\n    static int[] buildLps(String p) {\n        int[] lps = new int[p.length()];\n        for (int i = 1, len = 0; i < p.length(); i++) {\n            while (len > 0 && p.charAt(i) != p.charAt(len)) len = lps[len - 1];\n            if (p.charAt(i) == p.charAt(len)
