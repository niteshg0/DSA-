) len++;\n            lps[i] = len;\n        }\n        return lps;\n    }\n\n    // first index of p in t, or -1 (KMP)\n    public int strStr(String t, String p) {\n        if (p.isEmpty()) return 0;\n        int[] lps = buildLps(p);\n        for (int i = 0, j = 0; i < t.length(); i++) {\n            while (j > 0 && t.charAt(i) != p.charAt(j)) j = lps[j - 1]; // reuse matched prefix\n            if (t.charAt(i) == p.charAt(j)) j++;\n            if (j == p.length()) return i - j + 1;\n        }\n        return -1;\n    }\n\n    public String longestPrefix(String s) {           // longest happy prefix\n        int[] lps = buildLps(s);\n        return s.substring(0, lps[s.length() - 1]);\n    }\n\n    public boolean rotateString(String a, String b) {\n        return a.length() == b.length() && strStr(a + a, b) >= 0;\n    }\n}","example":{"problem":"KMP search","input":"text = \"abxabcabcaby\", pattern = \"abcaby\"  (lps = [0, 0, 0, 1, 2, 0])","cols":["i","text[i]","j before","event","j after"],"rows":[["0–1","a b","0","match, match","2"],["2","x","2","mismatch → j = lps[1] = 0; still mismatch","0"],["3–7","a b c a b","0","5 matches","5"],["8","c","5","mismatch with 'y' → j = lps[4] = 2; 'c' = p[2] → match","3"],["9–10","a b","3","match, match","5"],["11","y","5","match → j = 6 = m","found"]],"result":"match starts at 11 − 6 + 1 = 6"}},"stack/paren":{"intuition":"Brackets close in the reverse order they open: the last one opened must be the first one closed. A stack works exactly this way, last in, first out. Push when something opens. When something closes, it must match the top of the stack.\n\nExample: \"{[()]}\". Push {, push [, push (. Then ) matches the top ( so pop, ] matches [ so pop, } matches { so pop. The stack is empty, so the string is valid. For \"([)]\": push (, push [, then ) arrives but the top is [, so it is invalid.\n\nExpressions work the same way. Numbers wait on the stack until an operator or a closing bracket tells you how to combine them. In Decode String, \"3[a2[c]]\", the inner \"2[c]\" becomes \"cc\", then \"acc\" repeated 3 times gives \"accaccacc\".","approach":["Decide what to push: the bracket, its index, a number, or (the text so far, the repeat count) for decode questions.","Walk left to right. When something opens, push the current state and start fresh.","When something closes, pop the top and combine: check that it matches, measure a length, or repeat the text.","For Reverse Polish Notation: push numbers. On an operator, pop two numbers, apply the operator and push the result.","At the end, anything left on the stack is unmatched (invalid) or still needs to be combined."],"time":"O(n)","space":"O(n) for the stack","identify":["The input has a recursive/nested shape (brackets inside brackets, k[...] inside k[...], function start/end logs) and the innermost part must be resolved first.","Validity depends on matching each closer with the most recent unmatched opener.","You need to remove/insert the minimum characters to balance → track unmatched openers (stack of indices) and unmatched closers.","Adjacent elements cancel or combine with the previous surviving one (remove adjacent duplicates, asteroid collisions)."],"contrasts":[["Next greater element","Also a stack, but it is monotonic ordering, not nesting → Monotonic Stack."],["Generate all valid parentheses","Enumeration → backtracking, not a stack scan."],["Longest valid parentheses","Stack of indices works; DP is the alternative — both are fine."]],"code":"class Solution {\n    public boolean isValid(String s) {\n        Deque<Character> st = new ArrayDeque<>();\n        for (char c : s.toCharArray()) {\n            if (c == '(') st.push(')');\n            else if (c == '[') st.push(']');\n            else if (c == '{') st.push('}');\n            else if (st.isEmpty() || st.pop() != c) return false; // closer must match latest opener\n        }\n        return st.isEmpty();\n    }\n\n    // \"3[a2[c]]\" -> \"accaccacc\": push (string so far, repeat count) on '['\n    public String decodeString(String s) {\n        Deque<StringBuilder> strs = new ArrayDeque<>();\n        Deque<Integer> counts = new ArrayDeque<>();\n        StringBuilder cur = new StringBuilder();\n        int num = 0;\n        for (char c : s.toCharArray()) {\n            if (Character.isDigit(c)) num = num * 10 + (c - '0');\n            else if (c == '[') { strs.push(cur); counts.push(num); cur = new StringBuilder(); num = 0; }\n            else if (c == ']') {\n                StringBuilder outer = strs.pop();\n                int k = counts.pop();\n                for (int i = 0; i < k; i++) outer.append(cur);\n                cur = outer;\n            } else cur.append(c);\n        }\n        return cur.toString();\n    }\n\n    public int evalRPN(String[] tokens) {\n        Deque<Integer> st = new ArrayDeque<>();\n        for (String t : tokens) {\n            if (\"+-*/\".contains(t) && t.length() == 1) {\n                int b = st.pop(), a = st.pop();\n                st.push(t.equals(\"+\") ? a + b : t.equals(\"-\") ? a - b : t.equals(\"*\") ? a * b : a / b);\n            } else st.push(Integer.parseInt(t));\n        }\n        return st.pop();\n    }\n}","example":{"problem":"Decode String","input":"s = \"3[a2[c]]\"","cols":["char","action","stack (string, count)","cur"],"rows":[["3","num = 3","[]","\"\""],["[","push (\"\", 3), reset","[(\"\", 3)]","\"\""],["a","append","[(\"\", 3)]","\"a\""],["2","num = 2","[(\"\", 3)]","\"a\""],["[","push (\"a\", 2), reset","[(\"\", 3), (\"a\", 2)]","\"\""],["c","append","[(\"\", 3), (\"a\", 2)]","\"c\""],["]","pop (\"a\", 2) → \"a\" + \"c\"×2","[(\"\", 3)]","\"acc\""],["]","pop (\"\", 3) → \"acc\"×3","[]","\"accaccacc\""]],"result":"\"accaccacc\""}},"stack/mono":{"intuition":"To find, for each element, the next bigger element on its right, keep a stack of elements that are still waiting for their answer. When a new element arrives, every waiting element smaller than it has just found its answer, so pop them. The stack always stays in decreasing order, and each element is pushed once and popped once.\n\nExample (next greater element): `[2, 1, 5, 3, 6]`. Push 2. 1 is smaller, so push it too. Then 5 arrives: it pops 1 (answer 5) and pops 2 (answer 5), then 5 is pushed. Push 3. Then 6 arrives: it pops 3 (answer 6) and 5 (answer 6). At the end 6 is left with no answer, so -1. Result `[5, 5, 6, 6, -1]`.\n\nThe same pops tell you how far each element \"rules\" to the left and right. For the largest rectangle in a histogram, a bar's width is the space between the nearest smaller bar on its left and the nearest smaller bar on its right.","approach":["Decide the direction (next on the right or previous on the left) and the comparison (greater or smaller).","Walk the array. While the top of the stack is beaten by the current element, pop it and record the current element as its answer (5 pops 1 and 2 in the example).","After popping, whatever is on top (if anything) is the nearest bigger or smaller element on the left of the current one.","Push the current index.","For areas or \"sum of minimums\": an element rules from (previous smaller + 1) to (next smaller - 1). Width = right - left - 1. Use < on one side and <= on the other so equal values are not counted twice."],"time":"O(n) amortised","space":"O(n)","identify":["For each position you need the first element to the left or right that is larger/smaller (next warmer day, next greater, stock span).","An element stops mattering once a 'better' element appears after it: anything behind a taller bar is hidden (visible people, car fleets catching up).","You need, for each element, the widest range in which it is the minimum/maximum; largest rectangle, sum of subarray minimums/ranges.","Build the lexicographically smallest sequence by deleting elements (remove k digits, remove duplicate letters): drop a previous larger element while you still may."],"contrasts":[["Sliding window maximum","Needs removal from the old end too → monotonic deque."],["Valid parentheses / decode string","A stack for nesting, not monotonic order."],["k-th largest element","Ordering of all values, not nearest neighbours → heap / quickselect."]],"code":"class Solution {\n    // next greater element to the right for every index (-1 if none)\n    public int[] nextGreater(int[] a) {\n        int n = a.length;\n        int[] res = new int[n];\n        Deque<Integer> st = new ArrayDeque<>();     // values, decreasing from bottom to top\n        for (int i = n - 1; i >= 0; i--) {\n            while (!st.isEmpty() && st.peek() <= a[i]) st.pop();  // can never be anyone's answer now\n            res[i] = st.isEmpty() ? -1 : st.peek();\n            st.push(a[i]);\n        }\n        return res;\n    }\n\n    // largest rectangle in histogram: each bar's range is (prev smaller, next smaller)\n    public int largestRectangleArea(int[] h) {\n        Deque<Integer> st = new ArrayDeque<>();     // indices with increasing heights\n        int best = 0;\n        for (int i = 0; i <= h.length; i++) {\n            int cur = (i == h.length) ? 0 : h[i];   // sentinel flushes the stack\n            while (!st.isEmpty() && h[st.peek()] > cur) {\n                int height = h[st.pop()];\n                int left = st.isEmpty() ? -1 : st.peek();\n                best = Math.max(best, height * (i - left - 1));\n            }\n            st.push(i);\n        }\n        return best;\n    }\n\n    // days until a warmer temperature (resolve on pop)\n    public int[] dailyTemperatures(int[] t) {\n        int[] res = new int[t.length];\n        Deque<Integer> st = new ArrayDeque<>();\n        for (int i = 0; i < t.length; i++) {\n            while (!st.isEmpty() && t[st.peek()] < t[i]) { int j = st.pop(); res[j] = i - j; }\n            st.push(i);\n        }\n        return res;\n    }\n}","example":{"problem":"Next greater element (scan from the right)","input":"a = [2, 1, 2, 4, 3]","cols":["i","a[i]","popped (≤ a[i])","answer = top","stack after (bottom → top)"],"rows":[["4","3","—","−1","[3]"],["3","4","3","−1","[4]"],["2","2","—","4","[4, 2]"],["1","1","—","2","[4, 2, 1]"],["0","2","1, 2","4","[4, 2]"]],"result":"[4, 2, 4, −1, −1]"}},"stack/deque":{"intuition":"For the maximum of every window of size k, keep a double-ended queue (deque) of the useful candidates, largest at the front. Two kinds of numbers are useless. One is a number that has left the window: remove it from the front. The other is a smaller number that came before a bigger one: it leaves sooner and is smaller, so it can never be the maximum again. Remove it from the back.\n\nExample: `[1, 3, -1, -3, 5, 3, 6, 7]`, k = 3. 1 comes, then 3 removes 1. -1 joins, giving [3, -1], so the first window's max is 3. -3 joins, giving [3, -1, -3], max 3. 5 removes all of them, giving [5], max 5. 3 joins, giving [5, 3], max 5. 6 removes both, max 6. 7 removes 6, max 7. Answer `[3, 3, 5, 5, 6, 7]`.","approach":["Keep a deque of indexes whose values go from big (front) to small (back).","For each i, remove from the front while the front index is out of the window (`<= i - k`).","Remove from the back while `a[back] <= a[i]`. Those can never be the max again (5 removes 3, -1 and -3 in the example).","Push i at the back.","Once `i >= k - 1`, `a[front]` is the window max. For the minimum, keep increasing order instead. For \"max - min <= limit\", keep both deques."],"time":"O(n) — each index enters and leaves once","space":"O(k)","identify":["You need the max or min of every window (fixed size, or a variable window whose validity depends on max − min).","A DP transition takes the best value among the previous k states (jump game VI, constrained subsequence sum) → the deque maintains that best in O(1).","Older elements expire by position and weaker elements are dominated by newer ones; both kinds of removal are needed.","A heap would work but costs O(log n) per step with lazy deletion; the deque is O(1) on average per step."],"contrasts":[["Sum or average of each window","Plain fixed window — no deque needed."],["Next greater element for each index","Monotonic stack (no expiry by position)."],["Median of each window","Order statistics → two heaps / ordered multiset."]],"code":"class Solution {\n    public int[] maxSlidingWindow(int[] a, int k) {\n        int n = a.length;\n        int[] res = new int[n - k + 1];\n        Deque<Integer> dq = new ArrayDeque<>();          // indices, values decreasing\n        for (int i = 0; i < n; i++) {\n            if (!dq.isEmpty() && dq.peekFirst() <= i - k) dq.pollFirst();     // expired\n            while (!dq.isEmpty() && a[dq.peekLast()] <= a[i]) dq.pollLast();  // dominated\n            dq.offerLast(i);\n            if (i >= k - 1) res[i - k + 1] = a[dq.peekFirst()];\n        }\n        return res;\n    }\n\n    // longest subarray with max - min <= limit (two deques + variable window)\n    public int longestSubarray(int[] a, int limit) {\n        Deque<Integer> mx = new ArrayDeque<>(), mn = new ArrayDeque<>();\n        int l = 0, best = 0;\n        for (int r = 0; r < a.length; r++) {\n            while (!mx.isEmpty() && a[mx.peekLast()] < a[r]) mx.pollLast();\n            while (!mn.isEmpty() && a[mn.peekLast()] > a[r]) mn.pollLast();\n            mx.offerLast(r); mn.offerLast(r);\n            while (a[mx.peekFirst()] - a[mn.peekFirst()] > limit) {\n                l++;\n                if (mx.peekFirst() < l) mx.pollFirst();\n                if (mn.peekFirst() < l) mn.pollFirst();\n            }\n            best = Math.max(best, r - l + 1);\n        }\n        return best;\n    }\n}","example":{"problem":"Sliding Window Maximum","input":"a = [1, 3, −1, −3, 5, 3, 6, 7], k = 3","cols":["i","a[i]","expire front","pop back (≤ a[i])","deque (values)","output"],"rows":[["0","1","—","—","[1]","—"],["1","3","—","1","[3]","—"],["2","−1","—","—","[3, −1]","3"],["3","−3","—","—","[3, −1, −3]","3"],["4","5","3 (index 1)","−3, −1","[5]","5"],["5","3","—","—","[5, 3]","5"],["6","6","—","3, 5","[6]","6"],["7","7","—","6","[7]","7"]],"result":"[3, 3, 5, 5, 6, 7]"}},"llist/basic":{"intuition":"Changing a linked list means changing arrows. To delete a node, point the node before it to the node after it. Put a fake \"dummy\" node before the head. Then even the head has a node before it, and deleting it is not a special case.\n\nExample (remove all 1s): `1->2->1->3` becomes `dummy->1->2->1->3`. Start at dummy. Its next is 1, so skip it: dummy->2. Next is 2, keep it and move to 2. Its next is 1, skip it: 2->3. Result `2->3`.\n\nFor \"n-th from the end\", use two pointers n steps apart. To remove the 2nd from the end of `1->2->3->4->5`, move the fast pointer 3 steps ahead from the dummy, then move both until fast is null. Slow stops at 3, so slow.next is 4, the node to remove.","approach":["Create `dummy -> head` and start with `prev = dummy`.","If `prev.next` must go, set `prev.next = prev.next.next` and do not move prev. Otherwise move prev forward.","Return `dummy.next`, because the head may have changed (it did in the example).","Gap trick: move fast n + 1 steps from dummy, then move both until fast is null. `slow.next` is the n-th from the end.","Doubly linked list: update the four arrows (new.prev, new.next and both neighbours) in a fixed order. Draw it once before coding."],"time":"O(n)","space":"O(1)","identify":["You must delete or skip nodes that match a condition, including possibly the head → a dummy node removes the special case.","Positions are defined from the end of a singly linked list and you may only traverse once → fixed gap between two pointers.","Two lists may merge into a shared tail → equalise path lengths by switching heads (a + c + b = b + c + a).","You only have access to the node to delete (not the head) → copy the next node's value and bypass the next node."],"contrasts":[["Reverse a list or a sub-list","Reversal & Reordering (three-pointer reversal)."],["Find the middle / detect a cycle","Fast & slow pointers (different speeds)."],["Merge sorted lists","Merge pattern with a dummy tail."]],"code":"class Solution {\n    // remove every node with value val (head may be removed)\n    public ListNode removeElements(ListNode head, int val) {\n        ListNode dummy = new ListNode(0, head), prev = dummy;\n        while (prev.next != null) {\n            if (prev.next.val == val) prev.next = prev.next.next;  // unlink, stay\n            else prev = prev.next;\n        }\n        return dummy.next;\n    }\n\n    // remove the n-th node from the end in one pass\n    public ListNode removeNthFromEnd(ListNode head, int n) {\n        ListNode dummy = new ListNode(0, head), fast = dummy, slow = dummy;\n        for (int i = 0; i <= n; i++) fast = fast.next;   // gap of n + 1\n        while (fast != null) { fast = fast.next; slow = slow.next; }\n        slow.next = slow.next.next;\n        return dummy.next;\n    }\n\n    // first common node of two lists (or null)\n    public ListNode getIntersectionNode(ListNode a, ListNode b) {\n        ListNode p = a, q = b;\n        while (p != q) {\n            p = (p == null) ? b : p.next;\n            q = (q == null) ? a : q.next;\n        }\n        return p;\n    }\n}","example":{"problem":"Remove Nth Node From End","input":"1 → 2 → 3 → 4 → 5, n = 2","cols":["step","fast","slow","note"],"rows":[["init","dummy","dummy","—"],["advance fast 3","3","dummy","gap = n + 1"],["move both","4","1","—"],["move both","5","2","—"],["move both","null","3","stop"],["unlink","—","3","3.next = 5 (node 4 removed)"]],"result":"1 → 2 → 3 → 5"}},"llist/rev":{"intuition":"To reverse a list, walk along it and turn each arrow around. You need three pointers: prev (the part already reversed), curr (the node you are turning) and next (saved so you do not lose the rest of the list).\n\nExample: `1->2->3`. Start with prev = null and curr = 1. Save next = 2, point 1 to null, then move: prev = 1, curr = 2. Point 2 to 1. Point 3 to 2. The new head is 3: `3->2->1`.\n\nHarder reorder questions are combinations of the same steps: find where a segment starts and ends, reverse that segment, then reconnect the two cut ends. Reverse Nodes in k-Group does this again and again. Reorder List finds the middle, reverses the second half, and then weaves the two halves together.","approach":["Whole list: `prev = null`. While curr: `next = curr.next; curr.next = prev; prev = curr; curr = next`. The new head is prev.","Part of the list [left, right]: walk to the node just before left, reverse `right - left + 1` nodes, then join both ends back.","k-groups: check that k nodes exist, reverse them, attach them to the previous group's tail, and repeat.","Reorder list: find the middle (slow/fast), reverse the second half, then take one node from each half in turn.","Use a dummy node so reversing a segment that includes the head needs no special case."],"time":"O(n)","space":"O(1) iterative (O(n) recursion stack if recursive)","identify":["The required output visits nodes in the opposite order for some contiguous segment(s) of the list.","You must compare the first half with the reversed second half (palindrome list, twin sums, reorder L0, Ln, L1, Ln−1…).","Nodes must be regrouped in fixed-size blocks or by position parity (k-group, pairs, odd-even) without allocating new nodes.","Rotation by k = cut the list at n − k and reconnect tail to head (after making it circular)."],"contrasts":[["Print a list backwards","Recursion or a stack; no need to rewire pointers."],["Remove n-th from end","Gap pointers, no reversal."],["Sort a list","Merge sort (split + merge)."]],"code":"class Solution {\n    public ListNode reverseList(ListNode head) {\n        ListNode prev = null, curr = head;\n        while (curr != null) {\n            ListNode next = curr.next;   // save\n            curr.next = prev;            // flip\n            prev = curr;                 // step\n            curr = next;\n        }\n        return prev;\n    }\n\n    // reverse nodes at positions left..right (1-indexed)\n    public ListNode reverseBetween(ListNode head, int left, int right) {\n        ListNode dummy = new ListNode(0, head), before = dummy;\n        for (int i = 1; i < left; i++) before = before.next;\n        ListNode tail = before.next;               // becomes the segment's last node\n        for (int i = 0; i < right - left; i++) {   // move tail.next to the front of the segment\n            ListNode move = tail.next;\n            tail.next = move.next;\n            move.next = before.next;\n            before.next = move;\n        }\n        return dummy.next;\n    }\n\n    public ListNode reverseKGroup(ListNode head, int k) {\n        ListNode dummy = new ListNode(0, head), groupPrev = dummy;\n        while (true) {\n            ListNode kth = groupPrev;\n            for (int i = 0; i < k && kth != null; i++) kth = kth.next;\n            if (kth == null) break;                // fewer than k nodes left\n            ListNode groupNext = kth.next, prev = groupNext, curr = groupPrev.next;\n            while (curr != groupNext) { ListNode nx = curr.next; curr.next = prev; prev = curr; curr = nx; }\n            ListNode first = groupPrev.next;       // old first is now the group's tail\n            groupPrev.next = kth;\n            groupPrev = first;\n        }\n        return dummy.next;\n    }\n}","example":{"problem":"Reverse Linked List","input":"1 → 2 → 3","cols":["step","prev","curr","next saved","list state"],"rows":[["init","null","1","—","1 → 2 → 3"],["1","1","2","2","1 → null"],["2","2","3","3","2 → 1 → null"],["3","3","null","null","3 → 2 → 1 → null"]],"result":"3 → 2 → 1 (return prev)"}},"llist/merge":{"intuition":"To build a new list, start with a dummy node and a tail pointer. Keep adding nodes after the tail. You never need special code for the first node.\n\nExample (merge two sorted lists): `1->3->5` and `2->4`. Always take the smaller of the two front nodes: 1, 2, 3, 4, then attach the rest (5). Result `1->2->3->4->5`.\n\nExample (add two numbers stored in reverse): `2->4->3` (342) + `5->6->4` (465). 2+5 = 7. 4+6 = 10, so write 0 and carry 1. 3+4+1 = 8. Result `7->0->8` (807), just like school addition.\n\nSorting a list uses merge sort: split at the middle, sort each half, merge. Copying a list with random pointers uses a map from each old node to its new copy.","approach":["Create `dummy` and set `tail = dummy`.","Merge: while both lists have nodes, attach the smaller front node to tail and move forward. Then attach whatever is left.","Sort: find the middle (slow/fast), cut the list there, sort both halves, merge them.","Add two numbers: loop while either list or the carry remains. Digit = (a + b + carry) % 10, and carry = sum / 10.","Copy with random pointers: first make a copy of each node in a map (old -> new), then set next and random using the map."],"time":"O(n + m) merge; O(n log n) sort","space":"O(1) merge; O(log n) recursion for sort; O(n) for clone map","identify":["Output is a new list assembled from pieces of the inputs in a defined order (sorted, digit by digit, alternating).","You must sort a linked list in O(n log n); only sequential access is available, so merge sort is the natural fit.","Each node has an extra pointer (random, child) that must be preserved in a copy → map old node to new node.","Numbers are stored digit by digit, least significant first → simulate addition with carry."],"contrasts":[["Merge k sorted lists","Same merge, but choosing the smallest among k heads needs a min-heap (K-way Merge)."],["Reverse part of a list","Reversal pattern (rewiring in place)."],["Find the intersection of two lists","Pointer switching, not merging."]],"code":"class Solution {\n    public ListNode mergeTwoLists(ListNode a, ListNode b) {\n        ListNode dummy = new ListNode(0), tail = dummy;\n        while (a != null && b != null) {\n            if (a.val <= b.val) { tail.next = a; a = a.next; }\n            else { tail.next = b; b = b.next; }\n            tail = tail.next;\n        }\n        tail.next = (a != null) ? a : b;\n        return dummy.next;\n    }\n\n    public ListNode sortList(ListNode head) {\n        if (head == null || head.next == null) return head;\n        ListNode slow = head, fast = head.next;          // slow ends at the end of the first half\n        while (fast != null && fast.next != null) { slow = slow.next; fast = fast.next.next; }\n        ListNode second = slow.next;\n        slow.next = null;                                 // cut\n        return mergeTwoLists(sortList(head), sortList(second));\n    }\n\n    public ListNode addTwoNumbers(ListNode a, ListNode b) {\n        ListNode dummy = new ListNode(0), tail = dummy;\n        int carry = 0;\n        while (a != null || b != null || carry != 0) {\n            int s = carry + (a != null ? a.val : 0) + (b != null ? b.val : 0);\n            tail.next = new ListNode(s % 10);\n            tail = tail.next;\n            carry = s / 10;\n            if (a != null) a = a.next;\n            if (b != null) b = b.next;\n        }\n        return dummy.next;\n    }\n}","example":{"problem":"Merge Two Sorted Lists","input":"a = 1 → 2 → 4, b = 1 → 3 → 4","cols":["step","a head","b head","take","result so far"],"rows":[["1","1","1","a (tie → a)","1"],["2","2","1","b","1 → 1"],["3","2","3","a","1 → 1 → 2"],["4","4","3","b","1 → 1 → 2 → 3"],["5","4","4","a","… → 4"],["6","null","4","attach rest of b","1 → 1 → 2 → 3 → 4 → 4"]],"result":"1 → 1 → 2 → 3 → 4 → 4"}},"design/stack":{"intuition":"These design questions add one extra quick query to a normal stack or queue. The trick is to save extra information at push time, so the query later costs nothing.\n\nExample (Min Stack): push 5, 3, 7. Store each value with the minimum at that moment: (5,5), (3,3), (7,3). getMin reads the top: 3. Pop 7 and the top is (3,3), min 3. Pop 3 and the top is (5,5), min 5. The old minimum comes back by itself.\n\nExample (queue using two stacks): push 1, 2, 3 into the \"in\" stack. To pop, the \"out\" stack is empty, so move everything across: out = [3, 2, 1] with 1 on top. Pop gives 1, the oldest item, as a queue should. Each item moves across only once, so it is fast on average.","approach":["List the operations and how fast each must be.","Ask what to store at push time to answer the query later: the current minimum, or a running sum.","Queue from stacks: push into \"in\". Pop or peek from \"out\". Refill out from in only when out is empty.","Time windows (recent calls): keep a queue of timestamps, and before answering, remove the ones that are too old.","Test with a short sequence, including popping until the structure is empty."],"time":"O(1) per operation (amortised for the two-stack queue)","space":"O(n)","identify":["An interface is given (push/pop/top/getMin, ping, next) with per-operation complexity targets; you are designing a data structure, not solving one input.","A query (min, average, count in window) would be O(n) if recomputed, but can be maintained incrementally when elements arrive and leave in LIFO/FIFO order.","Elements leave in the reverse order they arrived → the auxiliary information can be stacked alongside them.","Only the most recent window of a stream matters → queue and evict from the front."],"contrasts":[["Get the max of a sliding window","Elements leave from the front while new ones arrive at the back → monotonic deque."],["LRU cache","Needs arbitrary removal + recency order → HashMap + doubly linked list."],["Median of a stream","Order statistics → two heaps."]],"code":"class MinStack {\n    private final Deque<int[]> st = new ArrayDeque<>();   // {value, min so far}\n    public void push(int x) { st.push(new int[]{x, st.isEmpty() ? x : Math.min(x, st.peek()[1])}); }\n    public void pop() { st.pop(); }\n    public int top() { return st.peek()[0]; }\n    public int getMin() { return st.peek()[1]; }\n}\n\nclass MyQueue {\n    private final Deque<Integer> in = new ArrayDeque<>(), out = new ArrayDeque<>();\n    public void push(int x) { in.push(x); }\n    public int pop() { move(); return out.pop(); }\n    public int peek() { move(); return out.peek(); }\n    public boolean empty() { return in.isEmpty() && out.isEmpty(); }\n    private void move() { if (out.isEmpty()) while (!in.isEmpty()) out.push(in.pop()); } // each element moves once\n}\n\nclass RecentCounter {\n    private final Deque<Integer> q = new ArrayDeque<>();\n    public int ping(int t) {\n        q.offer(t);\n        while (q.peek() < t - 3000) q.poll();    // evict outside the window\n        return q.size();\n    }\n}","example":{"problem":"Min Stack","input":"push(−2), push(0), push(−3), getMin(), pop(), top(), getMin()","cols":["operation","stack of (value, min)","returns"],"rows":[["push(−2)","[(−2, −2)]","—"],["push(0)","[(−2, −2), (0, −2)]","—"],["push(−3)","[(−2, −2), (0, −2), (−3, −3)]","—"],["getMin()","unchanged","−3"],["pop()","[(−2, −2), (0, −2)]","—"],["top()","unchanged","0"],["getMin()","unchanged","−2"]],"result":"[−3, 0, −2]"}},"design/cache":{"intuition":"An LRU cache needs two fast things: find an item by key, and move an item to the \"most recently used\" end. A hash map finds the node at once. A doubly linked list lets you unhook that node and put it at the front at once. Use both together.\n\nExample (capacity 2): put(1), put(2). The order from newest is 2, 1. get(1) moves 1 to the front, giving 1, 2. put(3): the cache is full, so remove the oldest, 2. Now get(2) returns -1.\n\nLFU is the same idea with one list for each use-count, plus the current smallest count. Time-based stores keep a sorted list of (time, value) for each key and binary search it.","approach":["Write the operations (get, put) and their target speed.","Map from key to list node, so you can find any item at once.","Keep a doubly linked list with fake head and tail nodes, so there are no null checks.","get: find the node, move it to the front, return the value. put: update it or add it at the front. If over capacity, remove the node just before the tail and its map entry (2 in the example).","Test with capacity 1, and with a put that updates an existing key."],"time":"O(1) per get/put for LRU and LFU; O(log n) per get for time-based lookups","space":"O(capacity)","identify":["The problem gives a class API with 'O(1) average' requirements for both lookup and an ordering-based eviction or retrieval.","You need to remove an arbitrary element from the middle of an ordering quickly → a doubly linked list node reachable via a hash map.","Values have versions/timestamps and you query 'latest at or before t' → per-key sorted list + binary search.","Random access plus O(1) delete (insert/delete/getRandom) → array + map from value to index, swap with the last element on delete."],"contrasts":[["Min stack","Only LIFO removal → auxiliary min per stack entry is enough."],["Top-k frequent words (one-off)","A heap or sort, not a cache with eviction."],["Design Twitter feed","Per-user lists merged with a heap (k-way merge)."]],"code":"class LRUCache {\n    private static class Node { int key, val; Node prev, next; Node(int k, int v) { key = k; val = v; } }\n    private final int cap;\n    private final Map<Integer, Node> map = new HashMap<>();\n    private final Node head = new Node(0, 0), tail = new Node(0, 0);   // sentinels\n\n    public LRUCache(int capacity) { cap = capacity; head.next = tail; tail.prev = head; }\n\n    public int get(int key) {\n        Node n = map.get(key);\n        if (n == null) return -1;\n        unlink(n); addFront(n);                      // mark as most recent\n        return n.val;\n    }\n\n    public void put(int key, int value) {\n        Node n = map.get(key);\n        if (n != null) { n.val = value; unlink(n); addFront(n); return; }\n        if (map.size() == cap) {                      // evict least recent\n            Node lru = tail.prev;\n            unlink(lru); map.remove(lru.key);\n        }\n        n = new Node(key, value);\n        map.put(key, n); addFront(n);\n    }\n\n    private void unlink(Node n) { n.prev.next = n.next; n.next.prev = n.prev; }\n    private void addFront(Node n) { n.next = head.next; n.prev = head; head.next.prev = n; head.next = n; }\n}","example":{"problem":"LRU Cache, capacity 2","input":"put(1,1), put(2,2), get(1), put(3,3), get(2), put(4,4), get(1), get(3), get(4)","cols":["operation","list (most → least recent)","returns / evicts"],"rows":[["put(1,1)","1","—"],["put(2,2)","2, 1","—"],["get(1)","1, 2","1"],["put(3,3)","3, 1","evicts 2"],["get(2)","3, 1","−1"],["put(4,4)","4, 3","evicts 1"],["get(1)","4, 3","−1"],["get(3)","3, 4","3"],["get(4)","4, 3","4"]],"result":"[1, −1, −1, 3, 4]"}},"cyclic/all":{"intuition":"If the values are known to be 1..n, every value has a \"home\": value v belongs at index v-1. Swap each value into its home. Afterwards, any index that does not hold its own value shows a missing number, and the value sitting there is a duplicate. The array works as its own hash set, so no extra space is needed.\n\nExample: `[3, 1, 2, 5, 3]` (n = 5). At index 0, 3 goes home to index 2, giving [2,1,3,5,3]. Then 2 goes to index 1, giving [1,2,3,5,3]. Now 1 is home, so move on. At index 3, 5 goes to index 4, giving [1,2,3,3,5]. The 3 at index 3 wants index 2, but index 2 already holds a 3, so leave it. Final `[1,2,3,3,5]`: index 3 should hold 4, so 4 is missing and 3 is the duplicate.","approach":["Start with `i = 0`. Look at `v = a[i]`.","If v is between 1 and n and `a[v-1] != v`, swap `a[i]` with `a[v-1]`. Do not move i, because the new `a[i]` needs a home too.","Otherwise (it is already home, out of range, or its home already has the same value) move i forward.","Walk again. The first index i where `a[i] != i + 1` gives the missing number i + 1, and `a[i]` there is a duplicate.","For 0..n (Missing Number) a sum or XOR formula is even simpler."],"time":"O(n) — each swap puts one value home for good","space":"O(1)","identify":["The values are integers in a range tied to the array length (1..n or 0..n), and you are asked what is missing, duplicated or the smallest missing positive.","O(1) extra space is required (or the array may be modified) so a hash set is not allowed.","'First missing positive': only values 1..n can matter for an array of length n, so out-of-range values can be ignored.","A mismatch between index and value directly encodes the answer (set mismatch: duplicate + missing)."],"contrasts":[["Find the duplicate without modifying the array","Floyd's cycle detection on next(i) = a[i]."],["Missing number in an arbitrary range","Values are not tied to indices → sort or hash set."],["Single number among pairs","XOR, not placement."]],"code":"class Solution {\n    // smallest missing positive integer\n    public int firstMissingPositive(int[] a) {\n        int n = a.length, i = 0;\n        while (i < n) {\n            int v = a[i];\n            if (v >= 1 && v <= n && a[v - 1] != v) { a[i] = a[v - 1]; a[v - 1] = v; }  // send v home\n            else i++;\n        }\n        for (i = 0; i < n; i++) if (a[i] != i + 1) return i + 1;\n        return n + 1;\n    }\n\n    // all numbers in 1..n that are missing\n    public List<Integer> findDisappearedNumbers(int[] a) {\n        int i = 0;\n        while (i < a.length) {\n            int home = a[i] - 1;\n            if (a[home] != a[i]) { int t = a[home]; a[home] = a[i]; a[i] = t; } else i++;\n        }\n        List<Integer> res = new ArrayList<>();\n        for (i = 0; i < a.length; i++) if (a[i] != i + 1) res.add(i + 1);\n        return res;\n    }\n}","example":{"problem":"First Missing Positive","input":"a = [3, 4, −1, 1]","cols":["i","a[i]","home","action","array"],"rows":[["0","3","2","swap with a[2]","[−1, 4, 3, 1]"],["0","−1","—","out of range → i++","[−1, 4, 3, 1]"],["1","4","3","swap with a[3]","[−1, 1, 3, 4]"],["1","1","0","swap with a[0]","[1, −1, 3, 4]"],["1","−1","—","i++","[1, −1, 3, 4]"],["2","3","2","already home → i++","[1, −1, 3, 4]"],["3","4","3","already home → i++","[1, −1, 3, 4]"],["scan","—","—","index 1 holds −1 ≠ 2","answer 2"]],"result":"2"}},"intervals/merge":{"intuition":"Once intervals are sorted by their start, an interval that overlaps the current block must come right after it. Nothing later can start earlier. So one pass is enough: keep stretching the current block while the next interval starts before the block ends. Otherwise, close the block and start a new one.\n\nExample: `[[1,3],[8,10],[2,6],[15,18]]` sorted by start is [1,3], [2,6], [8,10], [15,18]. 2 <= 3, so merge into [1,6]. 8 > 6, so start a new block [8,10]. 15 > 10, so start [15,18]. Result `[[1,6],[8,10],[15,18]]`.\n\nInsert Interval and the intersection of two lists use the same sweep on lists that are already sorted.","approach":["Sort by start (skip this if the input is already sorted).","Start a block with the first interval.","For each next interval: if `start <= block end`, set block end = max(block end, end). Otherwise save the block and start a new one.","Insert: copy intervals that end before the new one, merge all that overlap it, then copy the rest.","Intersection of two sorted lists: use two pointers. The overlap is [max of starts, min of ends] if that is valid. Move the one that ends first."],"time":"O(n log n) with sort, O(n) otherwise","space":"O(n) for the output","identify":["Ranges that touch or overlap must be combined, or you must report their overlaps/coverage.","After sorting by start, the decision for an interval depends only on the block just before it; no backtracking needed.","Two lists of disjoint sorted intervals → intersect with two pointers, always advancing the one that finishes first.","'Remove the fewest intervals so none overlap' → sort by end and keep greedily (the earliest finisher leaves the most room)."],"contrasts":[["Minimum meeting rooms (max simultaneous overlap)","Not merging — count concurrency with a heap or sweep line."],["Merge sorted arrays","Values, not ranges → two pointers merge."],["Range sum queries","Prefix sums, not interval merging."]],"code":"class Solution {\n    public int[][] merge(int[][] iv) {\n        Arrays.sort(iv, (a, b) -> Integer.compare(a[0], b[0]));\n        List<int[]> res = new ArrayList<>();\n        int[] cur = iv[0].clone();\n        for (int i = 1; i < iv.length; i++) {\n            if (iv[i][0] <= cur[1]) cur[1] = Math.max(cur[1], iv[i][1]);   // overlap -> extend\n            else { res.add(cur); cur = iv[i].clone(); }\n        }\n        res.add(cur);\n        return res.toArray(new int[0][]);\n    }\n\n    // minimum removals so the rest do not overlap: keep earliest finishers\n    public int eraseOverlapIntervals(int[][] iv) {\n        Arrays.sort(iv, (a, b) -> Integer.compare(a[1], b[1]));\n        int kept = 0, end = Integer.MIN_VALUE;\n        for (int[] x : iv) if (x[0] >= end) { kept++; end = x[1]; }\n        return iv.length - kept;\n    }\n\n    public int[][] intervalIntersection(int[][] A, int[][] B) {\n        List<int[]> res = new ArrayList<>();\n        int i = 0, j = 0;\n        while (i < A.length && j < B.length) {\n            int lo = Math.max(A[i][0], B[j][0]), hi = Math.min(A[i][1], B[j][1]);\n            if (lo <= hi) res.add(new int[]{lo, hi});\n            if (A[i][1] < B[j][1]) i++; else j++;\n        }\n        return res.toArray(new int[0][]);\n    }\n}","example":{"problem":"Merge Intervals","input":"[[1,3], [2,6], [8,10], [15,18]] (already sorted)","cols":["interval","current block","overlap?","output"],"rows":[["[1,3]","[1,3]","start","—"],["[2,6]","[1,6]","2 ≤ 3 → extend","—"],["[8,10]","[8,10]","8 > 6 → close","[1,6]"],["[15,18]","[15,18]","15 > 10 → close","[8,10]"],["end","—","flush","[15,18]"]],"result":"[[1,6], [8,10], [15,18]]"}},"intervals/sched":{"intuition":"Scheduling questions ask how many things happen at the same time. Sort the meetings by start time, and keep a min-heap of the end times of meetings still running. Before placing a new meeting, free every room whose meeting has already ended. The heap size is the number of rooms in use.\n\nExample: meetings `[[0,30],[5,10],[15,20]]`. [0,30] goes in, so the end times are {30}. [5,10]: the earliest end is 30, which is not over, so add a room: {10, 30}, 2 rooms. [15,20]: the earliest end is 10, which is over, so reuse that room: {20, 30}. The most rooms ever needed is 2.\n\nAnother way is to turn each meeting into +1 at its start and -1 at its end, sort these events by time, and keep a running count. The highest count is the answer.","approach":["Sort by start time. (Or make (time, +1/-1) events and sort them. At equal times, process -1 first if touching is allowed.)","For each meeting, pop all end times <= its start. Those rooms are free again.","Push this meeting's end time and track the largest heap size (2 in the example).","Capacity checks (Car Pooling): add passengers at pickup and remove them at drop-off in time order. Fail if the load goes over the capacity.","Pairing (boats): sort, then try to pair the heaviest person with the lightest."],"time":"O(n log n)","space":"O(n)","identify":["You need the maximum number of overlapping intervals at any moment (rooms, platforms, cars, CPU slots).","Resources become free when an interval ends and the earliest-ending one should be reused first → min-heap of end times.","Loads change only at interval boundaries → line sweep over sorted events (or a difference array on a small time range).","Partition into the most pieces so each letter appears in one piece → each piece must extend to the last occurrence of every letter inside it."],"contrasts":[["Merge overlapping intervals","Produces the union, not the concurrency count."],["Choose the most non-overlapping meetings","Sort by end, greedy keep — no heap needed."],["Meeting rooms III (which room is used most)","Same sweep but with two heaps (free rooms by id, busy rooms by end time) — see Greedy Simulation with a Heap."]],"code":"class Solution {\n    // minimum rooms so no meetings overlap\n    public int minMeetingRooms(int[][] iv) {\n        Arrays.sort(iv, (a, b) -> Integer.compare(a[0], b[0]));\n        PriorityQueue<Integer> ends = new PriorityQueue<>();\n        int best = 0;\n        for (int[] m : iv) {\n            while (!ends.isEmpty() && ends.peek() <= m[0]) ends.poll();   // free finished rooms\n            ends.offer(m[1]);\n            best = Math.max(best, ends.size());\n        }\n        return best;\n    }\n\n    // line sweep: can the car carry everyone? trips[i] = {passengers, from, to}\n    public boolean carPooling(int[][] trips, int capacity) {\n        TreeMap<Integer, Integer> delta = new TreeMap<>();\n        for (int[] t : trips) { delta.merge(t[1], t[0], Integer::sum); delta.merge(t[2], -t[0], Integer::sum); }\n        int load = 0;\n        for (int d : delta.values()) { load += d; if (load > capacity) return false; }\n        return true;\n    }\n\n    // greedy partition: extend the piece to the last occurrence of every letter in it\n    public List<Integer> partitionLabels(String s) {\n        int[] last = new int[26];\n        for (int i = 0; i < s.length(); i++) last[s.charAt(i) - 'a'] = i;\n        List<Integer> res = new ArrayList<>();\n        int start = 0, end = 0;\n        for (int i = 0; i < s.length(); i++) {\n            end = Math.max(end, last[s.charAt(i) - 'a']);\n            if (i == end) { res.add(end - start + 1); start = i + 1; }\n        }\n        return res;\n    }\n}","example":{"problem":"Meeting Rooms II","input":"[[0,30], [5,10], [15,20]]","cols":["meeting","released (end ≤ start)","heap of ends after push","rooms in use"],"rows":[["[0,30]","—","[30]","1"],["[5,10]","— (30 > 5)","[10, 30]","2"],["[15,20]","10","[20, 30]","2"]],"result":"2 rooms"}},"matrix/all":{"intuition":"Matrix questions are mostly careful index work.\n\nSpiral order peels the matrix like an onion, using four borders (top, bottom, left, right) that move inward. For the 3x3 matrix 1..9 that gives 1,2,3,6,9,8,7,4,5.\n\nRotating 90 degrees clockwise is two simple moves: flip over the diagonal (transpose), then reverse each row. Example: `[[1,2],[3,4]]` becomes [[1,3],[2,4]], then `[[3,1],[4,2]]`.\n\nWhen changes must not disturb cells you have not processed yet (Set Matrix Zeroes, Game of Life), store the extra information inside the matrix itself. Use the first row and column as markers, or keep the old and new state in different bits of the same number.","approach":["Name the borders or the index formula before writing loops: top, bottom, left, right, or (i, j) -> (j, n-1-i).","Spiral: go along the top row, down the right column, back along the bottom row (if top <= bottom), up the left column (if left <= right). Move one border inward after each side.","Rotate: swap `a[i][j]` with `a[j][i]` for j > i, then reverse each row.","Set Zeroes with no extra space: use row 0 and column 0 as flags, plus two booleans for row 0 and column 0 themselves.","Updates that must happen at the same time: write the new state into a spare bit, then shift every cell at the end."],"time":"O(R·C)","space":"O(1) extra for in-place variants","identify":["The output is the same grid transformed (rotated, transposed, zeroed, next generation) and extra memory is restricted.","You must visit cells in a geometric order (spiral, diagonal, layer by layer) rather than search.","Each cell's new value depends on its old neighbours, so naive in-place updates would read already-changed values → encode both states.","Perimeter / boundary counting on a grid: count contributions per cell (4 minus shared edges)."],"contrasts":[["Number of islands / flood fill","Connectivity search → BFS / DFS."],["Shortest path in a grid","BFS (or Dijkstra) on cells."],["Search in a sorted matrix","Binary search / staircase."]],"code":"class Solution {\n    public List<Integer> spiralOrder(int[][] m) {\n        List<Integer> res = new ArrayList<>();\n        int top = 0, bottom = m.length - 1, left = 0, right = m[0].length - 1;\n        while (top <= bottom && left <= right) {\n            for (int j = left; j <= right; j++) res.add(m[top][j]);\n            top++;\n            for (int i = top; i <= bottom; i++) res.add(m[i][right]);\n            right--;\n            if (top <= bottom) { for (int j = right; j >= left; j--) res.add(m[bottom][j]); bottom--; }\n            if (left <= right) { for (int i = bottom; i >= top; i--) res.add(m[i][left]); left++; }\n        }\n        return res;\n    }\n\n    // rotate 90 degrees clockwise in place = transpose + reverse rows\n    public void rotate(int[][] m) {\n        int n = m.length;\n        for (int i = 0; i < n; i++)\n            for (int j = i + 1; j < n; j++) { int t = m[i][j]; m[i][j] = m[j][i]; m[j][i] = t; }\n        for (int[] row : m)\n            for (int l = 0, r = n - 1; l < r; l++, r--) { int t = row[l]; row[l] = row[r]; row[r] = t; }\n    }\n\n    // set zeroes using row 0 / col 0 as markers\n    public void setZeroes(int[][] m) {\n        int R = m.length, C = m[0].length;\n        boolean row0 = false, col0 = false;\n        for (int j = 0; j < C; j++) if (m[0][j] == 0) row0 = true;\n        for (int i = 0; i < R; i++) if (m[i][0] == 0) col0 = true;\n        for (int i = 1; i < R; i++) for (int j = 1; j < C; j++) if (m[i][j] == 0) { m[i][0] = 0; m[0][j] = 0; }\n        for (int i = 1; i < R; i++) for (int j = 1; j < C; j++) if (m[i][0] == 0 || m[0][j] == 0) m[i][j] = 0;\n        if (row0) Arrays.fill(m[0], 0);\n        if (col0) for (int i = 0; i < R; i++) m[i][0] = 0;\n    }\n}","example":{"problem":"Spiral Matrix","input":"[[1,2,3],[4,5,6],[7,8,9]]","cols":["pass","boundaries (top, bottom, left, right) before","cells added"],"rows":[["top row","(0, 2, 0, 2)","1, 2, 3 → top = 1"],["right column","(1, 2, 0, 2)","6, 9 → right = 1"],["bottom row","(1, 2, 0, 1)","8, 7 → bottom = 1"],["left column","(1, 1, 0, 1)","4 → left = 1"],["top row","(1, 1, 1, 1)","5 → top = 2, loop ends"]],"result":"[1, 2, 3, 6, 9, 8, 7, 4, 5]"}},"math/all":{"intuition":"Math questions reward knowing a few exact tools. Each one replaces a slow loop with a fast one.\n\nExamples. GCD: gcd(48, 18) becomes gcd(18, 12), then gcd(12, 6), then gcd(6, 0) = 6, by taking remainders. Fast power: 3^13 uses 13 = 8 + 4 + 1, so square 3 a few times and multiply only the needed pieces: about 4 squarings instead of 12 multiplications. Sieve: to find primes up to 20, cross out the multiples of 2, then of 3, and so on. The ones left are 2, 3, 5, 7, 11, 13, 17, 19.\n\nThe main danger is overflow and negative numbers. Think about how big the numbers can get before you code.","approach":["Check the size first: can a middle result overflow an int (use long)? Does the problem want an answer modulo something?","GCD: `gcd(a, b) = gcd(b, a % b)` until b is 0.","Power: while the exponent > 0, if its lowest bit is 1, multiply the result by the base. Then square the base and halve the exponent. Handle negative exponents for doubles.","Primes up to n: for each prime p, cross out p*p, p*p + p, and so on.","Geometry: the overlap on one axis = max(0, min(right ends) - max(left ends)). Compare slopes as reduced fractions (dy, dx), not doubles."],"time":"O(log n) GCD and power; O(n log log n) sieve","space":"O(1), sieve O(n)","identify":["The input is one or two numbers (not a collection) and the constraints are large (up to 10^9 or 10^18), so you need logarithmic arithmetic rather than iteration.","The answer must be given modulo 10^9 + 7 and involves repeated multiplication → fast modular exponentiation.","Counting primes or factors below n → sieve rather than testing each number.","Points, rectangles, lines: the property can be expressed with integer coordinates (overlaps, slopes, Manhattan/Chebyshev distance); avoid floating point."],"contrasts":[["Pow(x, n) with doubles","Same binary exponentiation, but handle n = Integer.MIN_VALUE by using long."],["Count good numbers (digit choices)","Combinatorics + modular power, not DP."],["Reverse integer","Digit manipulation with overflow check before multiplying by 10."]],"code":"class Solution {\n    static long gcd(long a, long b) { return b == 0 ? a : gcd(b, a % b); }\n\n    // (base^exp) % mod by binary exponentiation\n    static long modPow(long base, long exp, long mod) {\n        long res = 1;\n        base %= mod;\n        while (exp > 0) {\n            if ((exp & 1) == 1) res = res * base % mod;   // this bit contributes\n            base = base * base % mod;\n            exp >>= 1;\n        }\n        return res;\n    }\n\n    // number of primes < n\n    public int countPrimes(int n) {\n        if (n < 3) return 0;\n        boolean[] comp = new boolean[n];\n        int cnt = 0;\n        for (int i = 2; i < n; i++) {\n            if (comp[i]) continue;\n            cnt++;\n            for (long j = (long) i * i; j < n; j += i) comp[(int) j] = true;\n        }\n        return cnt;\n    }\n\n    // reverse digits with overflow -> 0\n    public int reverse(int x) {\n        int r = 0;\n        while (x != 0) {\n            int d = x % 10;\n            if (r > Integer.MAX_VALUE / 10 || r < Integer.MIN_VALUE / 10) return 0;\n            r = r * 10 + d;\n            x /= 10;\n        }\n        return r;\n    }\n}","example":{"problem":"Fast power","input":"3^13 (13 = 1101 in binary)","cols":["exp (binary)","lowest bit","res","base after squaring"],"rows":[["1101","1 → res × 3","3","9"],["110","0","3","81"],["11","1 → res × 81","243","6561"],["1","1 → res × 6561","1594323","…"],["0","stop","1594323","—"]],"result":"1594323 = 3^13, using 4 iterations instead of 13 multiplications"}},"bits/all":{"intuition":"A number is a row of 32 bits, and bit operators work on all of them at once. A few facts do most of the work.\n\nExample: `x & (x - 1)` removes the lowest 1-bit: 12 (1100) becomes 8 (1000), then 0. Two steps, so 12 has two 1-bits. XOR cancels pairs, because a ^ a = 0 and a ^ 0 = a. So for `[4, 1, 2, 1, 2]`, XOR of everything leaves 4, the number without a pair. `(x >> i) & 1` reads bit i.\n\nBits can also store a small set, or whether each letter count is odd or even. Then \"have I seen this state before?\" becomes a simple integer check.","approach":["Decide how to look at the number: as a set of bits (a mask), as values that cancel with XOR, or bit position by bit position.","Counting 1-bits: while x != 0, do `x &= x - 1` and count (12 takes 2 steps).","Find the number without a pair: XOR everything. For \"every other number appears three times\", count each bit position and take it mod 3.","Add without +: `sum = a ^ b` (adding with no carry), `carry = (a & b) << 1`. Repeat until carry is 0.","Odd/even masks: flip the bit for each letter. Two equal masks at different places mean every letter count between them is even."],"time":"O(number of bits) per number, O(n) over an array","space":"O(1)","identify":["Every element appears an even (or k) number of times except one or two → XOR or per-bit counting cancels the rest.","The state you track is a small set or a set of parities (≤ 32 items) → a bitmask fits in an int.","You are asked about powers of two, set bits, flips between numbers (a ^ b then count ones), or ranges of AND (common prefix of the two numbers).","Operators like +, −, × are forbidden or overflow-prone → emulate with shifts and XOR/AND."],"contrasts":[["Missing number in 0..n","XOR works, but so does the sum formula — either is fine."],["Subset enumeration for n ≤ 20","Masks enumerate subsets, but the problem is backtracking/DP — bits are just the encoding."],["Maximum XOR of two numbers","Needs a binary trie (or prefix-set greedy), not simple cancellation."]],"code":"class Solution {\n    public int singleNumber(int[] a) {          // every other value appears twice\n        int x = 0;\n        for (int v : a) x ^= v;\n        return x;\n    }\n\n    public int singleNumberII(int[] a) {       // every other value appears three times\n        int res = 0;\n        for (int b = 0; b < 32; b++) {\n            int cnt = 0;\n            for (int v : a) cnt += (v >> b) & 1;\n            if (cnt % 3 != 0) res |= 1 << b;\n        }\n        return res;\n    }\n\n    public int hammingWeight(int n) {          // number of set bits\n        int c = 0;\n        while (n != 0) { n &= n - 1; c++; }    // drop lowest set bit\n        return c;\n    }\n\n    public boolean isPowerOfTwo(int n) { return n > 0 && (n & (n - 1)) == 0; }\n\n    public int getSum(int a, int b) {          // a + b without '+'\n        while (b != 0) {\n            int carry = (a & b) << 1;\n            a ^= b;\n            b = carry;\n        }\n        return a;\n    }\n\n    public int rangeBitwiseAnd(int l, int r) { // common binary prefix\n        int shift = 0;\n        while (l != r) { l >>= 1; r >>= 1; shift++; }\n        return l << shift;\n    }\n}","example":{"problem":"Single Number","input":"a = [4, 1, 2, 1, 2]","cols":["v","x before","x ^ v (binary)","x after"],"rows":[["4","0","000 ^ 100 = 100","4"],["1","4","100 ^ 001 = 101","5"],["2","5","101 ^ 010 = 111","7"],["1","7","111 ^ 001 = 110","6"],["2","6","110 ^ 010 = 100","4"]],"result":"4 (the pairs of 1 and 2 cancelled)"}},"subsets/all":{"intuition":"Making all subsets or orderings is like walking a tree of choices. At each step you make one choice (take this number or not, which unused number goes next), go deeper, and then undo the choice so you can try the next one.\n\nExample (subsets of [1, 2, 3]): start with []. Add 1 to get [1], then [1,2], then [1,2,3]. Undo 3. Undo 2, then add 3 to get [1,3]. Undo back to [], and do the same from 2: [2], [2,3]. Then [3]. That is 8 subsets, which is 2^3.\n\nWith duplicates, sort first and skip a number if it equals the one just before it at the same step. For [1, 2, 2] you get [], [1], [1,2], [1,2,2], [2], [2,2]: 6 subsets, with no repeats.","approach":["Decide the state: the current path, a start index (subsets), a used[] array (orderings), or counts (parentheses).","Record the path when it is a full answer: at every step for subsets, only when it has all n items for orderings.","Loop over the choices. Skip invalid ones, and skip duplicates (`i > start && a[i] == a[i-1]` after sorting).","Choose, go deeper, then undo (add the last item, recurse, remove it).","Cut branches early with rules, e.g. for parentheses: open <= n and close < open."],"time":"O(2^n · n) subsets, O(n! · n) permutations (output size)","space":"O(n) recursion depth (plus the output)","identify":["The question asks for ALL subsets / orderings / strings, not just a count or an optimum; the output itself is exponential.","n is small (≤ 10-15), which is the signal that exponential enumeration is expected.","Each answer is built by a sequence of independent choices from a fixed menu (letters per digit, include/exclude, open/close bracket).","Input has duplicates but the output must not → sort + skip equal siblings at the same depth."],"contrasts":[["Count the subsets with a given sum","Only a count → DP (knapsack), not enumeration."],["Combination Sum (reuse allowed, target sum)","Same backtracking but with a remaining-target constraint → Combinations & Partitioning."],["Next permutation","A single in-place step, not generating all permutations."]],"code":"class Solution {\n    public List<List<Integer>> subsets(int[] a) {\n        List<List<Integer>> res = new ArrayList<>();\n        build(a, 0, new ArrayList<>(), res);\n        return res;\n    }\n    private void build(int[] a, int start, List<Integer> path, List<List<Integer>> res) {\n        res.add(new ArrayList<>(path));                 // every node is a subset\n        for (int i = start; i < a.length; i++) {\n            // with duplicates: sort first and add  if (i > start && a[i] == a[i - 1]) continue;\n            path.add(a[i]);\n            build(a, i + 1, path, res);\n            path.remove(path.size() - 1);               // undo\n        }\n    }\n\n    public List<List<Integer>> permute(int[] a) {\n        List<List<Integer>> res = new ArrayList<>();\n        perm(a, new boolean[a.length], new ArrayList<>(), res);\n        return res;\n    }\n    private void perm(int[] a, boolean[] used, List<Integer> path, List<List<Integer>> res) {\n        if (path.size() == a.length) { res.add(new ArrayList<>(path)); return; }\n        for (int i = 0; i < a.length; i++) {\n            if (used[i]) continue;\n            used[i] = true; path.add(a[i]);\n            perm(a, used, path, res);\n            used[i] = false; path.remove(path.size() - 1);\n        }\n    }\n\n    public List<String> generateParenthesis(int n) {\n        List<String> res = new ArrayList<>();\n        gen(n, 0, 0, new StringBuilder(), res);\n        return res;\n    }\n    private void gen(int n, int open, int close, StringBuilder sb, List<String> res) {\n        if (sb.length() == 2 * n) { res.add(sb.toString()); return; }\n        if (open < n)     { sb.append('('); gen(n, open + 1, close, sb, res); sb.deleteCharAt(sb.length() - 1); }\n        if (close < open) { sb.append(')'); gen(n, open, close + 1, sb, res); sb.deleteCharAt(sb.length() - 1); }\n    }\n}","example":{"problem":"Subsets","input":"a = [1, 2, 3]","cols":["call (start)","path recorded","next choices"],"rows":[["0","[]","1, 2, 3"],["1","[1]","2, 3"],["2","[1, 2]","3"],["3","[1, 2, 3]","— (back up)"],["3","[1, 3]","—"],["2","[2]","3"],["3","[2, 3]","—"],["3","[3]","—"]],"result":"[[], [1], [1,2], [1,2,3], [1,3], [2], [2,3], [3]] — 8 = 2³ subsets"}},"backtrack/comb":{"intuition":"Combination questions also walk a tree of choices, but there is a goal to reach: a target sum, k numbers, or cuts that are all palindromes. Build one answer piece by piece. Stop a branch the moment it cannot reach the goal any more. That early stop is what keeps it fast.\n\nExample (Combination Sum, numbers can repeat): candidates `[2, 3, 6, 7]`, target 7. Try 2, 2, 2: the remaining 1 is less than the smallest candidate, so stop this branch. Go back and try 2, 2, 3: exactly 7, so record it. Try 2, 3, ...: the remaining 2 is less than 3, so stop. Continue on and find 7 by itself. Answer [[2,2,3], [7]]. Because the list is sorted, once one candidate is too big you can stop the whole loop.","approach":["State = (start index, what is still needed, current path).","If the goal is exactly met (remaining = 0), save a copy of the path.","Loop over the candidates from start. If one is too big, break (sorted input makes this safe).","Choose it and recurse with i (the same number may be used again) or i + 1 (each used once), then undo.","For placement puzzles (N-Queens, Sudoku), keep quick lookup sets of used columns and diagonals (r - c and r + c)."],"time":"Exponential in the worst case (bounded by the number of valid partial candidates)","space":"O(depth) recursion + output","identify":["You must list every combination that meets a target or rule (sum to target, k numbers, palindrome cuts, valid IP addresses).","A partial choice can be proven invalid before it is complete; the structural hook that makes pruning possible.","Constraints are small (n ≤ 20-30, board 9×9, n ≤ 9 queens), signalling exponential search with pruning.","Each element may be used once or unlimited times, which only changes the next start index (i + 1 vs i)."],"contrasts":[["Count the combinations that sum to target","Only the number → DP (coin change II / knapsack)."],["Minimum number of palindrome cuts","Optimisation → DP, not enumeration."],["All subsets with no constraint","Subsets & Permutations (record every node)."]],"code":"class Solution {\n    // each candidate may be reused; candidates are distinct\n    public List<List<Integer>> combinationSum(int[] c, int target) {\n        Arrays.sort(c);\n        List<List<Integer>> res = new ArrayList<>();\n        dfs(c, 0, target, new ArrayList<>(), res);\n        return res;\n    }\n    private void dfs(int[] c, int start, int remain, List<Integer> path, List<List<Integer>> res) {\n        if (remain == 0) { res.add(new ArrayList<>(path)); return; }\n        for (int i = start; i < c.length; i++) {\n            if (c[i] > remain) break;                 // sorted -> all later ones too big\n            path.add(c[i]);\n            dfs(c, i, remain - c[i], path, res);      // i: reuse allowed\n            path.remove(path.size() - 1);\n        }\n    }\n\n    // N-Queens: count solutions with column / diagonal sets\n    public int totalNQueens(int n) { return place(0, n, new boolean[n], new boolean[2 * n], new boolean[2 * n]); }\n    private int place(int r, int n, boolean[] col, boolean[] d1, boolean[] d2) {\n        if (r == n) return 1;\n        int count = 0;\n        for (int c = 0; c < n; c++) {\n            if (col[c] || d1[r - c + n] || d2[r + c]) continue;   // attacked\n            col[c] = d1[r - c + n] = d2[r + c] = true;\n            count += place(r + 1, n, col, d1, d2);\n            col[c] = d1[r - c + n] = d2[r + c] = false;\n        }\n        return count;\n    }\n\n    // palindrome partitioning\n    public List<List<String>> partition(String s) {\n        List<List<String>> res = new ArrayList<>();\n        cut(s, 0, new ArrayList<>(), res);\n        return res;\n    }\n    private void cut(String s, int start, List<String> path, List<List<String>> res) {\n        if (start == s.length()) { res.add(new ArrayList<>(path)); return; }\n        for (int end = start; end < s.length(); end++) {\n            if (!isPal(s, start, end)) continue;\n            path.add(s.substring(start, end + 1));\n            cut(s, end + 1, path, res);\n            path.remove(path.size() - 1);\n        }\n    }\n    private boolean isPal(String s, int i, int j) { while (i < j) if (s.charAt(i++) != s.charAt(j--)) return false; return true; }\n}","example":{"problem":"Combination Sum","input":"candidates = [2, 3, 6, 7], target = 7","cols":["path","remaining","next step"],"rows":[["[2]","5","try 2 again"],["[2, 2]","3","try 2"],["[2, 2, 2]","1","2 > 1 → break, back up"],["[2, 2, 3]","0","record [2, 2, 3]"],["[2, 3]","2","3 > 2 → break"],["[3]","4","[3, 3] leaves 1 → dead; 6 > 4 → break"],["[6]","1","7 > 1 → break"],["[7]","0","record [7]"]],"result":"[[2, 2, 3], [7]]"}},"backtrack/grid":{"intuition":"On a grid, backtracking explores paths cell by cell. A cell already on the current path cannot be used again. Mark a cell when you step on it, and unmark it when you step back, so other paths can still use it. This is different from counting islands, where a cell is marked once forever.\n\nExample (Word Search): the board is\nA B C E\nS F C S\nA D E E\nSearching for \"ABCCED\": A(0,0), B(0,1), C(0,2), then C(1,2) below it, E(2,2) and D(2,1). Found. Searching for \"ABCB\" fails, because the only B next to the C is the one already on the path.","approach":["Start a search from every cell that matches the first letter.","In `dfs(r, c, i)`: fail if (r, c) is outside the board, already on the path, or does not match `word[i]`.","If i is the last letter, succeed.","Mark the cell (e.g. set it to '#'), try the 4 neighbours with i + 1, then put the letter back.","Speed-ups: check letter counts first, start from the rarer end of the word, or use a trie when there are many words."],"time":"O(R·C · 3^L) for a path of length L (each step has at most 3 new directions)","space":"O(L) recursion","identify":["You need a path in a grid where a cell may not be revisited within the same path, but different paths may share cells.","The answer depends on the order of the cells along the path (spelling a word, collecting gold, visiting every empty cell exactly once).","Grids are small or path lengths short; exponential search is acceptable.","A global 'visited forever' would wrongly block other valid paths → you need un-marking."],"contrasts":[["Number of islands","Connectivity only — global visited, each cell once, O(R·C)."],["Shortest path in a grid","BFS gives shortest paths; no backtracking."],["Count paths moving only right/down","No revisits possible → grid DP."]],"code":"class Solution {\n    public boolean exist(char[][] b, String word) {\n        for (int r = 0; r < b.length; r++)\n            for (int c = 0; c < b[0].length; c++)\n                if (dfs(b, word, r, c, 0)) return true;\n        return false;\n    }\n    private boolean dfs(char[][] b, String w, int r, int c, int i) {\n        if (r < 0 || c < 0 || r >= b.length || c >= b[0].length || b[r][c] != w.charAt(i)) return false;\n        if (i == w.length() - 1) return true;\n        char saved = b[r][c];\n        b[r][c] = '#';                                     // on the current path\n        boolean found = dfs(b, w, r + 1, c, i + 1) || dfs(b, w, r - 1, c, i + 1)\n                     || dfs(b, w, r, c + 1, i + 1) || dfs(b, w, r, c - 1, i + 1);\n        b[r][c] = saved;                                   // backtrack\n        return found;\n    }\n\n    // maximum gold collected on a path that never revisits a cell\n    public int getMaximumGold(int[][] g) {\n        int best = 0;\n        for (int r = 0; r < g.length; r++)\n            for (int c = 0; c < g[0].length; c++)\n                if (g[r][c] > 0) best = Math.max(best, gold(g, r, c));\n        return best;\n    }\n    private int gold(int[][] g, int r, int c) {\n        if (r < 0 || c < 0 || r >= g.length || c >= g[0].length || g[r][c] == 0) return 0;\n        int v = g[r][c];\n        g[r][c] = 0;\n        int best = Math.max(Math.max(gold(g, r + 1, c), gold(g, r - 1, c)), Math.max(gold(g, r, c + 1), gold(g, r, c - 1)));\n        g[r][c] = v;\n        return v + best;\n    }\n}","example":{"problem":"Word Search","input":"board = [[A,B,C,E],[S,F,C,S],[A,D,E,E]], word = \"ABCCED\"","cols":["step i","cell (r, c)","letter","result"],"rows":[["0","(0, 0)","A","match, mark"],["1","(0, 1)","B","match (down (1,0) = S fails)"],["2","(0, 2)","C","match"],["3","(1, 2)","C","match (down from (0, 2))"],["4","(2, 2)","E","match"],["5","(2, 1)","D","match, i = 5 = last → true"]],"result":"true"}},"heaps/topk":{"intuition":"To keep the k largest items, you only need to know the smallest of them, because that is the one a newcomer must beat. So keep a min-heap of size k. A new item either beats the heap's smallest (it goes in and the smallest goes out) or it is ignored.\n\nExample: the 2 largest of `[3, 2, 1, 5, 6, 4]`. The heap goes {3}, then {2,3}. Add 1, size 3, remove 1: {2,3}. Add 5, remove 2: {3,5}. Add 6, remove 3: {5,6}. Add 4, remove 4: {5,6}. The heap's top, 5, is the 2nd largest.\n\nThis is faster than sorting everything and also works on a stream. \"Top k frequent\" and \"k closest\" are the same once you decide the key (the count, the distance).","approach":["Choose the key: the value, the frequency (count with a HashMap first) or the distance.","Use a heap ordered the opposite way: a min-heap to keep the k largest, a max-heap to keep the k smallest.","Push each item. If the size goes above k, pop (this removes the worst item you were keeping).","At the end, the top is the k-th best and the heap holds the top k.","For ties, add a second key to the comparator (e.g. alphabetical order for words)."],"time":"O(n log k)","space":"O(k) (plus O(n) for frequency maps)","identify":["You need the k-th largest/smallest or the k best items, and k is much smaller than n (or data arrives as a stream).","A full sort would work but does more than needed; only the boundary of the top k matters.","The ranking key must be computed (frequency, distance to origin, distance to x) before ranking.","The k-th value of a stream must be reported after every insertion → keep a size-k heap permanently."],"contrasts":[["Median of a stream","Needs the middle, not an end → two heaps."],["Merge k sorted lists","A heap of k list heads → K-way Merge."],["Top k frequent with small value range","Bucket sort by frequency is O(n) and also fine."]],"code":"class Solution {\n    public int findKthLargest(int[] a, int k) {\n        PriorityQueue<Integer> pq = new PriorityQueue<>();      // min-heap of the k largest\n        for (int v : a) {\n            pq.offer(v);\n            if (pq.size() > k) pq.poll();                        // drop the smallest\n        }\n        return pq.peek();\n    }\n\n    public int[] topKFrequent(int[] a, int k) {\n        Map<Integer, Integer> freq = new HashMap<>();\n        for (int v : a) freq.merge(v, 1, Integer::sum);\n        PriorityQueue<Integer> pq = new PriorityQueue<>((x, y) -> freq.get(x) - freq.get(y));\n        for (int v : freq.keySet()) { pq.offer(v); if (pq.size() > k) pq.poll(); }\n        int[] res = new int[k];\n        for (int i = k - 1; i >= 0; i--) res[i] = pq.poll();     // most frequent first\n        return res;\n    }\n\n    public int[][] kClosest(int[][] pts, int k) {\n        PriorityQueue<int[]> pq = new PriorityQueue<>((p, q) -> (q[0] * q[0] + q[1] * q[1]) - (p[0] * p[0] + p[1] * p[1])); // max-heap by distance\n        for (int[] p : pts) { pq.offer(p); if (pq.size() > k) pq.poll(); }\n        return pq.toArray(new int[0][]);\n    }\n}","example":{"problem":"Kth Largest Element","input":"a = [3, 2, 1, 5, 6, 4], k = 2","cols":["v","heap after push","size > 2 → pop","heap"],"rows":[["3","[3]","—","[3]"],["2","[2, 3]","—","[2, 3]"],["1","[1, 2, 3]","pop 1","[2, 3]"],["5","[2, 3, 5]","pop 2","[3, 5]"],["6","[3, 5, 6]","pop 3","[5, 6]"],["4","[4, 5, 6]","pop 4","[5, 6]"]],"result":"heap top = 5"}},"heaps/kway":{"intuition":"When you have k sorted lists, the next smallest item overall must be one of the k front items. Keep just those fronts in a min-heap. Pop the smallest, then push the next item from the same list.\n\nExample: `[1,4,5]`, `[1,3,4]`, `[2,6]`. The heap starts with {1, 1, 2}. Pop 1 (list A) and push 4. Pop 1 (list B) and push 3. Pop 2 (list C) and push 6. Pop 3 and push 4. Keep going. The output is 1, 1, 2, 3, 4, 4, 5, 6.\n\nThe lists do not even need to exist. For \"k smallest pair sums\", each `a[i] + b[0], a[i] + b[1], ...` acts like a sorted list.","approach":["Push the first item of each list as (value, which list, position in that list).","Pop the smallest and output it (or count it towards k).","Push the next item from the same list, if there is one.","Repeat until the heap is empty or you have k items.","For the smallest range covering all lists, also track the current max of the items in the heap. The range is [heap min, that max]."],"time":"O(N log k) for N total elements","space":"O(k)","identify":["The input is several individually sorted sequences and you need a global sorted order or the k-th element overall.","Each sequence can be advanced independently and only its current front can be the next answer.","Pairs/sums from sorted arrays (k smallest pair sums, k-th smallest in a sorted matrix) form implicit sorted rows.","You need a window that contains one element from each list (smallest range) → heap of fronts plus the running max."],"contrasts":[["Merge two sorted lists","Only two heads — a simple comparison, no heap."],["Top k of one unsorted array","Size-k heap over all elements (Top-K)."],["K-th smallest in a sorted matrix","Heap works, binary search on value is the other option."]],"code":"class Solution {\n    public ListNode mergeKLists(ListNode[] lists) {\n        PriorityQueue<ListNode> pq = new PriorityQueue<>((a, b) -> Integer.compare(a.val, b.val));\n        for (ListNode l : lists) if (l != null) pq.offer(l);\n        ListNode dummy = new ListNode(0), tail = dummy;\n        while (!pq.isEmpty()) {\n            ListNode n = pq.poll();            // smallest head\n            tail.next = n; tail = n;\n            if (n.next != null) pq.offer(n.next);\n        }\n        return dummy.next;\n    }\n\n    // k pairs with the smallest sums from two sorted arrays\n    public List<List<Integer>> kSmallestPairs(int[] a, int[] b, int k) {\n        List<List<Integer>> res = new ArrayList<>();\n        PriorityQueue<int[]> pq = new PriorityQueue<>((x, y) -> Integer.compare(a[x[0]] + b[x[1]], a[y[0]] + b[y[1]]));\n        for (int i = 0; i < Math.min(a.length, k); i++) pq.offer(new int[]{i, 0});   // row i starts at b[0]\n        while (!pq.isEmpty() && res.size() < k) {\n            int[] p = pq.poll();\n            res.add(Arrays.asList(a[p[0]], b[p[1]]));\n            if (p[1] + 1 < b.length) pq.offer(new int[]{p[0], p[1] + 1});\n        }\n        return res;\n    }\n}","example":{"problem":"Merge k Sorted Lists","input":"[1 → 4 → 5, 1 → 3 → 4, 2 → 6]","cols":["heap (values)","pop","push successor","output so far"],"rows":[["1, 1, 2","1 (list A)","4","1"],["1, 2, 4","1 (list B)","3","1 1"],["2, 3, 4","2 (list C)","6","1 1 2"],["3, 4, 6","3","4","1 1 2 3"],["4, 4, 6","4 (A)","5","… 4"],["4, 5, 6","4 (B)","—","… 4 4"],["5, 6","5","—","… 5"],["6","6","—","1 1 2 3 4 4 5 6"]],"result":"[1, 1, 2, 3, 4, 4, 5, 6]"}},"heaps/two":{"intuition":"To read the middle (median) of numbers that keep arriving, split them into a smaller half and a bigger half. A max-heap holds the smaller half, so its top is the biggest small number. A min-heap holds the bigger half, so its top is the smallest big number. Keep the sizes equal, or the small half one bigger. Then the median is the top of the small half, or the average of the two tops.\n\nExample: the numbers 5, 15, 1, 3 arrive. After 5: small {5}, median 5. After 15: small {5}, big {15}, median 10. After 1: small {1,5}, big {15}, median 5. After 3: small {1,3}, big {5,15}, median (3+5)/2 = 4. Check: sorted [1,3,5,15] has median 4.","approach":["Add x: push it into the small half (max-heap), then move the small half's top into the big half (min-heap). This keeps every small number <= every big number.","Balance: if the big half has more items, move its top back to the small half.","Median: if the sizes differ, take the small half's top. Otherwise take (small top + big top) / 2.0.","Sliding window median: also remove the number leaving the window from the half that holds it, then balance again.","Use long or double when averaging, to avoid int overflow."],"time":"O(log n) per insert, O(1) per median","space":"O(n)","identify":["You must report the median (or another middle statistic) repeatedly while elements are added (or a window moves).","The data splits naturally into 'smaller half' and 'larger half', and only the boundary elements are ever queried.","Choosing projects/tasks where one heap holds the candidates you can afford and another holds the locked ones (IPO); two heaps with different keys.","Sorting after each insertion would be O(n log n) per query; too slow."],"contrasts":[["K-th largest in a stream","Fixed rank from one end → a single size-k heap."],["Median of two sorted arrays","Static data → binary search on the partition, O(log n)."],["Sliding window maximum","Max only → monotonic deque."]],"code":"class MedianFinder {\n    private final PriorityQueue<Integer> low = new PriorityQueue<>(Collections.reverseOrder()); // max-heap\n    private final PriorityQueue<Integer> high = new PriorityQueue<>();                           // min-heap\n\n    public void addNum(int x) {\n        low.offer(x);\n        high.offer(low.poll());                  // largest of low moves up: keeps low <= high\n        if (high.size() > low.size()) low.offer(high.poll());   // low may have one extra\n    }\n\n    public double findMedian() {\n        if (low.size() > high.size()) return low.peek();\n        return ((long) low.peek() + high.peek()) / 2.0;\n    }\n}","example":{"problem":"Find Median from Data Stream","input":"addNum 5, 15, 1, 3 (median after each)","cols":["add","low (max-heap)","high (min-heap)","median"],"rows":[["5","[5]","[]","5"],["15","[5]","[15]","(5 + 15) / 2 = 10.0"],["1","[5, 1]","[15]","5"],["3","[3, 1]","[5, 15]","(3 + 5) / 2 = 4.0"]],"result":"5, 10.0, 5, 4.0"}},"heaps/sched":{"intuition":"Many simulations keep asking \"which item is best right now?\" while things change: the task with the most copies left, the free server with the smallest id, the cheapest stones to join. A heap answers that quickly each time. Always take the current best, and the heap keeps it fast.\n\nExample (Task Scheduler): tasks A A A B B B, with a gap of n = 2 between two runs of the same task. Each round, take the tasks with the most copies left from the heap: A, then B, then nothing is allowed, so idle. Repeat: A B idle, then A B. The order is A B idle A B idle A B, which is 8 time units.\n\nOften there are two heaps: items ready now, and busy items sorted by the time they become free.","approach":["Find the repeated choice and what makes an item best (most copies left, earliest free time, lowest cost, smallest id).","Put the candidates in a heap by that key. If items become free later, keep a second heap sorted by the time they become free.","At each step, move everything that is free now into the ready heap.","Take the best item and apply it. If it is still needed (copies left), push it back with its new count or time.","If nothing is ready, jump the clock to the next free time instead of moving one tick at a time."],"time":"O(n log n)","space":"O(n)","identify":["The process runs in steps and each step greedily picks the current extreme (largest count, earliest end, smallest id), after which that item's key changes.","Items move between 'busy' and 'free' as time passes → one heap per state.","You can postpone a decision and fix it later at the cheapest point (use ladders on the largest climbs, refuel from the largest station passed).","Rearranging so equal items are not adjacent → always place the most frequent remaining item that is not the previous one."],"contrasts":[["Meeting rooms II (count rooms)","Just the max concurrency — one heap of end times."],["Task scheduler count only","Can be solved by a formula on the max frequency; the heap simulation also works."],["Pure greedy with a fixed order","If the order never changes after sorting once, no heap is needed (Greedy)."]],"code":"class Solution {\n    // Meeting Rooms III: room that hosted the most meetings (lowest id on ties)\n    public int mostBooked(int n, int[][] meetings) {\n
