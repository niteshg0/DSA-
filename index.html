","Write each update from yesterday: `hold = max(hold, cash - price)` and `cash = max(cash, hold + price)`. With a cooldown, buying uses the \"resting\" value.","Start impossible states at minus infinity (you cannot hold before you buy).","Go through the prices once, using yesterday's values. Copy them before overwriting.","At most k trades: keep `buy[j]` and `sell[j]` for j = 1..k, and update all of them for each price."],"time":"O(n) (O(n · k) with k transactions)","space":"O(1) (O(k))","identify":["Prices over days with buy/sell actions and a rule that couples days (cooldown, fee, limited transactions, must sell before buying again).","The best action today depends only on whether you currently hold a share (and how many transactions remain), not on the full history.","A greedy 'sum all rises' works for unlimited transactions without constraints; any extra rule pushes you to the state machine.","The same state-machine idea fits other 'mode' problems (e.g. delete-one-element maximum subarray)."],"contrasts":[["Single transaction","Track the minimum price so far — no state machine needed."],["Unlimited transactions, no fee","Sum every positive day-to-day difference (greedy)."],["Maximum subarray","Kadane — prices are not involved."]],"code":"class Solution {\n    // unlimited transactions with a one-day cooldown after selling\n    public int maxProfitCooldown(int[] prices) {\n        int hold = Integer.MIN_VALUE / 2, sold = Integer.MIN_VALUE / 2, rest = 0;\n        for (int p : prices) {\n            int prevHold = hold, prevSold = sold;\n            hold = Math.max(hold, rest - p);        // keep holding or buy (only from rest)\n            sold = prevHold + p;                    // sell today\n            rest = Math.max(rest, prevSold);        // idle (cooldown ends)\n        }\n        return Math.max(sold, rest);\n    }\n\n    public int maxProfitFee(int[] prices, int fee) {\n        int hold = -prices[0], cash = 0;\n        for (int p : prices) {\n            int prevHold = hold;\n            hold = Math.max(hold, cash - p);\n            cash = Math.max(cash, prevHold + p - fee);\n        }\n        return cash;\n    }\n\n    // at most k transactions\n    public int maxProfitK(int k, int[] prices) {\n        int[] buy = new int[k + 1], sell = new int[k + 1];\n        Arrays.fill(buy, Integer.MIN_VALUE / 2);\n        for (int p : prices)\n            for (int j = 1; j <= k; j++) {\n                buy[j] = Math.max(buy[j], sell[j - 1] - p);   // j-th buy uses profit of j-1 sales\n                sell[j] = Math.max(sell[j], buy[j] + p);\n            }\n        return sell[k];\n    }\n}","example":{"problem":"Best Time with Cooldown","input":"prices = [1, 2, 3, 0, 2]","cols":["price","hold","sold","rest"],"rows":[["1","−1 (buy)","−∞","0"],["2","−1","1","0"],["3","−1","2","1"],["0","1 (buy from rest 1)","−1","2"],["2","1","3","2"]],"result":"max(sold, rest) = 3 (buy 1, sell 2, cooldown, buy 0, sell 2)"}},"dp/lis":{"intuition":"Longest Increasing Subsequence (LIS): `dp[i]` = the longest increasing chain that ends at i = 1 + the best `dp[j]` before it with a smaller value. That checks every pair.\n\nA faster way keeps `tails[len]` = the smallest possible last number of an increasing chain of that length. A smaller tail is always better, because more numbers can follow it. For each new number, replace the first tail that is >= it (found by binary search), or add it to the end.\n\nExample: `[10, 9, 2, 5, 3, 7, 101, 18]`. tails goes [10], then [9], [2], [2,5], [2,3], [2,3,7], [2,3,7,101], [2,3,7,18]. The length is 4. Many problems become LIS after sorting: Russian Doll Envelopes, chains of pairs, divisible subsets.","approach":["Slow way: for each i, check every j < i. If `a[j] < a[i]`, set `dp[i] = max(dp[i], dp[j] + 1)`.","Fast way: for each x, find the first tail >= x (lower bound). Replace it, or add x at the end if there is none.","The length of tails is the answer (tails itself may not be a real subsequence).","Envelopes: sort by width going up, and by height going down when widths are equal. Then run LIS on the heights.","To count or rebuild the LIS, keep `count[i]` or `parent[i]` next to `dp[i]` in the slow version."],"time":"O(n log n) with tails; O(n²) basic","space":"O(n)","identify":["You must pick a subsequence (order kept, elements may be skipped) that is increasing / chained under some comparison, and maximise its length.","Items can be nested or chained (envelopes, boxes, pairs, divisible numbers); sort by one dimension and run LIS on the other.","Minimum deletions to make an array sorted = n − LIS.","The chain condition only compares the new element with the previous chosen one."],"contrasts":[["Longest increasing contiguous subarray","Contiguous → a single linear scan."],["Longest common subsequence of two strings","Two sequences → string DP table."],["Longest consecutive sequence (values +1)","Hash set, O(n), no ordering of positions."]],"code":"class Solution {\n    public int lengthOfLIS(int[] a) {\n        int[] tails = new int[a.length];\n        int len = 0;\n        for (int x : a) {\n            int lo = 0, hi = len;\n            while (lo < hi) {                       // first tail >= x\n                int mid = (lo + hi) / 2;\n                if (tails[mid] >= x) hi = mid; else lo = mid + 1;\n            }\n            tails[lo] = x;                          // smaller tail for length lo + 1\n            if (lo == len) len++;\n        }\n        return len;\n    }\n\n    public int maxEnvelopes(int[][] env) {\n        Arrays.sort(env, (p, q) -> p[0] != q[0] ? p[0] - q[0] : q[1] - p[1]);  // equal widths: taller first\n        int[] h = new int[env.length];\n        for (int i = 0; i < env.length; i++) h[i] = env[i][1];\n        return lengthOfLIS(h);\n    }\n\n    // O(n^2) version that also counts how many LIS exist\n    public int findNumberOfLIS(int[] a) {\n        int n = a.length, best = 0, total = 0;\n        int[] len = new int[n], cnt = new int[n];\n        for (int i = 0; i < n; i++) {\n            len[i] = 1; cnt[i] = 1;\n            for (int j = 0; j < i; j++) if (a[j] < a[i]) {\n                if (len[j] + 1 > len[i]) { len[i] = len[j] + 1; cnt[i] = cnt[j]; }\n                else if (len[j] + 1 == len[i]) cnt[i] += cnt[j];\n            }\n            if (len[i] > best) { best = len[i]; total = cnt[i]; } else if (len[i] == best) total += cnt[i];\n        }\n        return total;\n    }\n}","example":{"problem":"Longest Increasing Subsequence (tails)","input":"a = [10, 9, 2, 5, 3, 7, 101, 18]","cols":["x","first tail ≥ x","tails after"],"rows":[["10","none → append","[10]"],["9","10 → replace","[9]"],["2","9 → replace","[2]"],["5","none → append","[2, 5]"],["3","5 → replace","[2, 3]"],["7","none → append","[2, 3, 7]"],["101","none → append","[2, 3, 7, 101]"],["18","101 → replace","[2, 3, 7, 18]"]],"result":"4"}},"dp/mcm":{"intuition":"Interval DP solves a problem on a range [i, j] by choosing where to split it (or which action happens last inside it), then combining the best answers of the two smaller ranges. Small ranges are solved first.\n\nExample (Matrix Chain): three matrices A (10x30), B (30x5) and C (5x60). Splitting as (AB)C costs 10*30*5 + 10*5*60 = 1500 + 3000 = 4500. Splitting as A(BC) costs 30*5*60 + 10*30*60 = 9000 + 18000 = 27000. The DP tries every split and keeps 4500.\n\nBurst Balloons chooses which balloon bursts last, so its neighbours are the fixed ends of the range. Stone and coin games store how much more the current player can score than the other player on that range.","approach":["State: `dp[i][j]` = the best answer for the range i..j.","Choose the split: which pair is multiplied last, which balloon bursts last, or which end the player takes.","Write the cost of joining the two parts (it depends only on i, k and j).","Fill by range length from small to big, then by i, with `j = i + len - 1`. Then loop over k.","Games: `dp[i][j] = max(a[i] - dp[i+1][j], a[j] - dp[i][j-1])` (how far ahead the player to move can get)."],"time":"O(n³) (O(n²) for two-choice games)","space":"O(n²)","identify":["The input is a sequence and the operation merges/removes elements so that the cost depends on what is adjacent at that moment (multiplying matrices, bursting balloons, merging stones, cutting a stick).","Fixing the LAST (or first) operation inside a range splits it into independent left and right ranges.","Two players alternately take from either end of a row and play optimally → interval DP on score difference.","Greedy by smallest/largest cost fails because the order changes later costs."],"contrasts":[["Partition a string into palindromes (min cuts)","1D DP over prefixes with a palindrome table — split points but not a 2D interval DP."],["Knapsack-style selection","Order does not matter → knapsack."],["Merge stones with any pair (not adjacent)","Huffman-style greedy with a heap."]],"code":"class Solution {\n    // dims has n+1 numbers for n matrices; minimum scalar multiplications\n    public int matrixChain(int[] dims) {\n        int n = dims.length - 1;\n        int[][] dp = new int[n][n];\n        for (int len = 2; len <= n; len++)\n            for (int i = 0; i + len - 1 < n; i++) {\n                int j = i + len - 1;\n                dp[i][j] = Integer.MAX_VALUE;\n                for (int k = i; k < j; k++)              // split: (i..k)(k+1..j)\n                    dp[i][j] = Math.min(dp[i][j], dp[i][k] + dp[k + 1][j] + dims[i] * dims[k + 1] * dims[j + 1]);\n            }\n        return dp[0][n - 1];\n    }\n\n    public int maxCoins(int[] nums) {                // burst balloons\n        int n = nums.length;\n        int[] a = new int[n + 2];\n        a[0] = a[n + 1] = 1;\n        for (int i = 0; i < n; i++) a[i + 1] = nums[i];\n        int[][] dp = new int[n + 2][n + 2];              // dp[l][r]: open interval (l, r)\n        for (int len = 2; len <= n + 1; len++)\n            for (int l = 0; l + len <= n + 1; l++) {\n                int r = l + len;\n                for (int k = l + 1; k < r; k++)          // k is burst LAST inside (l, r)\n                    dp[l][r] = Math.max(dp[l][r], dp[l][k] + dp[k][r] + a[l] * a[k] * a[r]);\n            }\n        return dp[0][n + 1];\n    }\n\n    public boolean predictTheWinner(int[] a) {       // player 1 >= player 2 ?\n        int n = a.length;\n        int[][] d = new int[n][n];                       // best score difference for the mover\n        for (int i = 0; i < n; i++) d[i][i] = a[i];\n        for (int len = 2; len <= n; len++)\n            for (int i = 0; i + len - 1 < n; i++) {\n                int j = i + len - 1;\n                d[i][j] = Math.max(a[i] - d[i + 1][j], a[j] - d[i][j - 1]);\n            }\n        return d[0][n - 1] >= 0;\n    }\n}","example":{"problem":"Matrix Chain Multiplication","input":"dims = [10, 20, 30, 40] → A (10×20), B (20×30), C (30×40)","cols":["range","split","cost","dp"],"rows":[["A·B","k = A","10·20·30 = 6000","6000"],["B·C","k = B","20·30·40 = 24000","24000"],["A·B·C","(A)(BC)","0 + 24000 + 10·20·40 = 32000","—"],["A·B·C","(AB)(C)","6000 + 0 + 10·30·40 = 18000","18000 (min)"]],"result":"18000"}},"segtree/all":{"intuition":"Prefix sums answer range sums instantly, but one update means rebuilding them, which is slow. A Fenwick tree or a segment tree stores sums of blocks of different sizes, so both an update and a range sum touch only about log n blocks.\n\nExample (Fenwick, 1-indexed): with 8 numbers, the sum of the first 7 = block[7] (just 7) + block[6] (5..6) + block[4] (1..4). That is 3 blocks instead of 7 numbers. Changing number 3 updates only the blocks that contain it: 3, 4 and 8.\n\nSo for `[1, 3, 5]`, sum(0..2) = 9. After changing index 1 to 2, only a few blocks change, and the sum is 8. A segment tree works the same way but can store any combine (min, max, gcd), and lazy updates handle whole-range changes.","approach":["Fenwick update(i, delta): while i <= n: `tree[i] += delta; i += i & -i`.","Fenwick prefix(i): while i > 0: `s += tree[i]; i -= i & -i`. Range sum = prefix(r) - prefix(l - 1).","Segment tree: each node covers [lo, hi]. Build it from its two children. A query returns a neutral value (0 for sum) outside the range and combines partial overlaps.","Point update: go down to the leaf, change it, then recompute the parents on the way back up.","Counting questions (Count of Smaller Numbers After Self, inversions): replace values by their rank, then scan while using a Fenwick tree of counts."],"time":"O(log n) per update and query; O(n) build","space":"O(n) Fenwick; O(4n) segment tree","identify":["Range queries (sum/min/max) are mixed with updates, so neither recomputing nor static prefix sums are fast enough.","For each element you need the count of earlier/later elements that are smaller or larger (order statistics while scanning).","The combine operation is associative (sum, min, max, gcd, xor); the requirement for segment trees.","Constraints are large (n and q up to 10^5) with both reads and writes."],"contrasts":[["Range sum with no updates","Static prefix sums."],["Sliding window max","Monotonic deque — the window only moves forward."],["Count inversions once","Merge-sort counting also works in O(n log n)."]],"code":"class NumArray {                                   // Fenwick tree: point update, range sum\n    private final int[] tree, a;\n    private final int n;\n    public NumArray(int[] nums) {\n        n = nums.length; a = new int[n]; tree = new int[n + 1];\n        for (int i = 0; i < n; i++) update(i, nums[i]);\n    }\n    public void update(int i, int val) {\n        int delta = val - a[i];\n        a[i] = val;\n        for (int j = i + 1; j <= n; j += j & -j) tree[j] += delta;   // climb to covering blocks\n    }\n    private int prefix(int i) {                    // sum of first i elements\n        int s = 0;\n        for (; i > 0; i -= i & -i) s += tree[i];\n        return s;\n    }\n    public int sumRange(int l, int r) { return prefix(r + 1) - prefix(l); }\n}\n\nclass MinSegTree {                                 // segment tree: point update, range minimum\n    private final int[] t;\n    private final int n;\n    public MinSegTree(int[] a) { n = a.length; t = new int[4 * n]; build(a, 1, 0, n - 1); }\n    private void build(int[] a, int node, int lo, int hi) {\n        if (lo == hi) { t[node] = a[lo]; return; }\n        int mid = (lo + hi) / 2;\n        build(a, 2 * node, lo, mid); build(a, 2 * node + 1, mid + 1, hi);\n        t[node] = Math.min(t[2 * node], t[2 * node + 1]);\n    }\n    public void set(int i, int v) { set(1, 0, n - 1, i, v); }\n    private void set(int node, int lo, int hi, int i, int v) {\n        if (lo == hi) { t[node] = v; return; }\n        int mid = (lo + hi) / 2;\n        if (i <= mid) set(2 * node, lo, mid, i, v); else set(2 * node + 1, mid + 1, hi, i, v);\n        t[node] = Math.min(t[2 * node], t[2 * node + 1]);\n    }\n    public int min(int l, int r) { return min(1, 0, n - 1, l, r); }\n    private int min(int node, int lo, int hi, int l, int r) {\n        if (r < lo || hi < l) return Integer.MAX_VALUE;             // no overlap\n        if (l <= lo && hi <= r) return t[node];                     // full overlap\n        int mid = (lo + hi) / 2;\n        return Math.min(min(2 * node, lo, mid, l, r), min(2 * node + 1, mid + 1, hi, l, r));\n    }\n}","example":{"problem":"Range Sum Query – Mutable (Fenwick)","input":"nums = [1, 3, 5]; sumRange(0, 2); update(1, 2); sumRange(0, 2)","cols":["operation","Fenwick tree[1..3]","result"],"rows":[["build","[1, 4, 5] (tree[2] covers 1 + 3)","—"],["sumRange(0, 2)","prefix(3) = tree[3] + tree[2] = 5 + 4","9"],["update(1, 2)","delta −1 at i = 2 → tree[2] = 3 (tree[4] out of range)","—"],["sumRange(0, 2)","tree[3] + tree[2] = 5 + 3","8"]],"result":"9, then 8"}},"dp/unb":{"intuition":"Same as 0/1 knapsack, but now every item can be used as many times as you like (coins, rod pieces). So when you fill `dp[t]`, you are allowed to build on a smaller total that already used the same item.\n\nExample (Rod Cutting): a rod of length 4, prices for lengths 1..4 are `[1, 5, 8, 9]`. Using only length-1 pieces: dp = [0, 1, 2, 3, 4]. Allow length 2 (price 5): dp[2] = 5, dp[4] = dp[2] + 5 = 10. Lengths 3 and 4 do not beat that (8 + 1 = 9, 9). Best is 10: cut into 2 + 2.\n\nThe only code change from 0/1 knapsack: loop t UPWARD. Then dp[4] can read dp[2], which already contains a length-2 piece, so the piece is reused on purpose.","approach":["Name the items (coins, piece lengths), the target (amount, rod length) and what `dp[t]` stores: fewest items, number of ways, or best value.","Start: dp[0] = 0 (fewest / best) or 1 (ways). Other cells: infinity for 'fewest', 0 otherwise.","For each item, loop t from the item's size UP to the target: dp[t] = best(dp[t], dp[t - size] + item). In the example, dp[4] = dp[2] + 5 = 10.","Counting combinations (Coin Change II): coins in the outer loop, so 1+2 and 2+1 are counted once. If 1+2 and 2+1 must be counted as different (order matters), put the amount in the outer loop instead.","Answer is dp[target]. For 'fewest coins', if it is still infinity, return -1."],"time":"O(n · target)","space":"O(target)","identify":["Items come in unlimited supply: 'infinite coins', 'any number of pieces', 'you may reuse'.","You build up a total (amount, length, capacity) from pieces and want the fewest pieces, the best value, or the number of ways.","Greedy (take the biggest coin first) fails on small cases like coins [1, 3, 4] for amount 6.","The target is a moderate number, so a 1D table indexed by it fits."],"contrasts":[["Each item usable once","0/1 Knapsack -> loop t downward."],["Climbing stairs with steps 1 or 2","Order matters and only 2 fixed steps -> 1D DP."],["List all coin combinations","Listing -> backtracking (Combination Sum)."]],"code":"class Solution {\n    // fewest coins to make amount (-1 if impossible)\n    public int coinChange(int[] coins, int amount) {\n        int[] dp = new int[amount + 1];\n        Arrays.fill(dp, amount + 1);             // \"infinity\"\n        dp[0] = 0;\n        for (int c : coins)\n            for (int t = c; t <= amount; t++)    // upward -> coin reusable\n                dp[t] = Math.min(dp[t], dp[t - c] + 1);\n        return dp[amount] > amount ? -1 : dp[amount];\n    }\n\n    // number of combinations (order does not matter)\n    public int change(int amount, int[] coins) {\n        int[] dp = new int[amount + 1];\n        dp[0] = 1;\n        for (int c : coins) for (int t = c; t <= amount; t++) dp[t] += dp[t - c];\n        return dp[amount];\n    }\n\n    // rod cutting: price[i] = price of a piece of length i + 1\n    public int cutRod(int[] price, int n) {\n        int[] dp = new int[n + 1];\n        for (int len = 1; len <= price.length; len++)\n            for (int t = len; t <= n; t++)\n                dp[t] = Math.max(dp[t], dp[t - len] + price[len - 1]);\n        return dp[n];\n    }\n\n    // unbounded knapsack: best value with weight <= W, items reusable\n    public int unboundedKnapsack(int W, int[] wt, int[] val) {\n        int[] dp = new int[W + 1];\n        for (int i = 0; i < wt.length; i++)\n            for (int t = wt[i]; t <= W; t++) dp[t] = Math.max(dp[t], dp[t - wt[i]] + val[i]);\n        return dp[W];\n    }\n}","example":{"problem":"Rod Cutting","input":"price = [1, 5, 8, 9], n = 4","cols":["allowed pieces","dp[0..4] (best price)"],"rows":[["start","[0, 0, 0, 0, 0]"],["piece length 1 (price 1)","[0, 1, 2, 3, 4]"],["piece length 2 (price 5)","[0, 1, 5, 6, 10]"],["piece length 3 (price 8)","[0, 1, 5, 8, 10]"],["piece length 4 (price 9)","[0, 1, 5, 8, 10]"]],"result":"dp[4] = 10 (cut into 2 + 2)"}},"dp/edit":{"intuition":"Here you must turn one string into another, or check if a pattern matches a text. Again `dp[i][j]` is about the first i letters of one and the first j letters of the other, and you decide using only the last letters. The difference from LCS: each choice has a meaning (insert, delete, replace, or a pattern symbol like `*`).\n\nExample (Edit Distance): \"horse\" -> \"ros\". If the last letters are equal, nothing to pay: dp[i][j] = dp[i-1][j-1]. If not, pay 1 and pick the cheapest of: replace (dp[i-1][j-1]), delete from word1 (dp[i-1][j]), insert into word1 (dp[i][j-1]). The first row and column are 0, 1, 2, 3...: turning a prefix into the empty string costs its length. The table ends with dp[5][3] = 3 (horse -> rorse -> rose -> ros).\n\nWildcard: `?` matches one letter (like a match). `*` matches nothing (dp[i][j-1]) or one more letter (dp[i-1][j]). Regex `x*` means zero copies (dp[i][j-2]) or one more x if the letter fits (dp[i-1][j]).","approach":["Define `dp[i][j]` for the first i letters of the text/word1 and the first j letters of the pattern/word2.","Fill the base row and column: edit distance -> dp[i][0] = i, dp[0][j] = j; matching -> dp[0][0] = true, and dp[0][j] = true only while the pattern is all `*`.","If the last letters match (or the pattern has `?`): dp[i][j] = dp[i-1][j-1].","Otherwise use the rule of the problem: edit distance -> 1 + min(replace, delete, insert); wildcard `*` -> dp[i][j-1] OR dp[i-1][j]; distinct subsequences -> skip the text letter (dp[i-1][j]) and add the match case.","In the example, 'e' vs 's' at (5, 3): 1 + min(dp[4][2], dp[4][3], dp[5][2]) = 1 + min(3, 2, 3) = 3."],"time":"O(n · m)","space":"O(n · m), or O(m) with two rows","identify":["Turn string A into string B with the fewest operations (insert, delete, replace).","Does a pattern with special symbols (`?`, `*`, `.`) match the whole text?","Count how many ways one string appears inside another as a subsequence (Distinct Subsequences), or can two strings be woven into a third (Interleaving).","The last letters decide which smaller pair of prefixes to look at."],"contrasts":[["Longest common subsequence","Only keep or skip letters, no costs -> LCS family."],["Find a word inside a text","Exact substring search -> KMP / Z (Strings)."],["One edit away?","Only one difference allowed -> a single two-pointer pass."]],"code":"class Solution {\n    public int minDistance(String a, String b) {\n        int n = a.length(), m = b.length();\n        int[][] dp = new int[n + 1][m + 1];\n        for (int i = 0; i <= n; i++) dp[i][0] = i;     // delete everything\n        for (int j = 0; j <= m; j++) dp[0][j] = j;     // insert everything\n        for (int i = 1; i <= n; i++)\n            for (int j = 1; j <= m; j++)\n                dp[i][j] = a.charAt(i - 1) == b.charAt(j - 1) ? dp[i - 1][j - 1]\n                        : 1 + Math.min(dp[i - 1][j - 1], Math.min(dp[i - 1][j], dp[i][j - 1]));\n        return dp[n][m];\n    }\n\n    // wildcard: '?' = any one letter, '*' = any sequence (also empty)\n    public boolean isMatch(String s, String p) {\n        int n = s.length(), m = p.length();\n        boolean[][] dp = new boolean[n + 1][m + 1];\n        dp[0][0] = true;\n        for (int j = 1; j <= m && p.charAt(j - 1) == '*'; j++) dp[0][j] = true;\n        for (int i = 1; i <= n; i++)\n            for (int j = 1; j <= m; j++) {\n                char c = p.charAt(j - 1);\n                if (c == '*') dp[i][j] = dp[i][j - 1] || dp[i - 1][j];\n                else dp[i][j] = (c == '?' || c == s.charAt(i - 1)) && dp[i - 1][j - 1];\n            }\n        return dp[n][m];\n    }\n\n    // number of ways t appears in s as a subsequence\n    public int numDistinct(String s, String t) {\n        int[] dp = new int[t.length() + 1];\n        dp[0] = 1;\n        for (int i = 1; i <= s.length(); i++)\n            for (int j = t.length(); j >= 1; j--)\n                if (s.charAt(i - 1) == t.charAt(j - 1)) dp[j] += dp[j - 1];\n        return dp[t.length()];\n    }\n}","example":{"problem":"Edit Distance","input":"word1 = \"horse\", word2 = \"ros\"","cols":["row","j=0","j=1 (r)","j=2 (o)","j=3 (s)"],"rows":[["i=0 (\"\")","0","1","2","3"],["i=1 (h)","1","1","2","3"],["i=2 (o)","2","2","1","2"],["i=3 (r)","3","2","2","2"],["i=4 (s)","4","3","3","2"],["i=5 (e)","5","4","4","3"]],"result":"dp[5][3] = 3"}},"dp/square":{"intuition":"For squares of 1s, let `dp[r][c]` = the side of the biggest all-1 square whose bottom-right corner is (r, c). A square of side k ends at (r, c) only if squares of side k - 1 end at the cell above, the cell to the left and the cell up-left. So dp[r][c] = 1 + min(up, left, up-left) when the cell is 1, else 0.\n\nExample (Count Square Submatrices): matrix `[[0,1,1,1],[1,1,1,1],[0,1,1,1]]`. Row 1, column 2: up = 1, left = 1, up-left = 1, so dp = 2. Row 2, column 3: up = 2, left = 2, up-left = 2, so dp = 3. A cell with dp = 3 is the corner of 3 squares (sides 1, 2 and 3), so the count is the sum of all cells = 15. The biggest square (Maximal Square) is the largest cell: side 3, area 9.\n\nRectangles are different: the min trick does not work for them. For Maximal Rectangle, build a 'height of 1s' array for each row and run Largest Rectangle in Histogram (monotonic stack) on it.","approach":["Make `dp` the same size as the matrix. dp[r][c] = side of the largest all-1 square ending at (r, c).","If the cell is 0, dp = 0. If it is in the first row or column, dp = the cell value.","Otherwise dp[r][c] = 1 + min(dp[r-1][c], dp[r][c-1], dp[r-1][c-1]) (in the example, (2, 3) = 1 + min(2, 2, 2) = 3).","Maximal Square: answer = (largest dp)². Count Squares: answer = sum of all dp cells.","Maximal Rectangle: heights[c] = heights[c] + 1 if the cell is 1 else 0, row by row; run the histogram stack on heights each row and keep the best area."],"time":"O(R · C)","space":"O(R · C), or O(C) with one row","identify":["A 0/1 matrix and the question is about the biggest or the number of all-1 squares.","The thing you measure (a square) ending at a cell can be built from the same thing ending at its top, left and top-left neighbours.","If the shape is a rectangle, think 'histogram per row' instead.","No path or movement is involved; each cell is just a corner."],"contrasts":[["Number of islands","Connected 1s of any shape -> graph DFS/BFS."],["Minimum path sum","A walker moving right/down -> grid path DP."],["Largest rectangle in histogram","1D bars -> monotonic stack (the building block for Maximal Rectangle)."]],"code":"class Solution {\n    public int maximalSquare(char[][] g) {\n        int R = g.length, C = g[0].length, best = 0;\n        int[][] dp = new int[R + 1][C + 1];           // padded: no edge checks\n        for (int r = 1; r <= R; r++)\n            for (int c = 1; c <= C; c++)\n                if (g[r - 1][c - 1] == '1') {\n                    dp[r][c] = 1 + Math.min(dp[r - 1][c - 1], Math.min(dp[r - 1][c], dp[r][c - 1]));\n                    best = Math.max(best, dp[r][c]);\n                }\n        return best * best;\n    }\n\n    public int countSquares(int[][] m) {\n        int count = 0;\n        for (int r = 0; r < m.length; r++)\n            for (int c = 0; c < m[0].length; c++) {\n                if (m[r][c] == 1 && r > 0 && c > 0)\n                    m[r][c] = 1 + Math.min(m[r - 1][c - 1], Math.min(m[r - 1][c], m[r][c - 1]));\n                count += m[r][c];                     // squares with this corner\n            }\n        return count;\n    }\n\n    // rectangle: heights per row + histogram with a monotonic stack\n    public int maximalRectangle(char[][] g) {\n        int C = g[0].length, best = 0;\n        int[] h = new int[C];\n        for (char[] row : g) {\n            for (int c = 0; c < C; c++) h[c] = row[c] == '1' ? h[c] + 1 : 0;\n            Deque<Integer> st = new ArrayDeque<>();\n            for (int i = 0; i <= C; i++) {\n                int cur = i == C ? 0 : h[i];\n                while (!st.isEmpty() && h[st.peek()] >= cur) {\n                    int height = h[st.pop()];\n                    int left = st.isEmpty() ? -1 : st.peek();\n                    best = Math.max(best, height * (i - left - 1));\n                }\n                st.push(i);\n            }\n        }\n        return best;\n    }\n}","example":{"problem":"Count Square Submatrices with All Ones","input":"matrix = [[0,1,1,1],[1,1,1,1],[0,1,1,1]]","cols":["row","cells","dp (square side ending here)","row sum"],"rows":[["row 0","[0, 1, 1, 1]","[0, 1, 1, 1]","3"],["row 1","[1, 1, 1, 1]","[1, 1, 2, 2]","6"],["row 2","[0, 1, 1, 1]","[0, 1, 2, 3]","6"]],"result":"total = 15 squares; largest side = 3"}},"dp/part":{"intuition":"You cut an array or a string, from left to right, into pieces. Every piece must follow a rule (be a dictionary word, be a palindrome, have length at most k), and you want to know if it is possible, the fewest cuts, or the best total. Let `dp[i]` = the answer for the first i elements. To get dp[i], try every possible LAST piece that ends at i: dp[i] = best over j of dp[j] + cost(piece j..i-1).\n\nExample (Partition Array for Maximum Sum): arr = `[1, 15, 7, 9, 2, 5, 10]`, k = 3. Each piece becomes its maximum × its length. dp[3] = [1, 15, 7] -> 15 × 3 = 45. dp[7] tries the last piece [10] (dp[6] + 10), [5, 10] (dp[5] + 20) and [2, 5, 10] (dp[4] + 30). The best total is 84.\n\nWord Break is the same with 'is the piece a word?' and true/false. Palindrome Partitioning II is the same with 'is the piece a palindrome?' and the fewest pieces (cuts = pieces - 1).","approach":["Let `dp[i]` = the answer for the first i elements; dp[0] = 0 (or true): an empty prefix needs no pieces.","For i = 1..n, try every start j of the last piece (j from i - 1 down to i - k, or down to 0 if there is no length limit).","If the piece j..i-1 is allowed, combine: dp[i] = best(dp[i], dp[j] + cost). In the example, dp[3] = dp[0] + 15 × 3 = 45.","For palindrome checks, precompute pal[j][i] (or expand around centres) so each check is O(1).","Answer is dp[n] (for Palindrome Partitioning II, dp[n] pieces means dp[n] - 1 cuts)."],"time":"O(n · k) or O(n²) (plus the cost of checking a piece)","space":"O(n)","identify":["The input is cut into consecutive pieces from left to right, and each piece is checked or scored on its own.","Words like 'split', 'segment', 'partition into substrings / subarrays' with the fewest pieces, the best score, or 'is it possible'.","The best answer for a prefix does not care how that prefix was cut, only where the last cut was.","You only need a number or yes/no, not the list of all ways (that would be backtracking)."],"contrasts":[["Palindrome Partitioning I (list all)","Return every split -> backtracking."],["Matrix Chain / Burst Balloons","The split point is inside a range (i, j) and both sides matter -> Interval DP."],["Split array largest sum","Exactly k pieces and minimise the max -> binary search on the answer."]],"code":"class Solution {\n    public boolean wordBreak(String s, List<String> words) {\n        Set<String> dict = new HashSet<>(words);\n        boolean[] dp = new boolean[s.length() + 1];\n        dp[0] = true;\n        for (int i = 1; i <= s.length(); i++)\n            for (int j = 0; j < i && !dp[i]; j++)\n                dp[i] = dp[j] && dict.contains(s.substring(j, i));   // last piece = s[j..i)\n        return dp[s.length()];\n    }\n\n    public int minCut(String s) {\n        int n = s.length();\n        boolean[][] pal = new boolean[n][n];\n        int[] dp = new int[n + 1];                     // dp[i] = fewest pieces for s[0..i)\n        for (int i = 1; i <= n; i++) {\n            dp[i] = Integer.MAX_VALUE;\n            for (int j = i - 1; j >= 0; j--) {\n                pal[j][i - 1] = s.charAt(j) == s.charAt(i - 1) && (i - 1 - j < 2 || pal[j + 1][i - 2]);\n                if (pal[j][i - 1]) dp[i] = Math.min(dp[i], dp[j] + 1);\n            }\n        }\n        return dp[n] - 1;                              // cuts = pieces - 1\n    }\n\n    public int maxSumAfterPartitioning(int[] arr, int k) {\n        int n = arr.length;\n        int[] dp = new int[n + 1];\n        for (int i = 1; i <= n; i++) {\n            int mx = 0;\n            for (int len = 1; len <= k && len <= i; len++) {\n                mx = Math.max(mx, arr[i - len]);\n                dp[i] = Math.max(dp[i], dp[i - len] + mx * len);\n            }\n        }\n        return dp[n];\n    }\n}","example":{"problem":"Partition Array for Maximum Sum","input":"arr = [1, 15, 7, 9, 2, 5, 10], k = 3","cols":["i","best last piece","dp[i]"],"rows":[["0","(empty)","0"],["1","[1] -> 1 × 1 + dp[0]","1"],["2","[1, 15] -> 15 × 2 + dp[0]","30"],["3","[1, 15, 7] -> 15 × 3 + dp[0]","45"],["4","[9] -> 9 × 1 + dp[3]","54"],["5","[9, 2] -> 9 × 2 + dp[3]","63"],["6","[9, 2, 5] -> 9 × 3 + dp[3]","72"],["7","[2, 5, 10] -> 10 × 3 + dp[4]","84"]],"result":"dp[7] = 84"}},"dp/tree":{"intuition":"In a tree, the answer for a node depends only on answers coming up from its children. So do a post-order DFS and let each call return a small set of numbers (a 'state') for its subtree, for example \"best if I take this node\" and \"best if I skip it\". The parent combines the children's states.\n\nExample (House Robber III): tree `[3, 2, 3, null, 3, null, 1]`. You cannot rob a node and its direct child. Each call returns (rob, skip). Leaf 3 -> (3, 0). Leaf 1 -> (1, 0). Node 2 -> rob = 2 + 0 = 2, skip = max(3, 0) = 3. Right node 3 -> rob = 3 + 0 = 3, skip = 1. Root 3 -> rob = 3 + 3 + 1 = 7 (skip both children), skip = max(2, 3) + max(3, 1) = 6. Answer = max(7, 6) = 7.\n\nThe same idea solves Binary Tree Cameras (states: has camera / covered / needs cover) and the path problems (return the best downward chain; update a global answer with left + right at each node).","approach":["Decide the states a node must report to its parent (take / skip, or camera / covered / not covered, or the longest downward chain).","Write a post-order DFS: get the states of the left and right child first. A null child returns a neutral state (0, 0, or 'covered').","Combine: rob = node.val + left.skip + right.skip; skip = max(left) + max(right). In the example the root gets rob = 3 + 3 + 1 = 7.","If a path can bend at a node (max path sum, diameter), update a global answer with left + node + right, but return only one side upward.","At the root, choose the best of its states (and for Cameras, add 1 if the root is still not covered)."],"time":"O(n)","space":"O(h) recursion (h = tree height)","identify":["The input is a tree and a choice at one node limits the choice at its parent or children (cannot pick both, must be covered by a neighbour).","The answer for a subtree can be built from the answers of its child subtrees.","'Path' that may start and end anywhere -> each node returns its best downward path and updates a global best through itself.","It is like House Robber or a chain DP, but on a tree instead of an array."],"contrasts":[["Level order / views","Only visiting order matters -> tree BFS/DFS traversal."],["Path sum from root to leaf","Carry a value down the path -> root-to-leaf DFS."],["LCA / distance k","Find nodes, not optimise a choice -> LCA pattern."]],"code":"class Solution {\n    // House Robber III: each call returns {rob this node, skip this node}\n    public int rob(TreeNode root) {\n        int[] r = dfs(root);\n        return Math.max(r[0], r[1]);\n    }\n    private int[] dfs(TreeNode n) {\n        if (n == null) return new int[]{0, 0};\n        int[] l = dfs(n.left), r = dfs(n.right);\n        int robIt = n.val + l[1] + r[1];                     // children must be skipped\n        int skipIt = Math.max(l[0], l[1]) + Math.max(r[0], r[1]);\n        return new int[]{robIt, skipIt};\n    }\n\n    // Binary Tree Cameras: 0 = needs cover, 1 = has camera, 2 = covered\n    private int cams;\n    public int minCameraCover(TreeNode root) {\n        cams = 0;\n        return (cover(root) == 0 ? 1 : 0) + cams;\n    }\n    private int cover(TreeNode n) {\n        if (n == null) return 2;\n        int l = cover(n.left), r = cover(n.right);\n        if (l == 0 || r == 0) { cams++; return 1; }          // a child needs me\n        return (l == 1 || r == 1) ? 2 : 0;\n    }\n\n    // Max path sum: return best downward gain, update the global answer\n    private int best;\n    public int maxPathSum(TreeNode root) {\n        best = Integer.MIN_VALUE;\n        gain(root);\n        return best;\n    }\n    private int gain(TreeNode n) {\n        if (n == null) return 0;\n        int l = Math.max(0, gain(n.left)), r = Math.max(0, gain(n.right));\n        best = Math.max(best, l + n.val + r);                // path bends here\n        return n.val + Math.max(l, r);                       // only one side goes up\n    }\n}","example":{"problem":"House Robber III","input":"root = [3, 2, 3, null, 3, null, 1]","cols":["node (post-order)","rob = val + skip(children)","skip = max(left) + max(right)"],"rows":[["leaf 3 (under 2)","3","0"],["node 2","2 + 0 = 2","max(3, 0) = 3"],["leaf 1","1","0"],["node 3 (right)","3 + 0 = 3","max(1, 0) = 1"],["root 3","3 + 3 + 1 = 7","max(2, 3) + max(3, 1) = 6"]],"result":"max(7, 6) = 7"}},"dp/bitmask":{"intuition":"When n is small (about 20 or less) and the state is \"which items are already used\", store that set as the bits of one integer: bit i = 1 means item i is used. Then `dp[mask]` = the answer when exactly the items in mask are used. There are only 2^n masks, so you can visit them all.\n\nExample (Beautiful Arrangement, n = 3): place numbers 1..3 into positions 1..3 so that each number divides its position or the position divides the number. dp[mask] = number of ways to fill the first popcount(mask) positions using exactly the numbers in mask. dp[000] = 1. Mask 011 ({1, 2}) fills positions 1 and 2: 1 at pos 2 works (dp[010] = 1) and 2 at pos 2 works (dp[001] = 1), so dp[011] = 2. In the end dp[111] = 3.\n\nOther examples: Partition to K Equal Sum Subsets (dp[mask] = how full the current bucket is), and the travelling salesman problem (dp[mask][last]).","approach":["Check that n is small (around 15-20). Number the items 0..n-1; mask bit i means item i is used.","Define dp[mask] (or dp[mask][last] when the last item matters) and set the start: dp[0] = 1 way, or 0 cost.","Go through masks in increasing order. For each item i in mask (mask >> i & 1), build from dp[mask ^ (1 << i)] if adding i last is allowed.","In the example, mask 011 -> position 2: from dp[010] (put 1 last) and dp[001] (put 2 last), so dp[011] = 2.","The answer is dp[(1 << n) - 1] (all items used), or the best over the last item."],"time":"O(2^n · n) (or O(2^n · n²) with a 'last' index)","space":"O(2^n) (or O(2^n · n))","identify":["n is tiny (n ≤ 16 or 20) and that small limit looks deliberate.","You need to try orders or groupings of all items, and plain backtracking would repeat the same 'used set' many times.","The future only depends on WHICH items are used (and maybe the last one), not on the order they were used.","Visit all nodes / assign every person a task / split into k equal groups."],"contrasts":[["Subsets / permutations listing","Return every subset -> backtracking."],["0/1 knapsack","Only the total matters, not which items -> dp over the sum."],["Single XOR / bit tricks","No DP over sets -> Bit Manipulation."]],"code":"class Solution {\n    // Beautiful Arrangement: dp[mask] = ways to fill positions 1..popcount(mask)\n    public int countArrangement(int n) {\n        int[] dp = new int[1 << n];\n        dp[0] = 1;\n        for (int mask = 1; mask < (1 << n); mask++) {\n            int pos = Integer.bitCount(mask);                 // position being filled\n            for (int i = 0; i < n; i++)\n                if ((mask >> i & 1) == 1 && ((i + 1) % pos == 0 || pos % (i + 1) == 0))\n                    dp[mask] += dp[mask ^ (1 << i)];          // number i+1 goes last\n        }\n        return dp[(1 << n) - 1];\n    }\n\n    // K equal subsets: fill[mask] = sum inside the current (unfinished) bucket\n    public boolean canPartitionKSubsets(int[] a, int k) {\n        int total = 0;\n        for (int v : a) total += v;\n        if (total % k != 0) return false;\n        int side = total / k, n = a.length;\n        int[] fill = new int[1 << n];\n        Arrays.fill(fill, -1);\n        fill[0] = 0;\n        for (int mask = 0; mask < (1 << n); mask++) {\n            if (fill[mask] < 0) continue;\n            for (int i = 0; i < n; i++)\n                if ((mask >> i & 1) == 0 && fill[mask] + a[i] <= side)\n                    fill[mask | 1 << i] = (fill[mask] + a[i]) % side;\n        }\n        return fill[(1 << n) - 1] == 0;\n    }\n}","example":{"problem":"Beautiful Arrangement","input":"n = 3","cols":["mask","numbers used","number placed last (allowed)","dp[mask]"],"rows":[["001","{1}","1 at pos 1","1"],["010","{2}","2 at pos 1","1"],["011","{1,2}","1 at pos 2, 2 at pos 2","2"],["100","{3}","3 at pos 1","1"],["101","{1,3}","1 at pos 2","1"],["110","{2,3}","2 at pos 2","1"],["111","{1,2,3}","1 at pos 3, 3 at pos 3","3"]],"result":"dp[111] = 3"}},"graph/msbfs":{"intuition":"Sometimes many cells start spreading at the same time: all rotten oranges, all gates, all water cells. Put ALL of them in the queue at distance 0 before the BFS starts. BFS then grows rings around every source together, so each cell is reached first by its nearest source. One BFS does the work of many.\n\nExample (Rotting Oranges): grid `[[2,1,1],[1,1,0],[0,1,1]]`. Only (0,0) is rotten at minute 0. Minute 1: (0,1) and (1,0) rot. Minute 2: (0,2) and (1,1). Minute 3: (2,1). Minute 4: (2,2). No fresh orange is left, so the answer is 4. If some fresh orange is never reached, the answer is -1.\n\nThe same template gives 01 Matrix (start from every 0), Walls and Gates (start from every gate) and As Far from Land (start from all land; the last ring is the answer).","approach":["Scan the grid once: push every source cell into the queue with distance 0 (and count the targets, like fresh oranges).","Process the queue level by level: one level = one minute or one step.","For each neighbour that is still unvisited (fresh / not yet given a distance), set its distance = current + 1, mark it and push it.","In the example, minute 1 rots (0,1) and (1,0) because both touch the first rotten orange.","At the end, read the answer: the number of levels (Rotting Oranges, As Far from Land), or the filled distance grid (01 Matrix, Highest Peak); check for unreached targets."],"time":"O(R · C)","space":"O(R · C)","identify":["Many starting points spread at the same speed: fire, rot, infection, signal, water.","For every cell you need the distance to the NEAREST special cell (nearest 0, nearest gate, nearest land).","Running a separate BFS from each source would be too slow (R · C sources × R · C cells).","'Minimum minutes until everything is reached' with several starts."],"contrasts":[["Shortest path from one source","Single start -> plain BFS."],["Count islands","Only connectivity -> DFS/BFS flood fill."],["Spread with different speeds or costs","Weighted -> Dijkstra with all sources at 0."]],"code":"class Solution {\n    public int orangesRotting(int[][] g) {\n        int R = g.length, C = g[0].length, fresh = 0, minutes = 0;\n        Deque<int[]> q = new ArrayDeque<>();\n        for (int r = 0; r < R; r++)\n            for (int c = 0; c < C; c++) {\n                if (g[r][c] == 2) q.offer(new int[]{r, c});     // all sources at time 0\n                else if (g[r][c] == 1) fresh++;\n            }\n        int[][] dirs = {{1, 0}, {-1, 0}, {0, 1}, {0, -1}};\n        while (!q.isEmpty() && fresh > 0) {\n            minutes++;\n            for (int s = q.size(); s > 0; s--) {                // one minute = one level\n                int[] cur = q.poll();\n                for (int[] d : dirs) {\n                    int nr = cur[0] + d[0], nc = cur[1] + d[1];\n                    if (nr < 0 || nc < 0 || nr >= R || nc >= C || g[nr][nc] != 1) continue;\n                    g[nr][nc] = 2; fresh--;\n                    q.offer(new int[]{nr, nc});\n                }\n            }\n        }\n        return fresh == 0 ? minutes : -1;\n    }\n\n    // As Far from Land: BFS from all land; distance of the last water cell reached\n    public int maxDistance(int[][] g) {\n        int n = g.length;\n        Deque<int[]> q = new ArrayDeque<>();\n        for (int r = 0; r < n; r++) for (int c = 0; c < n; c++) if (g[r][c] == 1) q.offer(new int[]{r, c});\n        if (q.isEmpty() || q.size() == n * n) return -1;\n        int[][] dirs = {{1, 0}, {-1, 0}, {0, 1}, {0, -1}};\n        int dist = -1;\n        while (!q.isEmpty()) {\n            dist++;\n            for (int s = q.size(); s > 0; s--) {\n                int[] cur = q.poll();\n                for (int[] d : dirs) {\n                    int r = cur[0] + d[0], c = cur[1] + d[1];\n                    if (r < 0 || c < 0 || r >= n || c >= n || g[r][c] != 0) continue;\n                    g[r][c] = 1;                                // visited\n                    q.offer(new int[]{r, c});\n                }\n            }\n        }\n        return dist;\n    }\n}","example":{"problem":"Rotting Oranges","input":"grid = [[2,1,1],[1,1,0],[0,1,1]]","cols":["minute","cells that rot this minute","fresh left"],"rows":[["0","(0,0) is rotten at the start","6"],["1","(0,1), (1,0)","4"],["2","(0,2), (1,1)","2"],["3","(2,1)","1"],["4","(2,2)","0"]],"result":"4 minutes"}},"graph/state":{"intuition":"Sometimes there is no graph in the input. The 'nodes' are whole situations (states): a word, a 4-digit lock code, a board square, a (cell, walls you can still break) pair. Two states are connected if one move turns one into the other. Since every move costs 1, BFS over these states gives the minimum number of moves. A visited set stops you from looking at the same state twice.\n\nExample (Word Ladder): begin = \"hit\", end = \"cog\", words = [hot, dot, dog, lot, log, cog]. Level 1: hit. Change one letter: level 2: hot. Level 3: dot, lot. Level 4: dog, log. Level 5: cog. So the ladder has 5 words.\n\nThe key step is generating the neighbours: for a word, try every position × every letter; for a lock, turn each of the 4 wheels up or down (8 neighbours). If the state has extra information (keys collected, removals left), put it into the state, e.g. (row, col, k).","approach":["Decide what one state is (a string, a number, or a tuple like (r, c, k)) and what one move is.","Push the start state, mark it visited. If the start is forbidden (a deadend), return -1 at once.","BFS level by level. For each popped state, generate every neighbour; skip forbidden or visited ones; mark and push the rest.","In the example, from 'hot' the neighbours in the word list are 'dot' and 'lot', so both go to level 3.","Return the level when the target state is generated; if the queue empties, the target cannot be reached."],"time":"O(states × moves per state)","space":"O(states)","identify":["'Minimum number of moves / steps / transformations' to go from one configuration to another.","The input gives rules for a move, not a list of edges (change one letter, turn one wheel, roll a dice).","Each move has the same cost.","Extra limits like 'you may break up to k walls' or 'collect all keys' -> add them to the state."],"contrasts":[["Shortest path in a grid","Nodes are just cells -> plain BFS."],["Count all ways to transform","Counting, not shortest -> DP or DFS + memo."],["Moves with different costs","Dijkstra over states."]],"code":"class Solution {\n    public int ladderLength(String begin, String end, List<String> words) {\n        Set<String> dict = new HashSet<>(words);\n        if (!dict.contains(end)) return 0;\n        Deque<String> q = new ArrayDeque<>();\n        q.offer(begin);\n        for (int level = 1; !q.isEmpty(); level++)\n            for (int s = q.size(); s > 0; s--) {\n                char[] w = q.poll().toCharArray();\n                for (int i = 0; i < w.length; i++) {\n                    char orig = w[i];\n                    for (char c = 'a'; c <= 'z'; c++) {\n                        w[i] = c;\n                        String nx = new String(w);\n                        if (nx.equals(end)) return level + 1;\n                        if (dict.remove(nx)) q.offer(nx);      // remove = mark visited\n                    }\n                    w[i] = orig;\n                }\n            }\n        return 0;\n    }\n\n    public int openLock(String[] deadends, String target) {\n        Set<String> seen = new HashSet<>(Arrays.asList(deadends));\n        if (seen.contains(\"0000\")) return -1;\n        seen.add(\"0000\");\n        Deque<String> q = new ArrayDeque<>();\n        q.offer(\"0000\");\n        for (int moves = 0; !q.isEmpty(); moves++)\n            for (int s = q.size(); s > 0; s--) {\n                String cur = q.poll();\n                if (cur.equals(target)) return moves;\n                char[] w = cur.toCharArray();\n                for (int i = 0; i < 4; i++) {\n                    char orig = w[i];\n                    for (int step : new int[]{1, 9}) {         // +1 or -1 (mod 10)\n                        w[i] = (char) ('0' + (orig - '0' + step) % 10);\n                        String nx = new String(w);\n                        if (seen.add(nx)) q.offer(nx);\n                    }\n                    w[i] = orig;\n                }\n            }\n        return -1;\n    }\n}","example":{"problem":"Word Ladder","input":"begin = \"hit\", end = \"cog\", words = [hot, dot, dog, lot, log, cog]","cols":["level","words in this level"],"rows":[["1","hit"],["2","hot"],["3","dot, lot"],["4","dog, log"],["5","cog (target)"]],"result":"5 words in the shortest ladder"}}}}

/* ---------- legacy id migration (older positional ids -> slugs) ---------- */

/** Hamilton largest-remainder split of n items over weights. */
function allocate(weights, n) {
  const tw = weights.reduce((a, b) => a + b, 0);
  if (!tw) return weights.map(() => 0);
  const exact = weights.map(w => n * w / tw);
  const base = exact.map(Math.floor);
  let left = n - base.reduce((a, b) => a + b, 0);
  const order = exact.map((e, i) => ({ i, f: e - base[i] })).sort((a, b) => b.f - a.f || a.i - b.i);
  for (let k = 0; k < left; k++) base[order[k % order.length].i]++;

}

/* ---------- state ---------- */

function baseState() {

let schedule = null;

function wdOfDay(d, start, s) { return start ? addDays(start, d - 1).getDay() : ((s.startWd + d - 1) % 7 + 7) % 7; }

 * Day-by-day plan inside an hour budget.

function simulate(mult, endDay) {

  const budget = d => Math.round((we(d) ? s.weHours : s.wdHours) * 60 * (endDay != null && d <= endDay ? mult : 1));

    finishSignIn(create, create ? 'Account created' : 'Signed in');
  } catch (err) {
    if (!err.offline) { showToast(err.message); return; }
    const accounts = localAccounts();
    if (create) {
      if (accounts[id]) { showToast('That account already exists in this browser.'); return; }
      state.doneQ = {}; state.doneRev = {}; state.doneCore = {};
    } else if (!accounts[id] || accounts[id].passwordHash !== passwordHash) { showToast('Sign-in failed. Check the details, or create the account in this browser.'); return; }
    else if (accounts[id].progress) applyProgress(accounts[id].progress);
    session = { id, mobile: mobile.replace(/\D/g, ''), name, token, passwordHash };
    finishSignIn(create, create ? 'Account created in this browser' : 'Signed in');
  }
}
function refreshFilePreview() { $('#accFilePreview').textContent = userId($('#accMobile').value, $('#accName').value) || 'mobile_name'; }
$('#accMobile').addEventListener('input', refreshFilePreview);
$('#accName').addEventListener('input', refreshFilePreview);
$('#accPassToggle').addEventListener('click', () => { const i = $('#accPass'); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; $('#accPassToggle').textContent = show ? 'Hide' : 'Show'; });
$('#accountModal').addEventListener('click', e => { if (e.target.id === 'accountModal') closeAccount(); });
$('#accountForm').addEventListener('submit', e => { e.preventDefault(); submitAccount(false); });
$('#btnRegister').addEventListener('click', () => submitAccount(true));
$('#btnCloseAccount').addEventListener('click', closeAccount);
$('#btnAccount').addEventListener('click', () => {
  if (session && session.id) { session = null; localStorage.removeItem(SESSION_KEY); renderWho(); return; }
  openAccount();
});
$('#btnTheme').addEventListener('click', () => { state.theme = state.theme === 'dark' ? 'light' : 'dark'; saveState(); applyTheme(); });
$('#btnMenu').addEventListener('click', () => $('#sidebar').classList.toggle('open'));

/* ---------- test hook ---------- */
window.__DSA__ = {
  todayPlan: () => { const p = todayPlan(); return { t: p.t, mode: p.mode, items: p.items.length, done: p.done, over: p.over.length, newIds: p.items.filter(i => i.kind === 'q').map(i => i.q.id), revKeys: p.items.filter(i => i.kind === 'rev').map(i => i.r.key) }; },
  get state() { return state; },
  get schedule() { return schedule; },
  DATA, recompute, migrateProgress, openGuide, closeGuide,
  dayStats() { return { weekday: schedule.weekday, weekend: schedule.weekend, days: schedule.days, mult: schedule.mult, overBudget: schedule.overBudget }; },
  setSettings(s) { state.settings = cleanSettings({ ...state.settings, ...s }); saveState(); recompute(); renderAll(); },
  counts() {
    return {
      questions: Q.length, must: Q.filter(q => q.imp === 'M').length, good: Q.filter(q => q.imp === 'G').length,
      core: CORE.length, coreUnique: CORE_SET.size, revisions: schedule.revisions.length, dpQuestions: Q.filter(q => q.patternKey === 'dp').length,
      patterns: DATA.patterns.length, subPatterns: Object.keys(SUB).length, guides: Object.keys(DATA.guides || {}).length,
      groups: (DATA.groups || []).length, grouped: Q.filter(q => q.grp).length,
      dsaDays: schedule.dsaDays, coreDays: schedule.coreDays, totalDays: schedule.lastDay,
    };
  },
};

async function boot() {
  if (session && session.id) await restoreSession();
  if (migrationJustNow) { lastSavedPayload = ''; }
  saveState();
  recompute();
  renderAll();
  if (migrationJustNow) showToast(`${migrationJustNow} earlier ticks were matched to the current questions`);
}
boot();
})();
</script>
